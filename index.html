function renderOverlapBadge(overlapLevel) {
  if (overlapLevel === 'high') return `<div class="overlap-badge overlap-high-badge">hoge overlap</div>`;
  if (overlapLevel === 'moderate') return `<div class="overlap-badge overlap-moderate-badge">lichte overlap</div>`;
  return '';
}

/**
 * Geeft de CSS-class voor de gekleurde rand van een nood-optie-knop op basis van
 * overlapLevel (groen/geel/oranje-rood). De 'gekozen'-optie krijgt altijd de goud-
 * rand van de bestaande selectie-stijl, die wint dus in de CSS van de overlap-kleur.
 * @param {OverlapLevel} overlapLevel
 * @returns {string}
 */
function overlapRandKlasse(overlapLevel) {
  if (overlapLevel === 'high') return 'overlap-high';
  if (overlapLevel === 'moderate') return 'overlap-moderate';
  return 'overlap-none';
}

function renderNoodKeuzeScherm(dag) {
  setHeader(`Loggen · ${dag.kort.replace('\n', ' ')}`, "Kies je invulling voor vandaag", [
    { label: 'Home', action: () => go('home') },
    { label: 'Trainen', action: () => go('trainen') },
    { label: 'Loggen', action: () => {} }
  ]);

  // Stap 1 (skill) is de eerste keuze — er is nog niets belast, dus geen sortering nodig.
  // Stap 1 (skill) is de eerste keuze — er is nog niets belast, dus altijd 'geen overlap'.
  const skillOpties = NOODVERSIE_KEUZES.skill.map(o => `
    <button class="nood-optie overlap-none ${noodKeuze.skill && noodKeuze.skill.naam === o.naam ? 'gekozen' : ''}" onclick="kiesNoodSkill('${o.naam.replace(/'/g, "\\'")}')">
      <div class="nood-optie-dag">${o.dag}</div>
      <div class="nood-optie-naam">${o.naam}</div>
      <div class="nood-optie-target">${o.target}</div>
    </button>
  `).join('');

  // Stap 2 (strength) sorteert op overlap met de skill-keuze uit stap 1.
  const strengthGesorteerd = sorteerNoodOptiesOpOverlap(NOODVERSIE_KEUZES.strength, bouwHitMusclesUit([noodKeuze.skill]));
  const strengthOpties = strengthGesorteerd.map(o => {
    const isGekozen = noodKeuze.strength && noodKeuze.strength.naam === o.naam;
    return `
    <button class="nood-optie ${overlapRandKlasse(o.overlapLevel)} ${isGekozen ? 'gekozen' : ''}" onclick="kiesNoodStrength('${o.naam.replace(/'/g, "\\'")}')">
      <div class="nood-optie-dag">${o.dag}</div>
      <div class="nood-optie-naam">${o.naam}</div>
      <div class="nood-optie-target">${o.target}${o.gewicht ? ` · ${o.gewicht}kg` : ''}</div>
      ${renderOverlapBadge(o.overlapLevel)}
    </button>
  `;
  }).join('');

  const dagenMetHypertrophy = Object.keys(NOODVERSIE_KEUZES.hypertrophy);
  const dagKeuzeHtml = dagenMetHypertrophy.map(dagNaam => `
    <button class="nood-optie compact ${noodKeuze.hypertrophyDag === dagNaam ? 'gekozen' : ''}" onclick="kiesNoodHypertrophyDag('${dagNaam}')">
      <div class="nood-optie-naam">${dagNaam}</div>
    </button>
  `).join('');

  // Stap 3 (hypertrophy) sorteert op overlap met ZOWEL de skill- als de strength-keuze
  // samen — noodKeuze.hitMuscles is cumulatief, dus dit gebeurt automatisch.
  let hypertrophyOefeningHtml = '';
  if (noodKeuze.hypertrophyDag) {
    const lijst = NOODVERSIE_KEUZES.hypertrophy[noodKeuze.hypertrophyDag];
    const hypertrophyGesorteerd = sorteerNoodOptiesOpOverlap(lijst, bouwHitMusclesUit([noodKeuze.skill, noodKeuze.strength]));
    hypertrophyOefeningHtml = `
      <div class="nood-substap">
        ${hypertrophyGesorteerd.map(o => {
          const isGekozen = noodKeuze.hypertrophy && noodKeuze.hypertrophy.naam === o.naam;
          return `
          <button class="nood-optie ${overlapRandKlasse(o.overlapLevel)} ${isGekozen ? 'gekozen' : ''}" onclick="kiesNoodHypertrophyOefening('${o.naam.replace(/'/g, "\\'")}')">
            <div class="nood-optie-naam">${o.naam}</div>
            <div class="nood-optie-target">${o.target}${o.gewicht ? ` · ${o.gewicht}kg` : ''}</div>
            ${renderOverlapBadge(o.overlapLevel)}
          </button>
        `;
        }).join('')}
      </div>
    `;
  }


  const alleKeuzesGemaakt = noodKeuze.skill && noodKeuze.strength && noodKeuze.hypertrophy;

  app.innerHTML = `
    <div class="nood-keuze-blok">
      <div class="nood-keuze-titel">1. Skill-hold ${noodKeuze.skill ? '✓' : ''}</div>
      <div class="nood-optie-grid">${skillOpties}</div>
    </div>
    <div class="nood-keuze-blok">
      <div class="nood-keuze-titel">2. Strength ${noodKeuze.strength ? '✓' : ''}</div>
      <div class="nood-optie-grid">${strengthOpties}</div>
    </div>
    <div class="nood-keuze-blok">
      <div class="nood-keuze-titel">3. Hypertrophy — kies eerst de dag ${noodKeuze.hypertrophy ? '✓' : ''}</div>
      <div class="nood-optie-grid compact-grid">${dagKeuzeHtml}</div>
      ${hypertrophyOefeningHtml}
    </div>
    ${alleKeuzesGemaakt ? `
      <div class="block">
        <button class="btn primary full" onclick="renderLoggen('${dag.id}')">Start met loggen</button>
      </div>
    ` : `
      <div class="nood-keuze-hint">Maak alle 3 keuzes om te starten.</div>
    `}
  `;
}

function kiesNoodSkill(naam) {
  // Nogmaals klikken op de al-gekozen optie vinkt 'm weer af.
  if (noodKeuze.skill && noodKeuze.skill.naam === naam) {
    noodKeuze.skill = null;
  } else {
    const gekozen = NOODVERSIE_KEUZES.skill.find(o => o.naam === naam);
    if (!gekozen) return;
    noodKeuze.skill = gekozen;
  }
  herberekenNoodHitMuscles();
  renderNoodKeuzeScherm(huidigLogDag || SCHEMA.dagen.find(d => d.isNoodtraining));
}

function kiesNoodStrength(naam) {
  if (noodKeuze.strength && noodKeuze.strength.naam === naam) {
    noodKeuze.strength = null;
  } else {
    const gekozen = NOODVERSIE_KEUZES.strength.find(o => o.naam === naam);
    if (!gekozen) return;
    noodKeuze.strength = gekozen;
  }
  herberekenNoodHitMuscles();
  renderNoodKeuzeScherm(huidigLogDag || SCHEMA.dagen.find(d => d.isNoodtraining));
}

function kiesNoodHypertrophyDag(dagNaam) {
  noodKeuze.hypertrophyDag = dagNaam;
  noodKeuze.hypertrophy = null; // reset de oefening-keuze als de dag wisselt
  herberekenNoodHitMuscles();
  renderNoodKeuzeScherm(huidigLogDag || SCHEMA.dagen.find(d => d.isNoodtraining));
}

function kiesNoodHypertrophyOefening(naam) {
  if (noodKeuze.hypertrophy && noodKeuze.hypertrophy.naam === naam) {
    noodKeuze.hypertrophy = null;
  } else {
    const gekozen = NOODVERSIE_KEUZES.hypertrophy[noodKeuze.hypertrophyDag].find(o => o.naam === naam);
    if (!gekozen) return;
    noodKeuze.hypertrophy = gekozen;
  }
  herberekenNoodHitMuscles();
  renderNoodKeuzeScherm(huidigLogDag || SCHEMA.dagen.find(d => d.isNoodtraining));
}

/**
 * Herberekent noodKeuze.hitMuscles volledig opnieuw vanuit de huidige (nog actieve)
 * keuzes, in plaats van cumulatief bij te werken. Dit is nodig omdat een keuze nu
 * weer afgevinkt kan worden — de spiergroepen van een ingetrokken keuze mogen dan
 * niet blijven "hangen" in hitMuscles, maar een spiergroep die ook via een ANDERE,
 * nog actieve keuze belast is moet wel behouden blijven. Simpelweg optellen bij elke
 * keuze en aftrekken bij het afvinken zou dat tweede geval fout doen; volledig
 * herberekenen vanuit de resterende keuzes is de robuuste aanpak.
 */
/**
 * Bouwt een HitMuscles-object op uit een subset van de gemaakte keuzes (bv. alleen
 * skill, of skill+strength). Wordt gebruikt om per stap alleen de ECHT voorgaande
 * categorieën mee te tellen — nooit de categorie waar je zelf middenin zit, anders
 * zou een net-gekozen optie zichzelf (en de andere opties in diezelfde stap) als
 * "hoge overlap" gaan zien.
 * @param {Array<{naam: string}|null>} keuzes
 * @returns {HitMuscles}
 */
function bouwHitMusclesUit(keuzes) {
  let hitMuscles = leegHitMuscles();
  keuzes.forEach(optie => {
    if (!optie) return;
    const exerciseData = vindExerciseData(optie.naam);
    if (!exerciseData) return;
    hitMuscles = voegOefeningToeAanHitMuscles(hitMuscles, exerciseData);
  });
  return hitMuscles;
}

/**
 * Werkt noodKeuze.hitMuscles bij tot de VOLLEDIGE cumulatieve stand (skill+strength+
 * hypertrophy samen). Dit veld wordt niet meer gebruikt om de kleur/badge van losse
 * stappen te bepalen (dat gebeurt nu per stap met bouwHitMusclesUit, zie
 * sorteerNoodOptiesOpOverlap) — het blijft wel beschikbaar als totaaloverzicht, mocht
 * dat later ergens getoond worden.
 */
function herberekenNoodHitMuscles() {
  noodKeuze.hitMuscles = bouwHitMusclesUit([noodKeuze.skill, noodKeuze.strength, noodKeuze.hypertrophy]);
}
/**
 * Combineert een lijst NOODVERSIE_KEUZES-opties (die geen spiergroep-velden hebben)
 * met hun EXERCISES-tegenhanger, filtert/sorteert op overlap met noodKeuze.hitMuscles,
 * en geeft de ORIGINELE optie-objecten terug (met naam/target/rust/etc. intact) plus
 * een toegevoegd overlapLevel-veld — zodat de bestaande render/kies-functies verder
 * ongewijzigd blijven werken op dezelfde objectvorm.
 * @param {Array<{naam: string}>} opties
 * @returns {Array<Object & {overlapLevel: OverlapLevel}>}
 */
/**
 * Berekent per optie het overlapLevel t.o.v. noodKeuze.hitMuscles, maar behoudt de
 * OORSPRONKELIJKE volgorde van de lijst (geen sortering) — de kaarten mogen niet van
 * plek wisselen zodra er een keuze wordt gemaakt, alleen de kleur/badge verandert.
 * @param {Array<{naam: string}>} opties
 * @returns {Array<Object & {overlapLevel: OverlapLevel}>}
 */
/**
 * Berekent per optie het overlapLevel t.o.v. de gegeven hitMuscles (van ALLEEN de
 * werkelijk voorgaande stappen — zie bouwHitMusclesUit), maar behoudt de OORSPRONKELIJKE
 * volgorde van de lijst (geen sortering) — de kaarten mogen niet van plek wisselen
 * zodra er een keuze wordt gemaakt, alleen de kleur/badge verandert.
 * @param {Array<{naam: string}>} opties
 * @param {HitMuscles} hitMuscles
 * @returns {Array<Object & {overlapLevel: OverlapLevel}>}
 */
function sorteerNoodOptiesOpOverlap(opties, hitMuscles) {
  return opties.map(optie => {
    const exerciseData = vindExerciseData(optie.naam);
    // Geen match gevonden -> geen spiergroep-info, dus geen overlap te detecteren.
    const dummy = exerciseData || { primaryMuscles: [], secondaryMuscles: [] };
    const overlapLevel = bepaalOverlapNiveau(dummy, hitMuscles);
    return { ...optie, overlapLevel };
  });
}

/** Oefeningen voor het progressie-overzicht, gegroepeerd zoals in het schema: skills apart van kracht, hypertrofie en benen. */
function progressieGroepen() {
  const gezien = new Set();
  const groepen = [
    { titel: 'Skills', sleutel: 'skill', namen: [] },
    { titel: 'Kracht', sleutel: 'strength', namen: [] },
    { titel: 'Hypertrofie', sleutel: 'hypertrophy', namen: [] },
    { titel: 'Benen', sleutel: 'legs', namen: [] }
  ];
  SCHEMA.dagen.forEach(dag => {
    if (dag.skill && dag.skill.oefeningen) dag.skill.oefeningen.forEach(o => { if (ALLE_OEFENINGEN.includes(o.naam) && !gezien.has(o.naam)) { gezien.add(o.naam); groepen[0].namen.push(o.naam); } });
    ['strength', 'hypertrophy', 'legs'].forEach((k, i) => (dag[k] || []).forEach(o => { if (ALLE_OEFENINGEN.includes(o.naam) && !gezien.has(o.naam)) { gezien.add(o.naam); groepen[i + 1].namen.push(o.naam); } }));

}

/**
 * Haalt in ÉÉN Firestore-call alle logs van de gebruiker op en groepeert ze
 * client-side per oefeningnaam, zodat het overzicht niet voor elke tegel een
 * losse query hoeft te doen. Geeft per oefening alleen het laatste (meest
 * recente) datapunt terug, wat is wat het overzicht nodig heeft.
 * @returns {Promise<{waarden: Object<string, {gewicht: number}>, debugInfo: string}>}
 */
async function haalLaatsteWaardePerOefeningOp() {
  if (!window.firebaseDb) return { waarden: {}, debugInfo: 'firebaseDb is nog niet geladen (Firebase-script niet klaar).' };
  if (!window.firebaseAuth) return { waarden: {}, debugInfo: 'firebaseAuth is nog niet geladen.' };
  if (!window.firebaseAuth.huidigeUser()) return { waarden: {}, debugInfo: 'Geen ingelogde gebruiker gevonden op het moment van ophalen.' };

  const logs = await window.firebaseDb.haalAlleLogsOp(); // al gesorteerd oud → nieuw
  const laatste = {};
  logs.forEach(log => {
    const maxGewicht = Math.max(0, ...(log.sets || []).map(s => parseFloat(s.gewicht) || 0));
    laatste[log.oefeningNaam] = { gewicht: maxGewicht }; // latere logs overschrijven eerdere, dus dit blijft de meest recente
  });
  const debugInfo = `${logs.length} document(en) opgehaald uit Firestore, ${Object.keys(laatste).length} unieke oefeningnamen daarin gevonden.`;
  return { waarden: laatste, debugInfo };
}

/**
 * Haalt alle Firestore-logs van één oefening op en zet ze om naar de vorm die
 * tekenChart al verwacht: één punt per SESSIE (dag), met het HOOGSTE gewicht en de
 * meeste reps/seconden van die dag (de "topset"), gesorteerd oud → nieuw.
 * @param {string} oefeningNaam
 * @returns {Promise<Array<{datum: string, gewicht: number, topReps: number}>>}
 */
async function haalProgressieDataOp(oefeningNaam, logsVoorraad) {
  if (!window.firebaseDb || !window.firebaseAuth || !window.firebaseAuth.huidigeUser()) return [];
  const logs = logsVoorraad || await window.firebaseDb.haalLogsOp(oefeningNaam);

  // Groepeer per dag (yyyy-mm-dd), want er kunnen meerdere sets/documenten per sessie zijn.
  const perDag = {};
  logs.forEach(log => {
    if (!log.aangemaaktOp || !log.aangemaaktOp.toDate) return; // serverTimestamp nog niet uitgeschreven
    const datum = log.aangemaaktOp.toDate().toISOString().slice(0, 10);
    if (!perDag[datum]) perDag[datum] = { maxGewicht: 0, maxReps: 0 };
    (log.sets || []).forEach(set => {
      const reps = parseFloat(set.reps) || 0;
      const gewicht = parseFloat(set.gewicht) || 0;
      if (reps > perDag[datum].maxReps) perDag[datum].maxReps = reps;
      if (gewicht > perDag[datum].maxGewicht) perDag[datum].maxGewicht = gewicht;
    });
  });

  return Object.keys(perDag).sort().map(datum => ({
    datum,
    gewicht: perDag[datum].maxGewicht,
    topReps: perDag[datum].maxReps
  }));
}

let geschiedenisCache = null;
let geschiedenisWeergave = { alleTrainingen: false, alleBeslissingen: false };
const TRAININGEN_STANDAARD = 10;
const BESLISSINGEN_STANDAARD = 6;

function htmlEsc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function tsNaarMs(v) {
  if (v && typeof v.toMillis === 'function') return v.toMillis();
  return typeof v === 'number' ? v : null;
}
function datumTekst(ms) {
  return typeof ms === 'number' ? new Date(ms).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) : 'onbekende datum';
}

/** Welke oefening-id's horen bij deze naam? Zelfde afleiding als bij het loggen (exerciseIdVoor). */
function oefeningRefsVoorNaam(naam) {
  const refs = [];
  const gezien = new Set();
  SCHEMA.dagen.forEach(dag => {
    [...((dag.skill && dag.skill.oefeningen) || []), ...(dag.strength || []), ...(dag.hypertrophy || []), ...(dag.legs || [])].forEach(o => {
      if (o.naam !== naam) return;
      const item = Object.assign({}, o, { dagId: dag.id });
      const config = bouwEngineConfig(item);
      const id = exerciseIdVoor(item, config);
      if (gezien.has(id)) return;
      gezien.add(id);
      refs.push({ id, config });
    });
  });
  return refs;
}

async function haalGeschiedenisOp(oefeningNaam, logsRuw) {
  const H = window.ProgressieHistorie;
  const fp = window.firebaseProgressie;
  const info = OEFENING_EENHEID[oefeningNaam] || { eenheid: 'reps' };
  const drempel = window.PROGRAM_CONFIG && window.PROGRAM_CONFIG._meta && window.PROGRAM_CONFIG._meta.stagnatie
    ? window.PROGRAM_CONFIG._meta.stagnatie.sessiesAchtereen : 3;
  const logs = logsRuw.map(l => Object.assign({}, l, { aangemaaktOp: tsNaarMs(l.aangemaaktOp) }));
  const resultaat = { oefeningen: [], trainingen: [], fouten: 0 };
  const setDocs = [];
  const verworpen = [];
  for (const ref of oefeningRefsVoorNaam(oefeningNaam)) {
    try {
      const [sets, beslissingenRuw, state] = await Promise.all([
        fp.haalSetsVanOefeningOp(ref.id), fp.haalDecisionsVanOefeningOp(ref.id), fp.haalExerciseStateOp(ref.id)
      ]);
      setDocs.push(...sets.map(s => Object.assign({}, s, { aangemaaktOp: tsNaarMs(s.aangemaaktOp) })));
      const decisions = beslissingenRuw.map(d => Object.assign({}, d, { timestamp: tsNaarMs(d.timestamp) }));
      decisions.forEach(d => { if (d.vervangenDoor === 'verworpen' && d.sessionId) verworpen.push(d.sessionId); });
      resultaat.oefeningen.push({
        ref, state,
        geschiedenis: H.bouwNiveauGeschiedenis({ config: ref.config, state: state || {}, decisions, stagnatieDrempel: drempel })
      });
    } catch (e) {
      console.error('Geschiedenis laden mislukt voor', ref.id, e);
      resultaat.fouten++;
    }
  }
  resultaat.trainingen = H.groepeerTrainingen({ logs, setDocs, eenheid: info.eenheid, verworpenSessies: verworpen });
  return resultaat;
}

function laadGeschiedenisSectie(oefeningNaam, logsRuw) {
  geschiedenisCache = null;
  geschiedenisWeergave = { alleTrainingen: false, alleBeslissingen: false };
  const el = document.getElementById('geschiedenisSectie');
  if (el) el.innerHTML = `<div class="chart-card"><div class="chart-sub">Niveaus en trainingen laden…</div></div>`;
  if (!window.ProgressieHistorie || !window.firebaseProgressie) return;
  haalGeschiedenisOp(oefeningNaam, logsRuw).then(res => {
    if (window.location.hash !== `#progressie/${encodeURIComponent(oefeningNaam)}`) return;
    geschiedenisCache = { naam: oefeningNaam, ...res };
    renderGeschiedenisSectie();
  }).catch(e => {
    console.error('Geschiedenis laden mislukt:', e);
    const el2 = document.getElementById('geschiedenisSectie');
    if (el2) el2.innerHTML = `<div class="chart-card"><div class="chart-sub">Niveaugeschiedenis kon niet worden geladen. Check je internetverbinding.</div></div>`;
  });
}

function wisselGeschiedenisLijst(welke) {
  geschiedenisWeergave[welke] = !geschiedenisWeergave[welke];
  renderGeschiedenisSectie();
}

const BESLISSING_STATUS = {
  automatisch: 'Automatisch doorgevoerd',
  bevestigd: 'Bevestigd door jou',
  overruled: 'Door jou aangepast',
  open: 'Voorstel, niet bevestigd',
  geen_wijziging: 'Geen niveauwijziging',
  vervangen: 'Vervangen door herberekening',
  verworpen: 'Training niet opgeslagen'
};

function renderNiveauKaart(o) {
  const H = window.ProgressieHistorie;
  const g = o.geschiedenis;
  const config = o.ref.config;
  const heeftLadder = Array.isArray(config.ladder) && config.ladder.length > 0;
  const state = o.state || {};

  let kop = '';
  if (heeftLadder) {
    kop = `<div class="gesch-huidig">Nu: <b>${htmlEsc(g.huidig.label)}</b>${g.huidig.vanaf ? ` <span class="sv-dim">sinds ${datumTekst(g.huidig.vanaf)}</span>` : ''}</div>`;
  } else {
    kop = `<div class="sv-dim">Voor deze oefening zijn nog geen niveaus ingesteld (program.json), dus er zijn geen niveauwijzigingen. De beslissingen per training staan hieronder.</div>`;
  }
  kop += renderStagnatieKaart(window.ProgressieEngine.bepaalStagnatie(config, state, { drempel: stagnatieDrempelUitConfig() }));
  if (state.awaitingTest) kop += `<div class="sv-niveau">Een testpoging staat gepland voor je volgende training van deze oefening.</div>`;
  if (state.painBlocked) kop += `<div class="sv-waarschuwing">Pijnblokkade actief: geen progressie totdat je twee opeenvolgende trainingen pijnvrij bent.</div>`;

  const niveausHtml = heeftLadder && g.wijzigingen.length > 0 ? `
    <div class="sv-kop">Niveaus</div>
    <div class="gesch-lijst">${g.niveaus.map(n => `
      <div class="gesch-rij">
        <span class="gesch-rij-hoofd">${htmlEsc(n.label)}</span>
        <span class="sv-dim">${n.vanaf ? datumTekst(n.vanaf) : 'begin'} – ${n.tot ? datumTekst(n.tot) : 'nu'} · ${n.sessies} ${n.sessies === 1 ? 'training' : 'trainingen'}</span>
      </div>`).join('')}</div>
    <div class="sv-kop">Wijzigingen</div>
    <div class="gesch-lijst">${g.wijzigingen.slice().reverse().map(w => `
      <div class="gesch-rij">
        <span class="gesch-rij-hoofd">${w.richting === 'omhoog' ? '↑' : '↓'} ${htmlEsc(w.vanLabel)} → ${htmlEsc(w.naarLabel)}</span>
        <span class="sv-dim">${datumTekst(w.at)} · ${htmlEsc(BRON_TEKST[w.bron] || w.bron || '')}</span>
        ${w.ruleId ? `<span class="sv-dim">Regel: ${htmlEsc(w.ruleId)}</span>` : ''}
      </div>`).join('')}</div>` : (heeftLadder ? `<div class="sv-dim" style="margin-top:8px;">Nog geen niveauwijzigingen.</div>` : '');

  const stagnatieHtml = g.stagnatieperiodes.length ? `
    <div class="sv-kop">Stagnatie</div>
    <div class="gesch-lijst">${g.stagnatieperiodes.map(s => `
      <div class="gesch-rij">
        <span class="gesch-rij-hoofd">${s.sessies} trainingen zonder vooruitgang</span>
        <span class="sv-dim">${datumTekst(s.vanAt)} – ${s.lopend ? 'nu' : datumTekst(s.totAt)}${s.lopend ? ' (loopt nog)' : ''}</span>
      </div>`).join('')}</div>` : '';

  const alle = geschiedenisWeergave.alleBeslissingen;
  const zichtbaar = alle ? g.beslissingen : g.beslissingen.slice(0, BESLISSINGEN_STANDAARD);
  const beslissingenHtml = g.beslissingen.length ? `
    <div class="sv-kop">Progressiebeslissingen</div>
    <div class="gesch-lijst">${zichtbaar.map(b => {
      const status = BESLISSING_STATUS[b.status] || b.status;
      const extra = b.status === 'overruled' && b.overruleKeuze ? ` (${OVERRULE_LABELS[b.overruleKeuze] || b.overruleKeuze})` : '';
      const wijziging = b.niveauWijziging ? ` · ${htmlEsc(b.niveauWijziging.vanLabel)} → ${htmlEsc(b.niveauWijziging.naarLabel)}` : '';
      return `<div class="gesch-rij ${b.status === 'vervangen' || b.status === 'verworpen' ? 'gesch-vervallen' : ''}">
        <span class="gesch-rij-hoofd">${htmlEsc(SV_TITELS[b.decision] || b.decision || 'Beslissing')} <span class="sv-dim">· ${datumTekst(b.at)}</span></span>
        <span class="sv-dim">${htmlEsc(status + extra)}${wijziging}</span>
        ${b.reasonText ? `<span class="gesch-reden">${htmlEsc(b.reasonText)}</span>` : ''}
        ${b.ruleId ? `<span class="sv-dim">Regel: ${htmlEsc(b.ruleId)}</span>` : ''}
      </div>`;
    }).join('')}</div>
    ${g.beslissingen.length > BESLISSINGEN_STANDAARD ? `<button class="btn ghost full" style="margin-top:8px;" onclick="wisselGeschiedenisLijst('alleBeslissingen')">${alle ? 'Toon minder' : `Toon alle ${g.beslissingen.length} beslissingen`}</button>` : ''}` : '';

  return `<div class="chart-card gesch-kaart">
    <div class="gesch-titel">Niveau en beslissingen</div>
    ${kop}${niveausHtml}${stagnatieHtml}${beslissingenHtml}
  </div>`;
}

function renderTrainingenKaart(trainingen, eenheid) {
  if (!trainingen.length) return '';
  const alle = geschiedenisWeergave.alleTrainingen;
  const zichtbaar = alle ? trainingen : trainingen.slice(0, TRAININGEN_STANDAARD);
  const eenheidTekst = eenheid === 'sec' ? 'sec' : 'reps';
  const rijen = zichtbaar.map(t => {
    const setsHtml = t.sets.length ? t.sets.map(s => {
      const delen = [
        s.waarde !== null ? `${s.waarde} ${eenheidTekst}` : '–',
        s.load ? `${s.load} kg` : '',
        s.rir !== null ? `RIR ${s.rir}` : '',
        s.vorm ? htmlEsc(s.vorm) : '',
        s.pijn ? 'pijn' : ''
      ].filter(Boolean).join(' · ');
      return `<div class="sv-set"><span class="sv-nr">${s.type === 'test' ? 'T' : (s.n === null ? '·' : s.n)}</span><span class="sv-tekst">${delen}</span>${s.setClass ? `<span class="feedback-chip ${setClassNaarKleurKlasse(s.setClass)}">${htmlEsc(s.setClass)}</span>` : ''}</div>`;
    }).join('') : `<div class="sv-dim">Geen sets vastgelegd.</div>`;
    const samenvatting = t.beste !== null ? `${t.sets.length} sets · beste ${t.beste} ${eenheidTekst}` : `${t.sets.length} sets`;
    return `<details class="gesch-training">
      <summary><span class="gesch-rij-hoofd">${datumTekst(t.at)}${t.dagNaam ? ` · ${htmlEsc(t.dagNaam)}` : ''}</span><span class="sv-dim">${samenvatting}${t.verworpen ? ' · niet opgeslagen' : ''}</span></summary>
      <div class="sv-sets" style="margin-top:8px;">${setsHtml}</div>
      ${t.notitie ? `<div class="sv-dim" style="margin-top:8px;">Notitie: ${htmlEsc(t.notitie)}</div>` : ''}
      ${t.bron === 'logs' ? `<div class="sv-dim" style="margin-top:8px;">Oudere training: één RIR en vorm voor de hele oefening, geen beoordeling per set.</div>` : ''}
    </details>`;
  }).join('');
  return `<div class="chart-card gesch-kaart">
    <div class="gesch-titel">Alle trainingen (${trainingen.length})</div>
    ${rijen}
    ${trainingen.length > TRAININGEN_STANDAARD ? `<button class="btn ghost full" style="margin-top:8px;" onclick="wisselGeschiedenisLijst('alleTrainingen')">${alle ? 'Toon minder' : `Toon alle ${trainingen.length} trainingen`}</button>` : ''}
  </div>`;
}

function renderGeschiedenisSectie() {
  const el = document.getElementById('geschiedenisSectie');
  if (!el || !geschiedenisCache) return;
  const g = geschiedenisCache;
  const info = OEFENING_EENHEID[g.naam] || { eenheid: 'reps' };
  const fout = g.fouten > 0 ? `<div class="sv-waarschuwing">Een deel van de niveaugeschiedenis kon niet worden geladen.</div>` : '';
  el.innerHTML = fout + g.oefeningen.map(renderNiveauKaart).join('') + renderTrainingenKaart(g.trainingen, info.eenheid);
}

function zetProgressiePeriode(p) {
  progressieWeergave.periode = p;
  renderProgressieDetail(progressieWeergave._voorOefening);
}

function toggleProgressieLaag(laag) {
  // Minstens één laag moet altijd aan blijven staan.
  const andereLaag = laag === 'toonSets' ? 'toonGewicht' : 'toonSets';
  if (progressieWeergave[laag] && !progressieWeergave[andereLaag]) return;
  progressieWeergave[laag] = !progressieWeergave[laag];
  renderProgressieDetail(progressieWeergave._voorOefening);
}

function tekenChart(oefeningNaam) {
  const volledigeData = VOORBEELD_HISTORIE[oefeningNaam];
  if (!volledigeData) return;
  const periode = progressieWeergave.periode || 0;
  const data = periode > 0 ? volledigeData.slice(-periode) : volledigeData;
  const info = OEFENING_EENHEID[oefeningNaam] || { eenheid: 'reps', heeftGewicht: true };
  const eenheidLabel = info.eenheid === 'sec' ? 'Seconden' : 'Reps';

  const ctx = document.getElementById('progressChart').getContext('2d');
  if (actieveChart) actieveChart.destroy();

  const rootStyles = getComputedStyle(document.documentElement);
  const clay = rootStyles.getPropertyValue('--clay-bright').trim();
  // Reps/seconden als neutrale staven; het accent is gereserveerd voor de lijn (gewicht)
  const moss = rootStyles.getPropertyValue('--text-faint').trim();
  const textDim = rootStyles.getPropertyValue('--text-dim').trim();
  const border = rootStyles.getPropertyValue('--border').trim();

  const labels = data.map(d => {
    const dt = new Date(d.datum);
    return `${dt.getDate()}/${dt.getMonth() + 1}`;
  });

  const datasets = [];
  const scales = {
    x: { ticks: { color: textDim, font: { family: 'ui-sans-serif, system-ui, -apple-system, sans-serif', size: 10 } }, grid: { color: border, drawTicks: false } }
  };

  if (progressieWeergave.toonSets) {
    datasets.push({
      type: 'bar',
      label: eenheidLabel,
      data: data.map(d => d.topReps),
      backgroundColor: moss + (progressieWeergave.toonGewicht ? '99' : 'cc'),
      borderRadius: 4,
      yAxisID: 'ySets',
      order: 2
    });
    scales.ySets = {
      position: 'left',
      ticks: { color: moss, font: { family: 'ui-sans-serif, system-ui, -apple-system, sans-serif', size: 10 } },
      grid: { color: border },
      title: { display: true, text: eenheidLabel, color: moss, font: { family: 'ui-sans-serif, system-ui, -apple-system, sans-serif', size: 10 } }
    };
  }

  if (progressieWeergave.toonGewicht && info.heeftGewicht) {
    datasets.push({
      type: 'line',
      label: 'Gewicht (kg)',
      data: data.map(d => d.gewicht),
      borderColor: clay,
      backgroundColor: clay + '33',
      pointBackgroundColor: clay,
      pointRadius: 3,
      tension: 0.35,
      fill: progressieWeergave.toonSets ? false : true,
      borderWidth: 2,
      yAxisID: 'yGewicht',
      order: 1
    });
    scales.yGewicht = {
      position: 'right',
      ticks: { color: clay, font: { family: 'ui-sans-serif, system-ui, -apple-system, sans-serif', size: 10 } },
      grid: { drawOnChartArea: !progressieWeergave.toonSets, color: border },
      title: { display: true, text: 'kg', color: clay, font: { family: 'ui-sans-serif, system-ui, -apple-system, sans-serif', size: 10 } }
    };
  }

  actieveChart = new Chart(ctx, {
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: datasets.length > 1,
          labels: { color: textDim, font: { family: 'ui-sans-serif, system-ui, -apple-system, sans-serif', size: 11 }, boxWidth: 12 }
        }
      },
      scales
    }
  });

  const laatste = data[data.length - 1];
  const eerste = data[0];
  const deltaGewicht = Math.round((laatste.gewicht - eerste.gewicht) * 100) / 100;

  const statsHtml = [];
  if (info.heeftGewicht) {
    statsHtml.push(`<div class="stat"><div class="v">${laatste.gewicht}kg</div><div class="l">HUIDIG</div></div>`);
    statsHtml.push(`<div class="stat"><div class="v">+${deltaGewicht}kg</div><div class="l">SINDS START</div></div>`);
  }
  statsHtml.push(`<div class="stat"><div class="v">${laatste.topReps}</div><div class="l">TOP ${eenheidLabel.toUpperCase()}</div></div>`);

  document.getElementById('statStrip').innerHTML = statsHtml.join('');
}

// ============================================================
// WAKE LOCK — houdt het scherm actief tijdens het loggen van een training, zodat
// de telefoon niet vanzelf vergrendelt terwijl je aan het trainen bent. Wordt
// alleen geactiveerd tijdens een logging-sessie, niet overal in de app.
// ============================================================
let wakeLockSentinel = null;

/**
 * Vraagt een wake lock aan (scherm blijft aan). Faalt stil als de browser het
 * niet ondersteunt (bv. oudere Safari) of als de aanvraag om een andere reden
 * mislukt — de app blijft dan gewoon normaal werken, alleen zonder deze functie.
 */
async function vraagWakeLockAan() {
  if (!('wakeLock' in navigator)) return; // niet ondersteund door deze browser
  try {
    wakeLockSentinel = await navigator.wakeLock.request('screen');
  } catch (e) { /* geweigerd of niet beschikbaar, geen probleem */ }
}

function geefWakeLockVrij() {
  if (wakeLockSentinel) {
    wakeLockSentinel.release().catch(() => {});
    wakeLockSentinel = null;
  }
}

// Browsers geven een wake lock automatisch vrij zodra het tabblad naar de
// achtergrond gaat (schermvergrendeling, van app wisselen). Zodra je terugkomt
// tijdens een lopende logging-sessie, vraagt dit 'm automatisch opnieuw aan.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && huidigLogDag) {
    vraagWakeLockAan();
  }
});

// ============================================================
// THEMA — handmatige licht/donker-keuze, overschrijft de systeeminstelling.
// Wordt onthouden in localStorage zodat de keuze blijft staan bij een volgend bezoek.
// ============================================================
function pasThemaToe(thema) {
  // Donker is de standaard; alleen een bewuste keuze voor licht wijkt daarvan af.
  const effectief = thema === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', effectief);
  const meta = document.getElementById('themeColorMeta');
  if (meta) meta.setAttribute('content', effectief === 'light' ? '#F2F3F6' : '#14161A');
}

function toggleTheme() {
  const huidigEffectief = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const nieuw = huidigEffectief === 'dark' ? 'light' : 'dark';
  pasThemaToe(nieuw);
  try { localStorage.setItem('thema', nieuw); } catch (e) { /* localStorage niet beschikbaar, geen probleem */ }
  // Zelfde aanpak als herteken(): eerst een eventuele ingevulde logging-kaart bewaren
  // (anders resetten reps/gewicht/notitie), dan de huidige pagina opnieuw renderen.
  // route() werkt op elke pagina, niet alleen de logging-flow zoals herteken() dat doet.
  if (huidigLogDag) bewaarHuidigeKaart();
  route();
}

// Opgeslagen voorkeur meteen toepassen, vóór de eerste render — voorkomt een
// zichtbare flits van het verkeerde thema bij het laden van de pagina.
try {
  pasThemaToe(localStorage.getItem('thema'));
} catch (e) { pasThemaToe(null); /* localStorage niet beschikbaar: donker */ }

// ============================================================
// INIT
// ============================================================

// Houdt `ingelogd` synchroon met de echte Firebase Auth-status — dit vangt ook het
// geval af waarin iemand de pagina herlaadt terwijl Firebase de sessie nog onthoudt
// (Firebase Auth blijft standaard ingelogd tussen bezoeken), en het geval waarin de
// sessie serverside verlopen is.
// Toont de app meteen (knoppen/navigatie werken los van Firebase). Zodra Firebase
// geladen is, wordt de auth-status gekoppeld — maar de eerste render wacht daar
// NIET op, anders blijft de hele pagina leeg zodra Firebase traag laadt of om wat
// voor reden dan ook niet beschikbaar is (netwerk, adblocker, CDN-storing).
route();

function koppelFirebaseAuthZodraBeschikbaar() {
  if (!window.firebaseAuth) {
    setTimeout(koppelFirebaseAuthZodraBeschikbaar, 50);
    return;
  }
  window.firebaseAuth.onChange((user) => {
    const wasIngelogd = ingelogd;
    ingelogd = !!user;
    if (wasIngelogd !== ingelogd) route(); // alleen opnieuw renderen bij een echte statuswijziging
    if (ingelogd && !wasIngelogd) {
      // Instellingen en eventuele onafgeronde sessie pas ophalen zodra er
      // daadwerkelijk een ingelogde gebruiker is (Firestore-rules vereisen auth).
      laadInstellingenZodraMogelijk();
      checkOpenSessies().then(() => {
        const parts = (window.location.hash.slice(1) || 'home').split('/');
        if (openSessieVoorHerstel && parts[0] === 'trainen' && !parts[1]) renderTrainenMenu();
      });
    }
  });
}
koppelFirebaseAuthZodraBeschikbaar();
