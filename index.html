    const waarde = hold ? s.holdSec : s.reps;
    if (waarde === null || waarde === undefined || waarde <= 0) return;
    if (!perOefening.has(s.exerciseId)) perOefening.set(s.exerciseId, []);
    perOefening.get(s.exerciseId).push({ at: s.at, n: s.n ?? 0, waarde, load: s.load || 0, hold });
  });
  const lijst = [];
  let eersteMetingen = 0;
  perOefening.forEach((rijen, exerciseId) => {
    rijen.sort((a, b) => a.at - b.at || a.n - b.n);
    const eerder = [];
    const prs = [];
    let heeftEerder = false;
    rijen.forEach(r => {
      const inMaand = r.at >= van && r.at < tot;
      if (inMaand) {
        if (!heeftEerder) eersteMetingen++;
        else {
          const ingehaald = eerder.some(e => (r.hold ? e.waarde >= r.waarde : e.load >= r.load && e.waarde >= r.waarde));
          if (!ingehaald) prs.push(r);
        }
      }
      if (r.at < tot) { eerder.push(r); heeftEerder = true; }
    });
    if (!prs.length) return;
    const laatste = prs[prs.length - 1];
    const voorMaand = rijen.filter(r => r.at < van);
    let vorig = null;
    if (voorMaand.length) {
      vorig = laatste.hold
        ? voorMaand.reduce((b, r) => (r.waarde > b.waarde ? r : b))
        : voorMaand.reduce((b, r) => (r.load > b.load || (r.load === b.load && r.waarde > b.waarde) ? r : b));
    }
    const cfg = idx.perId.get(exerciseId);
    const fmt = r => (cfg.type === 'hold' ? `${nl(r.waarde)} sec` : `${nl(r.waarde)} × ${nl(r.load)} kg`);
    lijst.push({
      exerciseId, naam: cfg.name, soort: cfg.type === 'hold' ? 'hold' : 'reps', aantal: prs.length, at: laatste.at,
      nieuw: { waarde: laatste.waarde, load: laatste.load }, vorig: vorig ? { waarde: vorig.waarde, load: vorig.load } : null,
      tekst: `${cfg.name}: ${fmt(laatste)}${vorig ? ` (eerder zwaarste/langste ${fmt(vorig)})` : ''}`
    });
  });
  lijst.sort((a, b) => b.at - a.at);
  return { lijst, eersteMetingen };
}

function niveauLabel(cfg, levelId) {
  if (levelId === null || levelId === undefined) return 'startniveau';
  const l = ((cfg && cfg.ladder) || []).find(x => x.id === levelId);
  return (l && (l.label || l.naam)) || String(levelId);
}

function niveauWijzigingen({ config, decisions, van, tot }) {
  const idx = maakNaamIndex(config);
  const stand = (cfg, id) => (id === null || id === undefined ? -1 : ((cfg && cfg.ladder) || []).findIndex(l => l.id === id));
  const omhoog = [], omlaag = [], onbekend = [];
  (Array.isArray(decisions) ? decisions : []).forEach(d => {
    if (!d || d.decisionType !== 'LEVEL_CHANGE' || d.vervangenDoor || typeof d.timestamp !== 'number') return;
    if (d.timestamp < van || d.timestamp >= tot || d.van === d.naar) return;
    const cfg = idx.perId.get(d.exerciseId);
    const item = { exerciseId: d.exerciseId, naam: cfg ? cfg.name : d.exerciseId, van: niveauLabel(cfg, d.van), naar: niveauLabel(cfg, d.naar), bron: d.bron || null, at: d.timestamp };
    const a = stand(cfg, d.van), b = stand(cfg, d.naar);
    // richting alleen bekend als minstens één niveau in de ladder staat
    (a === b ? onbekend : b > a ? omhoog : omlaag).push(item);
  });
  return { omhoog, omlaag, onbekend };
}

function stagnatieInMaand({ config, decisions, van, tot }) {
  const idx = maakNaamIndex(config);
  const per = new Map();
  (Array.isArray(decisions) ? decisions : []).forEach(d => {
    if (!d || d.decisionType !== 'STAGNATION' || d.vervangenDoor || typeof d.timestamp !== 'number') return;
    if (d.timestamp < van || d.timestamp >= tot) return;
    const cfg = idx.perId.get(d.exerciseId);
    const e = per.get(d.exerciseId) || { exerciseId: d.exerciseId, naam: cfg ? cfg.name : d.exerciseId, signalen: 0, laatst: 0 };
    e.signalen++; e.laatst = Math.max(e.laatst, d.timestamp);
    per.set(d.exerciseId, e);
  });
  return [...per.values()].sort((a, b) => b.laatst - a.laatst);
}

/** Welke trainingen zijn er in het tijdvak? Sleutel = sessie-id; oudere logs zonder sessie tellen als dag + dagId. */
function telTrainingen({ sets, logs, trainingen, verworpenSessies, van, tot }) {
  const verworpen = new Set(Array.isArray(verworpenSessies) ? verworpenSessies : []);
  const sleutels = new Map();
  const noteer = (sleutel, at, dagId) => {
    if (typeof at !== 'number' || at < van || at >= tot) return;
    if (!sleutels.has(sleutel)) sleutels.set(sleutel, { at, dagId: dagId || null });
    else if (dagId && !sleutels.get(sleutel).dagId) sleutels.get(sleutel).dagId = dagId;
  };
  (Array.isArray(trainingen) ? trainingen : []).forEach(t => { if (t && t.sessionId && !verworpen.has(t.sessionId)) noteer(t.sessionId, t.at, t.dagId); });
  (Array.isArray(sets) ? sets : []).forEach(d => { if (d && d.sessionId && !verworpen.has(d.sessionId)) noteer(d.sessionId, d.aangemaaktOp, null); });
  (Array.isArray(logs) ? logs : []).forEach(l => {
    if (!l || (l.sessionId && verworpen.has(l.sessionId))) return;
    noteer(l.sessionId || `${l.dagId || '?'}|${typeof l.aangemaaktOp === 'number' ? lokaleDatumSleutel(l.aangemaaktOp) : '?'}`, l.aangemaaktOp, l.dagId);
  });
  const perDag = {};
  sleutels.forEach(v => { const k = v.dagId || 'onbekend'; perDag[k] = (perDag[k] || 0) + 1; });
  return { aantal: sleutels.size, perDag };
}

/** Eén gegevensrij per aandachtspunt, in vaste volgorde uit _meta.maand.aandachtVolgorde; nooit meer dan nodig. */
function bouwAandachtspunten(m, config) {
  const meta = (config && config._meta) || {};
  const cfg = meta.maand || {};
  const volgorde = Array.isArray(cfg.aandachtVolgorde) ? cfg.aandachtVolgorde : [];
  const max = typeof cfg.maxAandachtspunten === 'number' ? cfg.maxAandachtspunten : 3;
  const ind = meta.volumeIndicatoren || {};
  const regels = {
    MONTH_PAIN: () => m.pijn.sets > 0 && { tekst: `Pijn gemeld bij ${m.pijn.sets} set(s): ${m.pijn.oefeningen.join(', ')}.` },
    MONTH_INVALID: () => m.invalid.pct !== null && m.invalid.pct > cfg.invalidPctDrempel && { tekst: `${nl(m.invalid.pct)}% van de werksets was INVALID (${m.invalid.invalid} van ${m.invalid.totaal}); signaalgrens ${cfg.invalidPctDrempel}%.` },
    MONTH_MISSED_SESSIONS: () => m.sessies.gepland > 0 && m.sessies.uitgevoerd < m.sessies.gepland && { tekst: `${m.sessies.uitgevoerd} van ${m.sessies.gepland} geplande trainingen uitgevoerd.` },
    MONTH_STAGNATION: () => m.stagnatie.length > 0 && { tekst: `Stagnatiesignaal bij ${m.stagnatie.length} oefening(en): ${m.stagnatie.map(s => s.naam).join(', ')}.` },
    MONTH_LOW_ENERGY: () => m.energie.laagAantal > 0 && { tekst: `Energie ≤ ${meta.deload && meta.deload.energieMax}/5 bij ${m.energie.laagAantal} van ${m.energie.metWaarde} trainingen met energiescore.` },
    MONTH_VOLUME_LOW: () => {
      const g = m.volume.spiergroepen.filter(x => x.status === 'laag').sort((a, b) => a.sets - b.sets);
      return g.length > 0 && { tekst: `Laag gemiddeld weekvolume (onder ${ind.onderStreefbereik && ind.onderStreefbereik.min} sets): ${g.slice(0, 4).map(x => `${x.label} ${nl(x.sets)}`).join(', ')}${g.length > 4 ? ` en ${g.length - 4} andere` : ''}.` };
    },
    MONTH_VOLUME_HIGH: () => {
      const g = m.volume.spiergroepen.filter(x => x.status === 'hoog' || x.status === 'zeerHoog').sort((a, b) => b.sets - a.sets);
      return g.length > 0 && { tekst: `Hoog gemiddeld weekvolume: ${g.map(x => `${x.label} ${nl(x.sets)} (${x.statusTekst.toLowerCase()})`).join(', ')}.` };
    },
    MONTH_NO_LEVEL_UP: () => m.sessies.uitgevoerd > 0 && m.niveaus.omhoog.length === 0 && { tekst: `Geen enkel niveau omhoog in ${m.sessies.uitgevoerd} trainingen.` }
  };
  const uit = [];
  volgorde.forEach(ruleId => {
    if (uit.length >= max || !regels[ruleId]) return;
    const r = regels[ruleId]();
    if (r) uit.push({ ruleId, tekst: r.tekst });
  });
  return uit;
}

/**
 * Maandrapport (opdracht §14.7). Alleen cijfers uit de gegevens; geen verklaringen.
 * `geplandPerWeek` komt van de aanroeper (aantal reguliere trainingsdagen in het schema).
 * Is de maand nog bezig, dan loopt het rapport tot `nu` en wordt het geplande aantal naar rato berekend.
 */
function evaluateMonth(invoer) {
  const { config, sets, logs, trainingen, decisions, deload, geplandPerWeek, nu } = invoer;
  const maandOffset = invoer.maandOffset || 0;
  const gr = maandGrenzen(nu, maandOffset);
  const tot = Math.min(gr.eind, nu);
  const gedeeltelijk = nu < gr.eind;
  // kalenderdagen (niet via milliseconden: zomer-/wintertijd maakt een maand 1 uur te lang of te kort)
  const dagen = gedeeltelijk ? new Date(nu).getDate() : new Date(gr.eind - 1).getDate();
  const meta = (config && config._meta) || {};
  const verworpenSessies = (Array.isArray(decisions) ? decisions : []).filter(d => d && d.vervangenDoor === 'verworpen' && d.sessionId).map(d => d.sessionId);

  const tr = telTrainingen({ sets, logs, trainingen, verworpenSessies, van: gr.start, tot: gr.eind });
  const gepland = typeof geplandPerWeek === 'number' ? Math.round(geplandPerWeek * dagen / 7) : null;

  // volume: totaal in de maand gedeeld door het aantal weken in het verstreken deel
  const vol = berekenVolume({ config, sets, logs, verworpenSessies, van: gr.start, tot: gr.eind });
  // Minder dan een week verstreken: toch door minimaal één week delen, anders geeft één dag absurde weekgemiddelden.
  const weken = Math.max(1, dagen / 7);
  const spiergroepen = vol.spiergroepen.map(g => {
    const gem = g.sets / weken;
    const status = volumeStatus(gem, meta.volumeIndicatoren);
    return { id: g.id, label: g.label, sets: Math.round(gem * 10) / 10, totaal: g.sets, status, statusTekst: STATUS_TEKST[status] };
  });

  // INVALID en pijn over alle werksets in de maand (testsets en warm-up buiten beschouwing)
  const idx = maakNaamIndex(config);
  const alle = verzamelSets({ config, sets, logs, verworpenSessies }).sets.filter(s => typeof s.at === 'number' && s.at >= gr.start && s.at < gr.eind && s.type !== 'test' && s.type !== 'warmup');
  const isInvalid = s => s.setClass === 'INVALID' || (s.setClass === null && s.vorm === 'slecht');
  const invalid = alle.filter(isInvalid).length;
  const pijnSets = alle.filter(s => s.pijn === true);
  const pijnOefeningen = [...new Set(pijnSets.map(s => idx.perId.get(s.exerciseId).name))];

  const trMaand = (Array.isArray(trainingen) ? trainingen : []).filter(t => t && typeof t.at === 'number' && t.at >= gr.start && t.at < gr.eind && !verworpenSessies.includes(t.sessionId));
  const metEnergie = trMaand.filter(t => getal(t.energie) !== null);
  const energieMax = meta.deload && meta.deload.energieMax;
  const energie = {
    metWaarde: metEnergie.length, trainingen: trMaand.length,
    gemiddelde: metEnergie.length ? Math.round((metEnergie.reduce((t, x) => t + getal(x.energie), 0) / metEnergie.length) * 10) / 10 : null,
    laagAantal: metEnergie.filter(t => getal(t.energie) <= energieMax).length
  };

  const m = {
    maand: { start: gr.start, eind: gr.eind, offset: maandOffset, tot, dagen, gedeeltelijk },
    sessies: { uitgevoerd: tr.aantal, gepland, perDag: tr.perDag, percentage: gepland ? pct(tr.aantal, gepland) : null },
    records: bepaalRecords({ config, sets, logs, verworpenSessies, van: gr.start, tot: gr.eind }),
    niveaus: niveauWijzigingen({ config, decisions, van: gr.start, tot: gr.eind }),
    stagnatie: stagnatieInMaand({ config, decisions, van: gr.start, tot: gr.eind }),
    invalid: { invalid, totaal: alle.length, pct: pct(invalid, alle.length) },
    pijn: { sets: pijnSets.length, oefeningen: pijnOefeningen },
    volume: { spiergroepen, onderEenWeek: dagen < 7, weken: Math.round(weken * 10) / 10, skill: vol.skill, effectieveSets: vol.tellingen.effectieveSets },
    energie,
    deload: {
      gestartInMaand: !!(deload && typeof deload.sinds === 'number' && deload.sinds >= gr.start && deload.sinds < gr.eind),
      sinds: deload && typeof deload.sinds === 'number' ? deload.sinds : null,
      deloadTrainingen: trMaand.filter(t => t.deload === true).length
    }
  };
  m.aandachtspunten = bouwAandachtspunten(m, config);
  return m;
}

const EXPORTS = {
  weekGrenzen, maandGrenzen, beoordeelEffectieveSet, verzamelSets, volumeStatus, STATUS_TEKST,
  berekenVolume, stagnerendeOefeningen, energieOverzicht,
  deloadActief, deloadAantalSets, startDeload, beeindigDeload, wijsDeloadAf, bepaalDeload,
  evaluateWeek,
  bepaalRecords, niveauWijzigingen, stagnatieInMaand, telTrainingen, bouwAandachtspunten, evaluateMonth
};

if (typeof module !== 'undefined' && module.exports) module.exports = EXPORTS;
if (typeof window !== 'undefined') window.ProgressieAnalyse = EXPORTS;

})();

/**
 * Zoekt de spiergroep-tags van een oefening op naam (case-insensitive, met
 * gedeeltelijke match) zodat de bestaande NOODVERSIE_KEUZES-objecten — die
 * geen id-veld hebben — hieraan gekoppeld kunnen worden zonder elk object
 * handmatig te hoeven aanpassen.
 * @param {string} naam
 * @returns {Exercise | null}
 */
function vindExerciseData(naam) {
  if (!naam) return null;
  const genormaliseerd = naam.toLowerCase();
  // Eerst een exacte match proberen, dan een "bevat"-match (voor namen met extra
  // toevoegingen zoals "Deficit pike push-ups (voeten op stoel/bed, handen op boeken)").
  let gevonden = EXERCISES.find(e => e.name.toLowerCase() === genormaliseerd);
  if (gevonden) return gevonden;
  gevonden = EXERCISES.find(e =>
    genormaliseerd.startsWith(e.name.toLowerCase()) || genormaliseerd.includes(e.name.toLowerCase())
  );
  return gevonden || null;
}

<script>
// ============================================================
// MUSCLE-OVERLAP FILTER — pure, unit-testbare logica.
// Geen DOM-toegang, geen globale state-mutatie: alleen input in, nieuwe array uit.
// ============================================================

/**
 * @typedef {"none"|"moderate"|"high"} OverlapLevel
 *
 * @typedef {Object} HitMuscles
 * @property {Set<string>} primary   - spiergroepen die in eerdere stappen al ZWAAR
 *                                      belast zijn (kwamen voor in een primaryMuscles-lijst
 *                                      van een eerder gekozen oefening)
 * @property {Set<string>} secondary - spiergroepen die in eerdere stappen al LICHT/MATIG
 *                                      belast zijn (kwamen voor in een secondaryMuscles-lijst)
 */

/**
 * Bepaalt voor elke kandidaat-oefening hoeveel overlap die heeft met wat er in
 * eerdere stappen van de noodversie-flow al belast is, en sorteert de minst
 * overlappende opties naar boven. Verbergt nooit iets — dit is puur sortering
 * plus een label, nooit een blokkade.
 *
 * Overlap-niveau van een kandidaat wordt bepaald door zijn EIGEN primaryMuscles
 * (de spieren die déze oefening zwaar belast) te vergelijken met wat al belast is:
 *   - "high"     zodra minstens één van de primaryMuscles van de kandidaat al in
 *                hitMuscles.primary zit (je zou twee keer zwaar op dezelfde
 *                spiergroep stapelen — de zwaarst mogelijke overlap)
 *   - "moderate" zodra dat niet zo is, maar minstens één primaryMuscle van de
 *                kandidaat wel in hitMuscles.secondary zit (die spiergroep werkte
 *                al licht/matig mee, dus is niet volledig fris meer)
 *   - "none"     als geen van beide geldt
 *
 * @param {Exercise[]} allOptions
 * @param {HitMuscles} hitMuscles
 * @returns {(Exercise & { overlapLevel: OverlapLevel })[]} nieuwe array, "none" eerst
 */
function getFilteredOptions(allOptions, hitMuscles) {
  const OVERLAP_VOLGORDE = { none: 0, moderate: 1, high: 2 };

  const metOverlapNiveau = allOptions.map(exercise => {
    const overlapLevel = bepaalOverlapNiveau(exercise, hitMuscles);
    return { ...exercise, overlapLevel };
  });

  // .sort() is in-place op de NIEUWE array uit .map(), dus de input-array
  // (allOptions) wordt niet gemuteerd — dat hoort bij "pure functie".
  return metOverlapNiveau.sort((a, b) => OVERLAP_VOLGORDE[a.overlapLevel] - OVERLAP_VOLGORDE[b.overlapLevel]);
}

/**
 * @param {Exercise} exercise
 * @param {HitMuscles} hitMuscles
 * @returns {OverlapLevel}
 */
function bepaalOverlapNiveau(exercise, hitMuscles) {
  const overlaptMetPrimary = exercise.primaryMuscles.some(spier => hitMuscles.primary.has(spier));
  if (overlaptMetPrimary) return "high";

  const overlaptMetSecondary = exercise.primaryMuscles.some(spier => hitMuscles.secondary.has(spier));
  if (overlaptMetSecondary) return "moderate";

  return "none";
}

/**
 * Voegt de spiergroepen van een gekozen oefening toe aan de cumulatieve hitMuscles-state.
 * Geeft een NIEUW HitMuscles-object terug (muteert de input niet), zodat de aanroeper
 * expliciet kan kiezen om de state bij te werken — dit past bij hoe de rest van de
 * noodversie-flow (kiesNoodSkill, kiesNoodStrength, ...) al werkt: elke keuze-functie
 * herschrijft het relevante deel van de noodKeuze-state en rendert opnieuw.
 *
 * @param {HitMuscles} hitMuscles
 * @param {Exercise} gekozenExercise
 * @returns {HitMuscles}
 */
function voegOefeningToeAanHitMuscles(hitMuscles, gekozenExercise) {
  const nieuwePrimary = new Set(hitMuscles.primary);
  const nieuweSecondary = new Set(hitMuscles.secondary);
  gekozenExercise.primaryMuscles.forEach(spier => nieuwePrimary.add(spier));
  gekozenExercise.secondaryMuscles.forEach(spier => nieuweSecondary.add(spier));
  return { primary: nieuwePrimary, secondary: nieuweSecondary };
}

/** @returns {HitMuscles} een lege hitMuscles-state, voor het begin van een nieuwe noodversie-sessie */
function leegHitMuscles() {
  return { primary: new Set(), secondary: new Set() };
}

</script>
<script>
// ============================================================
// APP LOGICA — Clsthenics Log
// Simpele hash-based routing, geen framework nodig.
// ============================================================

const app = document.getElementById('app');
const crumbEl = document.getElementById('crumb');
const titleEl = document.getElementById('pageTitle');
const subEl = document.getElementById('pageSub');

let ingelogd = false; // placeholder — wordt vervangen door echte Firebase Auth state
let actieveChart = null;
let huidigLogDag = null;
let pendingVerlaatHash = null; // welke navigatie wacht op bevestiging via de verlaat-popup
let noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() }; // gemaakte keuzes voor de noodversie
let noodKeuzeActief = false; // true zodra het keuzescherm is geopend, tot de sessie eindigt
let huidigProgressieOefening = ALLE_OEFENINGEN[0];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setHeader(title, sub, crumbs) {
  titleEl.textContent = title;
  subEl.textContent = sub;
  crumbEl.innerHTML = '';
  if (crumbs && crumbs.length) {
    crumbs.forEach((c, i) => {
      const b = document.createElement('button');
      b.textContent = c.label;
      b.onclick = c.action;
      crumbEl.appendChild(b);
      if (i < crumbs.length - 1) {
        const sep = document.createElement('span');
        sep.textContent = '/';
        sep.style.opacity = '0.4';
        crumbEl.appendChild(sep);
      }
    });
  }
}

// ============================================================
// FASE 5 — deload-uitvoering, energie per training en de WEEK-pagina
// (opdracht §11, §14.2 en §14.6). De berekeningen staan in analyse.js.
// ============================================================
window.deloadStatus = null;
let huidigeEnergie = null;
let weekOffset = 0;
const DAG_MS_APP = 86400000;

function deloadIsActief() {
  const A = window.ProgressieAnalyse;
  return !!(A && A.deloadActief(window.deloadStatus, Date.now()));
}

/** Tijdens een deload: het aantal werksets halveren, naar boven afgerond. */
function aantalSetsVoor(n) {
  const A = window.ProgressieAnalyse;
  if (!A || !deloadIsActief() || !Number.isFinite(n)) return n;
  const factor = (window.deloadStatus && window.deloadStatus.volumeFactor) || (window.PROGRAM_CONFIG._meta.deload || {}).volumeFactor;
  return A.deloadAantalSets(n, factor);
}

function renderDeloadBanner() {
  if (!deloadIsActief()) return '';
  const d = window.deloadStatus;
  const rir = d.targetRir || (window.PROGRAM_CONFIG._meta.deload || {}).targetRir;
  return `<div class="deload-banner"><strong>Deload actief</strong> t/m ${datumTekst(d.eindigtOp)}. Halve werksets, dezelfde belasting, streef naar minimaal RIR ${rir}. Geen progressie en geen nieuwe tests.</div>`;
}

function renderEnergieKiezer() {
  const knoppen = [1, 2, 3, 4, 5].map(n =>
    `<button class="energie-knop ${huidigeEnergie === n ? 'gekozen' : ''}" onclick="kiesEnergie(${n})" aria-label="Energie ${n} van 5">${n}</button>`).join('');
  return `<div class="energie-kiezer"><div class="field-label">Energie vandaag (1 = leeg, 5 = vol energie)</div><div class="energie-knoppen">${knoppen}</div></div>`;
}

function kiesEnergie(n) {
  huidigeEnergie = huidigeEnergie === n ? null : n;
  herteken();
}

// --- WEEK-pagina ---------------------------------------------------------------
function fmtGetal(x) { return String(Math.round(x * 10) / 10).replace('.', ','); }
function korteDatum(ms) { return new Date(ms).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }); }

async function laadWeekData(nu, gr) {
  const fp = window.firebaseProgressie;
  const since = Math.min(gr.start, nu - 30 * DAG_MS_APP);
  const [logsRuw, setsRuw, decisionsRuw, statesRuw, trainingenRuw, deload] = await Promise.all([
    window.firebaseDb.haalAlleLogsOp(), fp.haalSetsSindsOp(gr.start), fp.haalDecisionsSindsOp(since),
    fp.haalAlleExerciseStatesOp(), fp.haalTrainingenSindsOp(nu - 70 * DAG_MS_APP), fp.haalDeloadOp()
  ]);
  const logs = logsRuw.map(l => Object.assign({}, l, { aangemaaktOp: tsNaarMs(l.aangemaaktOp) }));
  const sets = setsRuw.map(s => Object.assign({}, s, { aangemaaktOp: tsNaarMs(s.aangemaaktOp) }));
  const decisions = decisionsRuw.map(d => Object.assign({}, d, { timestamp: tsNaarMs(d.timestamp) }));
  const trainingen = trainingenRuw.map(t => ({ at: tsNaarMs(t.aangemaaktOp), energie: t.energie ?? null, dagNaam: t.dagNaam || null, dagId: t.dagId || null }));
  const exerciseStates = {};
  statesRuw.forEach(s => { exerciseStates[s.exerciseId || s.id] = s; });
  const eerste = logs.map(l => l.aangemaaktOp).filter(x => typeof x === 'number');
  return { logs, sets, decisions, trainingen, exerciseStates, deload, eersteTrainingOp: eerste.length ? Math.min(...eerste) : undefined };
}

async function renderWeekPagina() {
  setHeader('Week', 'Volume, stagnatie, energie en deload', [
    { label: 'Home', action: () => go('home') },
    { label: 'Week', action: () => {} }
  ]);
  const A = window.ProgressieAnalyse, E = window.ProgressieEngine;
  if (!A || !E || !window.firebaseProgressie) { app.innerHTML = '<div class="week-kaart">De analyse is niet geladen.</div>'; return; }
  app.innerHTML = '<div class="week-kaart"><p class="week-sub">Week laden…</p></div>';
  const nu = Date.now();
  const gr = A.weekGrenzen(nu, weekOffset);
  let data;
  try {
    data = await laadWeekData(nu, gr);
  } catch (e) {
    console.error('Weekdata laden mislukt', e);
    if (window.location.hash !== '#week') return;
    app.innerHTML = `<div class="week-kaart"><h3>Laden mislukt</h3><p class="week-sub">${(e && e.message) || e}</p><button class="btn" onclick="renderWeekPagina()">Opnieuw proberen</button></div>`;
    return;
  }
  if (window.location.hash !== '#week') return;
  window.deloadStatus = data.deload; // actuele status uit Firestore
  const res = A.evaluateWeek({
    config: window.PROGRAM_CONFIG, sets: data.sets, logs: data.logs, trainingen: data.trainingen, decisions: data.decisions,
    exerciseStates: data.exerciseStates, deload: data.deload, eersteTrainingOp: data.eersteTrainingOp,
    bepaalStagnatie: E.bepaalStagnatie, ruleEffect: E.RULE_EFFECT, nu, weekOffset
  });
  weekLaatsteResultaat = res;
  app.innerHTML = renderWeekHtml(res, nu);
}
let weekLaatsteResultaat = null;

function weekVerschuif(delta) {
  weekOffset = Math.min(0, weekOffset + delta);
  renderWeekPagina();
}

function renderWeekHtml(res, nu) {
  const meta = window.PROGRAM_CONFIG._meta;
  const ind = meta.volumeIndicatoren;
  const laatsteDag = res.week.eind - 1;
  const titel = `${korteDatum(res.week.start)} – ${korteDatum(laatsteDag)}${res.week.offset === 0 ? ' (deze week)' : ''}`;
  const rijen = volumeRijenHtml(res.spiergroepen, ind);

  const u = res.uitgesloten;
  const uitgeslotenTekst = [
    u.invalid && `${u.invalid} INVALID`, u.slechteVorm && `${u.slechteVorm} slechte vorm`, u.pijn && `${u.pijn} met pijn`,
    u.rirTeHoog && `${u.rirTeHoog} met RIR boven ${meta.volume.maxRir}`, u.rirOnbekend && `${u.rirOnbekend} zonder RIR`,
    u.test && `${u.test} testsets`, u.onbekendeOefening && `${u.onbekendeOefening} van een onbekende oefening`
  ].filter(Boolean).join(', ');

  const skill = res.skill.perOefening.length
    ? `<ul class="week-lijst">${res.skill.perOefening.map(k => `<li>${k.naam}: ${k.sets} sets${k.seconden ? `, ${k.seconden} sec samen` : ''}</li>`).join('')}</ul>
       <p class="week-sub">Totaal ${res.skill.sets} effectieve skill-sets${res.skill.seconden ? ` (${res.skill.seconden} sec)` : ''}.</p>`
    : '<p class="week-sub">Geen effectieve skill-sets in deze week.</p>';

  const stag = res.stagnatie.length
    ? `<ul class="week-lijst">${res.stagnatie.map(s => `<li><strong>${s.naam}</strong>: ${s.sessies} trainingen op rij ${s.totaal} ${s.eenheid}${s.voorstellen && s.voorstellen[0] ? ` · eerste voorstel: ${s.voorstellen[0].tekst}` : ''}</li>`).join('')}</ul>`
    : '<p class="week-sub">Geen oefeningen met een stagnatiesignaal.</p>';

  const en = res.energie;
  const staven = en.reeks.length ? `
    <div class="energie-staven">${en.reeks.map(r => r.energie === null
      ? '<div class="energie-staaf"><div class="staaf leeg" style="height:12%"></div>–</div>'
      : `<div class="energie-staaf"><span>${r.energie}</span><div class="staaf ${r.energie <= meta.deload.energieMax ? 'laag' : ''}" style="height:${r.energie * 18}%"></div></div>`).join('')}</div>
    <div class="energie-datum">${en.reeks.map(r => `<span>${korteDatum(r.at)}</span>`).join('')}</div>
    <p class="week-sub">${en.gemiddelde !== null ? `Gemiddeld ${fmtGetal(en.gemiddelde)} van 5 over deze ${en.reeks.length} trainingen.` : 'Nog geen energiescores.'}${en.ontbrekend ? ` Bij ${en.ontbrekend} training(en) niet ingevuld.` : ''}</p>`
    : '<p class="week-sub">Nog geen trainingen met energiescore. Je vult die in op het laatste scherm van een training.</p>';

  return `
    <div class="week-nav">
      <button class="btn" onclick="weekVerschuif(-1)">← Vorige</button>
      <div class="week-titel">${titel}</div>
      <button class="btn" onclick="weekVerschuif(1)" ${res.week.offset === 0 ? 'disabled' : ''}>Volgende →</button>
    </div>
    ${res.week.offset === 0 ? renderDeloadKaart(res.deload, nu) : ''}
    <div class="week-kaart">
      <h3>Effectieve sets per spiergroep</h3>
      <p class="week-sub">${res.tellingen.sessies} training(en) · ${res.tellingen.effectieveSets} effectieve sets. Primaire spiergroep telt voor ${fmtGetal(meta.volume.gewichtPrimair)}, secundaire voor ${fmtGetal(meta.volume.gewichtSecundair)}.</p>
      ${rijen}
      <div class="vol-legenda">Het groene vlak is het streefbereik (${ind.goed.min}–${ind.goed.max} sets). Dit is een signaal, geen wet. ${uitgeslotenTekst ? `Niet meegeteld: ${uitgeslotenTekst}.` : ''}</div>
    </div>
    <div class="week-kaart"><h3>Skill-volume</h3>${skill}</div>
    <div class="week-kaart"><h3>Stagnatie</h3>${stag}</div>
    <div class="week-kaart"><h3>Energie</h3>${staven}</div>`;
}

function renderDeloadKaart(dl, nu) {
  const A = window.ProgressieAnalyse;
  const crit = dl.criteria.map(k => `<div class="criterium"><span class="vink">${k.voldaan ? '✓' : '–'}</span><span>${k.tekst}</span></div>`).join('');
  if (dl.actief) {
    const d = dl.deload;
    return `<div class="week-kaart deload-kaart actief"><h3>Deload actief</h3>
      <p class="week-sub">Sinds ${korteDatum(d.sinds)} tot ${korteDatum(d.eindigtOp)}. Halve werksets, dezelfde belasting, minimaal RIR ${d.targetRir}, geen progressie en geen nieuwe tests.</p>
      <div class="deload-acties"><button class="btn" onclick="deloadBeeindigen()">Deload nu beëindigen</button></div></div>`;
  }
  if (dl.voorstel) {
    return `<div class="week-kaart deload-kaart"><h3>Deload voorgesteld</h3>
      ${crit}
      <p class="week-sub">${dl.voorstel.uitvoering.tekst}</p>
      <div class="deload-acties"><button class="btn primary" onclick="deloadStarten()">Start deload</button><button class="btn" onclick="deloadAfwijzen()">Niet nu</button></div></div>`;
  }
  return `<div class="week-kaart"><h3>Deload</h3>${crit}<p class="week-sub">${dl.afgewezenRecent ? 'Een voorstel is recent afgewezen; het komt pas later terug.' : 'Geen deloadsignaal.'}</p></div>`;
}

async function bewaarDeloadBeslissing(soort, nieuweStatus, extra) {
  const fp = window.firebaseProgressie, E = window.ProgressieEngine;
  const nu = Date.now();
  await fp.slaDeloadOp(nieuweStatus);
  window.deloadStatus = nieuweStatus;
  const record = E.buildDecisionRecord({
    exerciseId: null, sessionId: null, setId: null, decisionType: 'DELOAD',
    inputSnapshot: { criteria: extra.criteria || null, status: nieuweStatus },
    result: { ruleId: soort, ruleIds: extra.ruleIds || null, reasonText: extra.reasonText },
    accepted: extra.accepted
  });
  delete record.timestamp;
  await fp.maakDecisionAanIndienNieuwOp(`deload_${nu}_${soort}`, record);
}

async function deloadStarten() {
  const A = window.ProgressieAnalyse, res = weekLaatsteResultaat;
  if (!res || !res.deload.voorstel) return;
  try {
    const nieuw = A.startDeload(window.deloadStatus, Date.now(), window.PROGRAM_CONFIG);
    await bewaarDeloadBeslissing('DELOAD_ACCEPTED', nieuw, { criteria: res.deload.criteria, ruleIds: res.deload.voorstel.ruleIds, reasonText: res.deload.voorstel.reasonText, accepted: true });
    toast('Deload gestart ✓');
  } catch (e) { opslagFout('deload starten')(e); toast('Deload starten mislukt — probeer opnieuw'); return; }
  renderWeekPagina();
}

async function deloadAfwijzen() {
  const A = window.ProgressieAnalyse, res = weekLaatsteResultaat;
  if (!res || !res.deload.voorstel) return;
  try {
    const nieuw = A.wijsDeloadAf(window.deloadStatus, Date.now());
    await bewaarDeloadBeslissing('DELOAD_DECLINED', nieuw, { criteria: res.deload.criteria, ruleIds: res.deload.voorstel.ruleIds, reasonText: res.deload.voorstel.reasonText, accepted: false });
    toast('Voorstel afgewezen');
  } catch (e) { opslagFout('deload afwijzen')(e); toast('Opslaan mislukt — probeer opnieuw'); return; }
  renderWeekPagina();
}

async function deloadBeeindigen() {
  const A = window.ProgressieAnalyse;
  try {
    const nieuw = A.beeindigDeload(window.deloadStatus, Date.now());
    await bewaarDeloadBeslissing('DELOAD_ENDED_MANUAL', nieuw, { reasonText: 'Deload handmatig beëindigd door de gebruiker.', accepted: true });
    toast('Deload beëindigd');
  } catch (e) { opslagFout('deload beëindigen')(e); toast('Opslaan mislukt — probeer opnieuw'); return; }
  renderWeekPagina();
}


// ============================================================
// FASE 6 — MAAND-pagina (opdracht §14.7). De berekeningen staan in analyse.js (evaluateMonth).
// ============================================================
let maandOffset = 0;
let maandLaatsteResultaat = null;

/** Balken per spiergroep, gedeeld door de week- en maandpagina. `eenheid` komt achter het getal in de tooltip. */
function volumeRijenHtml(groepen, ind) {
  const schaal = Math.max(ind.hoog.max + 2, Math.ceil(Math.max(0, ...groepen.map(g => g.sets))) + 1);
  const bandLinks = (ind.goed.min / schaal) * 100;
  const bandBreed = ((ind.goed.max - ind.goed.min) / schaal) * 100;
  return groepen.map(g => `
    <div class="vol-rij">
      <div class="vol-label">${g.label}</div>
      <div class="vol-spoor" title="${(g.bijdragen || []).map(b => `${b.naam}: ${fmtGetal(b.sets)}`).join(', ') || 'geen sets'}">
        <div class="vol-band" style="left:${bandLinks}%;width:${bandBreed}%"></div>
        <div class="vol-vulling ${g.status}" style="width:${Math.min(100, (g.sets / schaal) * 100)}%"></div>
      </div>
      <div class="vol-getal">${fmtGetal(g.sets)}</div>
      <div class="vol-status">${g.statusTekst}${g.bijdragen && g.bijdragen.length ? ' · ' + g.bijdragen.map(b => `${b.naam} ${fmtGetal(b.sets)}`).join(', ') : ''}</div>
    </div>`).join('');
}

function geplandePerWeek() {
  return SCHEMA.dagen.filter(d => !d.isNoodtraining).length;
}

async function laadMaandData(nu, gr) {
  const fp = window.firebaseProgressie;
  const [logsRuw, setsRuw, decisionsRuw, trainingenRuw, deload] = await Promise.all([
    window.firebaseDb.haalAlleLogsOp(), fp.haalSetsSindsOp(gr.start), fp.haalDecisionsSindsOp(gr.start),
    fp.haalTrainingenSindsOp(gr.start), fp.haalDeloadOp()
  ]);
  return {
    logs: logsRuw.map(l => Object.assign({}, l, { aangemaaktOp: tsNaarMs(l.aangemaaktOp) })),
    sets: setsRuw.map(s => Object.assign({}, s, { aangemaaktOp: tsNaarMs(s.aangemaaktOp) })),
    decisions: decisionsRuw.map(d => Object.assign({}, d, { timestamp: tsNaarMs(d.timestamp) })),
    trainingen: trainingenRuw.map(t => ({ sessionId: t.sessionId || t.id, at: tsNaarMs(t.aangemaaktOp), energie: t.energie ?? null, dagId: t.dagId || null, deload: t.deload === true })),
    deload
  };
}

async function renderMaandPagina() {
  setHeader('Maand', 'Rapport op basis van je geregistreerde data', [
    { label: 'Home', action: () => go('home') },
    { label: 'Maand', action: () => {} }
  ]);
  const A = window.ProgressieAnalyse;
  if (!A || !window.firebaseProgressie) { app.innerHTML = '<div class="week-kaart">De analyse is niet geladen.</div>'; return; }
  app.innerHTML = '<div class="week-kaart"><p class="week-sub">Maand laden…</p></div>';
  const nu = Date.now();
  const gr = A.maandGrenzen(nu, maandOffset);
  let data;
  try {
    data = await laadMaandData(nu, gr);
  } catch (e) {
    console.error('Maanddata laden mislukt', e);
    if (window.location.hash !== '#maand') return;
    app.innerHTML = `<div class="week-kaart"><h3>Laden mislukt</h3><p class="week-sub">${(e && e.message) || e}</p><button class="btn" onclick="renderMaandPagina()">Opnieuw proberen</button></div>`;
    return;
  }
  if (window.location.hash !== '#maand') return;
  const res = A.evaluateMonth({ config: window.PROGRAM_CONFIG, ...data, geplandPerWeek: geplandePerWeek(), nu, maandOffset });
  maandLaatsteResultaat = res;
  app.innerHTML = renderMaandHtml(res);
}

function maandVerschuif(delta) {
  maandOffset = Math.min(0, maandOffset + delta);
  renderMaandPagina();
}

function route() {
  werkShellBij();
  // Niet ingelogd? Dan zie je alleen het loginscherm — ongeacht welke hash er in de
  // URL staat. Zodra je bent ingelogd, wordt de daadwerkelijk bedoelde pagina getoond
  // (zie doLogin, die na een geslaagde login route() opnieuw aanroept).
  if (!ingelogd) return renderLoginScherm();

  const hash = window.location.hash.slice(1) || 'home';
  const parts = hash.split('/');

  if (parts[0] === 'home') return renderHome();
  if (parts[0] === 'trainen' && !parts[1]) return renderTrainenMenu();
  if (parts[0] === 'trainen' && parts[1]) return renderDagDetail(parts[1]);
  if (parts[0] === 'loggen' && parts[1]) return renderLoggen(parts[1]);
  if (parts[0] === 'progressie' && !parts[1]) return renderProgressieOverzicht();
  if (parts[0] === 'progressie' && parts[1]) return renderProgressieDetail(decodeURIComponent(parts[1]));
  if (parts[0] === 'week') return renderWeekPagina();
  if (parts[0] === 'maand') return renderMaandPagina();
  if (parts[0] === 'instellingen') return renderInstellingenScherm();
  renderHome();
}

let laatsteBevestigdeHash = window.location.hash;

window.addEventListener('hashchange', () => {
  const nieuweHash = window.location.hash;
  // Browser-terug/vooruit verandert de hash al vóórdat we kunnen ingrijpen.
  // Bij een actieve logsessie zetten we de hash terug en tonen we de popup;
  // pas na bevestiging (opslaan of verwerpen) laten we de nieuwe hash staan.
  if (huidigLogDag && verlaatVereistBevestiging(nieuweHash.slice(1))) {
    history.pushState(null, '', laatsteBevestigdeHash);
    toonVerlaatPopup(nieuweHash.slice(1));
    return;
  }
  laatsteBevestigdeHash = nieuweHash;
  route();
});

function go(hash) {
  if (verlaatVereistBevestiging(hash)) {
    toonVerlaatPopup(hash);
    return;
  }
  laatsteBevestigdeHash = '#' + hash;
  window.location.hash = hash;
}

// Bepaalt of het weggaan van de huidige route een actieve, onafgeronde
// logsessie zou onderbreken. Binnen dezelfde logsessie blijven (bv. van
// kaart naar kaart, dat loopt niet via go()) hoeft niet bevestigd te worden.
function verlaatVereistBevestiging(doelHash) {
  if (!huidigLogDag) return false;
  // Naar dezelfde logging-flow gaan (zou hier normaliter niet gebeuren) telt niet als verlaten
  if (doelHash === `loggen/${huidigLogDag.id}`) return false;
  return true;
}

function toonVerlaatPopup(doelHash) {
  pendingVerlaatHash = doelHash;
  document.getElementById('verlaatPopup').classList.add('show');
}

function sluitVerlaatPopup() {
  document.getElementById('verlaatPopup').classList.remove('show');
  pendingVerlaatHash = null;
}

async function verlaatPopupOpslaanEnGa() {
  if (afrondenBezig) return;
  bewaarHuidigeKaart();
  verwerkExerciseModusViaEngine(logIndex); // de kaart waar je op staat telt ook mee
  afrondenBezig = true;
  document.getElementById('verlaatPopup').classList.remove('show');
  const uitkomst = await bewaarTrainingInFirestore();
  afrondenBezig = false;
  if (uitkomst === 'fout') {

    toast('Opslaan mislukt — de training staat nog open. Probeer het opnieuw.');
    return;
  }
  toast(uitkomst === 'ok' ? 'Voortgang opgeslagen ✓' : 'Geen verbinding bevestigd — sluit de app nog niet; het wordt opgeslagen zodra er weer verbinding is');
  geefWakeLockVrij();
  Object.values(timerState).forEach(s => { if (s.intervalId) clearInterval(s.intervalId); });
  const doel = pendingVerlaatHash;
  huidigLogDag = null;
  huidigeSessionId = null;
  resetSessieHulpstate();
  logData = {};
  logIndex = 0;
  timerState = {};
  uitlegOpen = {};
  noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() };
  noodKeuzeActief = false;
  pendingVerlaatHash = null;
  laatsteBevestigdeHash = '#' + doel;
  window.location.hash = doel;
}

function verlaatPopupZonderOpslaan() {
  geefWakeLockVrij();
  Object.values(timerState).forEach(s => { if (s.intervalId) clearInterval(s.intervalId); });
  const doel = pendingVerlaatHash;
  // Zonder opslaan verlaten = de oefeningstatus (niveau, streaks) verandert niet en het
  // herstel-snapshot verdwijnt. De sets en beslissingen die tijdens de training al direct
  // zijn bewaard blijven bestaan als historie (opdracht §18.8), maar tellen niet mee voor het niveau.
  markeerSessieAlsVerworpen();
  if (window.firebaseProgressie && huidigeSessionId) {
    window.firebaseProgressie.verwijderSessieOp(huidigeSessionId).catch(opslagFout('sessie opruimen'));
  }
  huidigLogDag = null;

  logIndex = 0;

  noodKeuzeActief = false;
  document.getElementById('verlaatPopup').classList.remove('show');
  pendingVerlaatHash = null;
  laatsteBevestigdeHash = '#' + doel;
  window.location.hash = doel;
}

const SKILL_OVERZICHT = [
  { naam: 'Planche', id: 'advanced_tuck_planche' },
  { naam: 'Front lever', id: 'advanced_tuck_front_lever' },
  { naam: 'Handstand', id: 'chest_to_wall_handstand' }

let dashboardLaatsteRender = 0;

function dagdeelGroet(d) {
  const u = d.getHours();
  return u < 6 ? 'Goedenacht' : u < 12 ? 'Goedemorgen' : u < 18 ? 'Goedemiddag' : 'Goedenavond';
}

function relatieveDag(ms, nu) {
  const dagStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const n = Math.round((dagStart(nu) - dagStart(ms)) / DAG_MS_APP);
  if (n <= 0) return 'vandaag';
  if (n === 1) return 'gisteren';
  if (n < 14) return `${n} dagen geleden`;
  return korteDatum(ms);
}

/** Volgende dag in de vaste cyclus (A → B → C → A), op basis van de laatste echte (niet-nood) training. */
function bepaalVolgendeDag(trainingen) {
  const cyclus = SCHEMA.dagen.filter(d => !d.isNoodtraining);
  const laatste = (trainingen || []).filter(t => t && cyclus.some(d => d.id === t.dagId)).sort((a, b) => b.at - a.at)[0];
  if (!laatste) return { dag: cyclus[0], laatste: null };
  const i = cyclus.findIndex(d => d.id === laatste.dagId);
  return { dag: cyclus[(i + 1) % cyclus.length], laatste };
}

/** Positie van een oefening op zijn ladder: index 0 = startniveau, daarna de ladderniveaus uit program.json. */
function ladderPositie(cfg, state) {
  const H = window.ProgressieHistorie;
  const ladder = (cfg && cfg.ladder) || [];
  const huidigId = state && state.currentLevelId !== undefined ? state.currentLevelId : null;
  let idx = huidigId === null ? 0 : ladder.findIndex(l => l.id === huidigId) + 1;
  if (idx < 0) idx = 0;
  return {
    idx, n: ladder.length + 1,
    label: H ? H.niveauLabel(cfg, huidigId) : String(huidigId || 'startniveau'),
    volgende: idx < ladder.length ? (ladder[idx].label || ladder[idx].naam || ladder[idx].id) : null
  };
}

/** De ladder als reeks sporten: afgerond (groen), huidig (accent), nog te gaan (leeg). */
function renderLadderBalk(pos) {
  const sporten = Array.from({ length: pos.n }, (_, i) => `<span class="sport ${i < pos.idx ? 'klaar' : i === pos.idx ? 'nu' : ''}"></span>`).join('');
  return `<div class="ladder" role="img" aria-label="Niveau ${pos.idx + 1} van ${pos.n}">${sporten}</div>`;
}

function renderSkillRij(naam, cfg, state) {
  if (!cfg) return '';
  const pos = ladderPositie(cfg, state);
  return `
    <button class="skill-rij" onclick="go('progressie/${encodeURIComponent(cfg.name)}')">
      <span class="skill-kop"><span class="skill-naam">${naam}</span><span class="skill-stand tabnum">${pos.idx + 1}/${pos.n}</span></span>
      <span class="skill-niveau">${pos.label}</span>
      ${renderLadderBalk(pos)}
      <span class="skill-volgende">${pos.volgende ? `Volgende stap: ${pos.volgende}` : 'Hoogste niveau bereikt'}</span>
    </button>`;
}

function renderConsistentieStaven(trainingen, nu, doel) {
  const A = window.ProgressieAnalyse;
  const weken = [];
  for (let k = 7; k >= 0; k--) {
    const g = A.weekGrenzen(nu, -k);
    weken.push({ start: g.start, aantal: trainingen.filter(t => t.at >= g.start && t.at < g.eind).length, huidig: k === 0 });
  }
  const max = Math.max(doel, ...weken.map(w => w.aantal));
  const gem = weken.slice(0, 7).reduce((som, w) => som + w.aantal, 0) / 7;
  const staven = weken.map(w => `
    <div class="cons-kolom ${w.huidig ? 'huidig' : ''}" title="Week van ${korteDatum(w.start)}: ${w.aantal} training${w.aantal === 1 ? '' : 'en'}">
      <div class="cons-staaf-wrap"><div class="cons-staaf ${w.aantal >= doel ? 'doel' : ''}" style="height:${Math.round((w.aantal / max) * 100)}%"></div></div>
      <span class="cons-getal tabnum">${w.aantal}</span>
    </div>`).join('');
  return { html: `<div class="cons-staven" style="--doel:${Math.round((doel / max) * 100)}%">${staven}</div>`, gemiddelde: Math.round(gem * 10) / 10 };
}

function renderEnergiePunten(energie) {
  if (energie === null || energie === undefined) return '<span class="dim">Geen energie ingevuld</span>';
  return `<span class="energie-punten" aria-label="Energie ${energie} van 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= energie ? 'aan' : ''}"></i>`).join('')}</span><span class="tabnum">${energie} van 5</span>`;
}

function renderHome() {
  const nu = new Date();
  const dagTekst = nu.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
  setHeader(dagdeelGroet(nu), dagTekst.charAt(0).toUpperCase() + dagTekst.slice(1), null);
  const doelPerWeek = SCHEMA.dagen.filter(d => !d.isNoodtraining).length;

  const skelet = (dag, ctx) => {
    const wk = ctx ? ctx.weekTrainingen : null;
    const dagLabel = `Dag ${dag.id.toUpperCase()}`;

          <span class="tabnum">${wk} van ${doelPerWeek} trainingen deze week</span>
        </div>`}
      </section>`;
  };

  const eerste = skelet(SCHEMA.dagen.find(d => !d.isNoodtraining) || SCHEMA.dagen[0], null);
  app.innerHTML = `<div class="dash">${eerste}<p class="week-sub" id="dashLaden">Gegevens laden…</p></div>`;
  const mijnRender = ++dashboardLaatsteRender;

  const A = window.ProgressieAnalyse, E = window.ProgressieEngine;
  if (!A || !E || !window.firebaseProgressie || !window.firebaseDb) { const el = document.getElementById('dashLaden'); if (el) el.remove(); return; }
  const nuMs = Date.now();
  laadWeekData(nuMs, A.weekGrenzen(nuMs, 0)).then(data => {
    if (mijnRender !== dashboardLaatsteRender || (window.location.hash.slice(1) || 'home').split('/')[0] !== 'home') return;
    const res = A.evaluateWeek({
      config: window.PROGRAM_CONFIG, sets: data.sets, logs: data.logs, trainingen: data.trainingen, decisions: data.decisions,
      exerciseStates: data.exerciseStates, deload: data.deload, eersteTrainingOp: data.eersteTrainingOp,
      bepaalStagnatie: E.bepaalStagnatie, ruleEffect: E.RULE_EFFECT, nu: nuMs, weekOffset: 0
    });
    const { dag, laatste } = bepaalVolgendeDag(data.trainingen);
    const gr = A.weekGrenzen(nuMs, 0);
    const weekTrainingen = Math.max(data.trainingen.filter(t => t.at >= gr.start && t.at < gr.eind).length, res.trainingen || 0);
    const cons = renderConsistentieStaven(data.trainingen, nuMs, doelPerWeek);
    const laatsteSorted = data.trainingen.slice().sort((a, b) => b.at - a.at)[0];
    const laatsteKaart = laatsteSorted ? `
      <section class="dash-blok">
        <h3>Laatste training</h3>
        <p class="laatste-naam">${laatsteSorted.dagNaam || (SCHEMA.dagen.find(d => d.id === laatsteSorted.dagId) || {}).naam || 'Training'}</p>
        <p class="laatste-wanneer">${relatieveDag(laatsteSorted.at, nuMs)}</p>
        <div class="laatste-energie">${renderEnergiePunten(laatsteSorted.energie)}</div>
      </section>` : `
      <section class="dash-blok">
        <h3>Laatste training</h3>
        <p class="week-sub">Nog geen training opgeslagen. Je eerste training verschijnt hier met je energiescore.</p>
      </section>`;
    const aandacht = [];
    if (res.deload && res.deload.actief) aandacht.push({ tekst: 'Deload actief', sub: 'Halve werksets, geen progressie.', soort: 'ok' });
    else if (res.deload && res.deload.voorstel) aandacht.push({ tekst: 'Deload voorgesteld', sub: 'Bekijk de criteria op de weekpagina.', soort: 'warn' });
    if (res.stagnatie && res.stagnatie.length) aandacht.push({ tekst: `Stagnatie bij ${res.stagnatie.length} oefening${res.stagnatie.length === 1 ? '' : 'en'}`, sub: 'Bekijk welke op de weekpagina.', soort: 'warn' });
    const aandachtHtml = aandacht.length ? `
      <section class="dash-blok">
        <h3>Let op</h3>
        ${aandacht.map(a => `<button class="aandacht-rij ${a.soort}" onclick="go('week')"><span class="aandacht-tekst">${a.tekst}</span><span class="aandacht-sub">${a.sub}</span></button>`).join('')}
      </section>` : '';
    const skills = SKILL_OVERZICHT.map(sk => {
      const cfg = window.PROGRAM_CONFIG.exercises.find(e => e.id === sk.id);
      return renderSkillRij(sk.naam, cfg, data.exerciseStates[sk.id] || null);
    }).join('');
    app.innerHTML = `
      <div class="dash">
        ${skelet(dag, { weekTrainingen })}
        <div class="dash-kolommen">
          <div class="dash-kolom">
            ${aandachtHtml}
            ${laatsteKaart}
            <section class="dash-blok">
              <h3>Trainingen per week</h3>
              <p class="week-sub">Gemiddeld ${String(cons.gemiddelde).replace('.', ',')} per week over de afgelopen 7 weken. Doel: ${doelPerWeek}.</p>

          <div class="dash-kolom">
            <section class="dash-blok">

              <div class="skill-lijst">${skills}</div>
            </section>
          </div>
        </div>
        ${renderChangelogBlock()}
      </div>`;
  }).catch(e => {
    console.error('Dashboard laden mislukt', e);
    const el = document.getElementById('dashLaden');
    if (el) el.textContent = 'Gegevens laden mislukt. Je kunt wel gewoon trainen; probeer later opnieuw.';
  });

// ============================================================
// TIMER — herbruikbare aftel-timer met ring-visualisatie
// ============================================================
let timerState = {}; // per kaart-index: { actief, resterend, totaal, intervalId, done }
let uitlegOpen = {}; // per kaart-index: true/false — of het uitleg-blok is uitgeklapt

function timerSeconden(item) {
  // Haalt seconden uit een target-string zoals "3×15 sec" of "40–45 sec"
  if (item.sec) return item.sec;
  const target = item.target || '';
  const match = target.match(/(\d+)(?:–(\d+))?\s*sec/);
  if (!match) return null;
  const laag = parseInt(match[1]);
  const hoog = match[2] ? parseInt(match[2]) : laag;
  return Math.round((laag + hoog) / 2);
}

function rustSeconden(item) {
  // Haalt de rusttijd tussen sets uit item.rust, bv. "150 sec", "90–120 sec", of "—" (geen rust)
  const rust = item.rust || '';
  const match = rust.match(/(\d+)(?:–(\d+))?\s*sec/);
  if (!match) return null;
  const laag = parseInt(match[1]);
  const hoog = match[2] ? parseInt(match[2]) : laag;
  return Math.round((laag + hoog) / 2);
}

function parseSetsEnTijd(target) {
  // Haalt uit een target-string zowel het aantal sets als de tijd PER SET.
  // "2×20–30 sec" -> { sets: 2, secPerSet: 25 }
  // "2×30 sec"    -> { sets: 2, secPerSet: 30 }
  // "4 per kant"  -> null (geen tijd-component, dit zijn geen sets-met-seconden)
  if (!target) return null;
  const match = target.match(/^(\d+)\s*×\s*(\d+)(?:–(\d+))?\s*sec/);
  if (!match) return null;
  const sets = parseInt(match[1]);
  const laag = parseInt(match[2]);
  const hoog = match[3] ? parseInt(match[3]) : laag;
  const secPerSet = Math.round((laag + hoog) / 2);
  return { sets, secPerSet };
}

function renderTimerBlock(key, seconden, label, instelSeconden) {
  if (!seconden) return '';
  const state = timerState[key] || { actief: false, resterend: seconden, totaal: seconden, done: false, instelSeconden: instelSeconden || 0 };
  timerState[key] = state;
  const labelTekst = label || 'Timer';

  return `
    <div class="timer-box">
      <div class="timer-toggle" onclick="toggleTimerVisible('${key}')">
        <span class="tt-label">⏱ ${labelTekst}${state.toonTimer ? ' verbergen' : ` · ${seconden}s`}</span>
        <div class="switch ${state.toonTimer ? 'on' : ''}"><div class="knob"></div></div>
      </div>
      ${state.toonTimer ? renderTimerRing(key) : ''}
    </div>
  `;
}

function renderTimerRing(key) {
  const s = timerState[key];
  const r = 52;
  const circumference = 2 * Math.PI * r;
  const progressFrac = s.resterend / s.totaal;
  const offset = circumference * (1 - progressFrac);
  const mm = Math.floor(s.resterend / 60);
  const ss = s.resterend % 60;
  const tijdLabel = `${mm}:${String(ss).padStart(2, '0')}`;

  return `
    <div class="timer-ring-wrap ${s.done ? 'done' : ''}" id="ring_${key}">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="timer-ring-bg" cx="60" cy="60" r="${r}"/>
        <circle class="timer-ring-fg" cx="60" cy="60" r="${r}"
          stroke-dasharray="${circumference}"
          stroke-dashoffset="${offset}"/>
      </svg>
      <div class="time" id="time_${key}">${tijdLabel}</div>
    </div>
    <div class="timer-controls">
      <button onclick="timerStartPause('${key}')" id="btn_${key}">${s.actief ? 'Pauze' : (s.resterend === s.totaal ? 'Start' : 'Hervat')}</button>
      <button onclick="timerReset('${key}')">Reset</button>
    </div>
  `;
}

function toggleTimerVisible(key) {
  const s = timerState[key];
  s.toonTimer = !s.toonTimer;
  herteken();
}

// Eén hergebruikte AudioContext, aangemaakt/ontgrendeld op een echte tik van de gebruiker
// (bv. de Start-knop van een timer). Safari op iOS staat geluid alleen toe als de context
// binnen zo'n user-gesture ontstaat — een context die pas ontstaat wanneer de timer afloopt
// (via setInterval) wordt door Safari geweigerd, ook al probeert 'ie meteen te spelen.
let gedeeldeAudioCtx = null;

function ontgrendelAudio() {
  if (gedeeldeAudioCtx) {
    // Als de context om een andere reden gepauzeerd is geraakt, hervat 'm binnen de gesture.
    if (gedeeldeAudioCtx.state === 'suspended') gedeeldeAudioCtx.resume();
    return;
  }
  try {
    gedeeldeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { /* geluid niet beschikbaar op dit toestel, geen probleem */ }
}

function timerStartPause(key) {
  const s = timerState[key];
  if (s.actief) {
    clearInterval(s.intervalId);
    s.actief = false;
  } else {
    if (s.resterend <= 0) return;
    ontgrendelAudio(); // binnen deze klik — dit is de user-gesture die Safari vereist
    s.actief = true;
    s.intervalId = setInterval(() => {
      s.resterend--;
      const instelGrens = s.totaal - (s.instelSeconden || 0); // seconden-punt waar de instelperiode overgaat in de hold zelf
      if (s.resterend <= 0) {
        s.resterend = 0;
        s.actief = false;
        s.done = true;
        clearInterval(s.intervalId);
        timerAfgerond();
      } else if (s.instelSeconden && s.resterend >= instelGrens) {
        // Instelperiode (bv. de +5 sec om in positie te komen bij een hold-timer):
        // elke seconde een piepje, zodat je weet hoeveel tijd je nog hebt om te positioneren.
        speelCountdownPiep();
      } else if (s.resterend === 5 || s.resterend <= 3) {
        // Bij 5 sec één enkel biepje, dan stilte, en vanaf 3 sec elke seconde een piep.
        speelCountdownPiep();
      }
      updateTimerDisplay(key);
    }, 1000);
  }
  herteken();
}

function timerReset(key) {
  const s = timerState[key];
  clearInterval(s.intervalId);
  s.resterend = s.totaal;
  s.actief = false;
  s.done = false;
  herteken();
}

function updateTimerDisplay(key) {
  const s = timerState[key];
  const timeEl = document.getElementById(`time_${key}`);
  const ringWrap = document.getElementById(`ring_${key}`);
  const btnEl = document.getElementById(`btn_${key}`);
  if (!timeEl || !ringWrap) return; // kaart niet meer zichtbaar

  const mm = Math.floor(s.resterend / 60);
  const ss = s.resterend % 60;
  timeEl.textContent = `${mm}:${String(ss).padStart(2, '0')}`;

  const r = 52;
  const circumference = 2 * Math.PI * r;
  const progressFrac = s.resterend / s.totaal;
  const fg = ringWrap.querySelector('.timer-ring-fg');
  if (fg) fg.setAttribute('stroke-dashoffset', circumference * (1 - progressFrac));

  if (s.done) {
    ringWrap.classList.add('done');
    if (btnEl) btnEl.textContent = 'Start';
  }
}

function timerAfgerond() {
  toast('Tijd voorbij ✓');
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]); // werkt niet op iOS Safari — die ondersteunt deze API niet, geen fix mogelijk
  speelAlarmGeluid();
}

/**
 * Eindgeluid van een timer — een snelle dubbele piep op een hoge, felle
 * frequentie zodat het ook doorheen muziek hoorbaar blijft tijdens het trainen,
 * in plaats van de zachte, snel wegstervende toon van eerder.
 */
function speelAlarmGeluid() {
  const ctx = gedeeldeAudioCtx;
  if (!ctx) return; // context is nooit ontgrendeld (bv. timer nooit via Start-knop gestart)
  try {
    const pieptonen = [0, 0.16]; // starttijden van de 2 piepjes, snel achter elkaar
    pieptonen.forEach(offset => {
      const start = ctx.currentTime + offset;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'square'; // scherper, dringender timbre dan een zuivere sinustoon — snijdt beter door muziek
      osc.frequency.value = 1760; // hoger en indringender dan het vorige 880Hz-signaal
      gain.gain.setValueAtTime(0.35, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.14);
      osc.start(start); osc.stop(start + 0.15);
    });
  } catch (e) { /* geluid niet beschikbaar, geen probleem */ }
}

/**
 * Eén kort, herkenbaar piepje voor de countdown tijdens het aflopen van een timer
 * (bv. bij 5 sec, en elke seconde vanaf 3). Minder fel dan het eindgeluid, zodat
 * het duidelijk is dat de timer nog loopt en niet al klaar is.
 */
function speelCountdownPiep() {
  const ctx = gedeeldeAudioCtx;
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.value = 1320;
    gain.gain.setValueAtTime(0.28, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    osc.start(); osc.stop(ctx.currentTime + 0.13);
  } catch (e) { /* geluid niet beschikbaar, geen probleem */ }
}

function herteken() {
  // Bewaar eerst wat er al in de huidige kaart is ingevuld, zodat het uitklappen van
  // een timer of uitleg-blok (die deze functie aanroepen) geen ingevulde reps/gewicht/
  // RIR/vorm resettten wanneer de kaart hierdoor opnieuw wordt opgebouwd.
  bewaarHuidigeKaart();
  if (huidigLogDag) renderLogKaart();
}

// ============================================================
// FASE 2 — PROGRESSIESYSTEEM: instellingen, engine-koppeling, setmodus-UI,
// sessieherstel. Alles hieronder is ADDITIEF: de bestaande exercise-modus-flow
// (renderOefeningKaart/bewaarHuidigeKaart/slaLogDataOpInFirestore, verderop in
// dit bestand) blijft intact en blijft naar "logs" schrijven zoals voorheen.
// Deze nieuwe laag schrijft ERNAAST naar de nieuwe collecties (sets/decisions/
// exerciseState/sessions), zodat de bestaande progressiepagina niets merkt.
// ============================================================

// --- Instellingen (opdracht §14.1) ---------------------------------------
// Globaal: 'set' of 'exercise'. Null = nog niet geladen/opgeslagen, dan geldt
// per oefening de PROGRAM_CONFIG._meta.ratingModeDefaults-fallback.
let ratingModeInstellingen = { globaal: null, perOefening: {} };
let instellingenGeladen = false;

async function laadInstellingenZodraMogelijk() {
  if (!window.firebaseProgressie || !window.firebaseAuth || !window.firebaseAuth.huidigeUser()) return;
  try {
    const opgeslagen = await window.firebaseProgressie.haalInstellingenOp();
    if (opgeslagen) {
      ratingModeInstellingen = {
        globaal: opgeslagen.globaal || null,
        perOefening: opgeslagen.perOefening || {}
      };
    }
  } catch (e) {
    // Geen instellingen opgeslagen of offline — de PROGRAM_CONFIG-defaults vangen dit netjes op.
  }
  try {
    window.deloadStatus = await window.firebaseProgressie.haalDeloadOp();
  } catch (e) {
    console.error('Deloadstatus laden mislukt', e);
    opslagFout('deloadstatus laden')(e);
  }
  instellingenGeladen = true;
}

/**
 * Bepaalt de EFFECTIEVE ratingMode voor één oefening, in volgorde van
 * specificiteit: per-oefening override > globale instelling > PROGRAM_CONFIG-
 * default voor de categorie van die oefening > harde fallback 'exercise'.
 * @param {string} exerciseId - id uit PROGRAM_CONFIG.exercises, of null als er geen match is
 * @param {string} categorie - 'skill'|'strength'|'hypertrophy'|'legs', voor de fallback-tabel
 * @returns {'set'|'exercise'}
 */
function bepaalEffectieveRatingMode(exerciseId, categorie) {
  if (exerciseId && ratingModeInstellingen.perOefening[exerciseId]) {
    return ratingModeInstellingen.perOefening[exerciseId];
  }
  if (ratingModeInstellingen.globaal) return ratingModeInstellingen.globaal;
  const defaults = (window.PROGRAM_CONFIG && window.PROGRAM_CONFIG._meta && window.PROGRAM_CONFIG._meta.ratingModeDefaults) || {};
  if (categorie && defaults[categorie]) return defaults[categorie];
  return 'exercise';
}

function renderInstellingenScherm() {
  setHeader('Instellingen', 'Hoe je trainingen beoordeeld worden', [
    { label: 'Home', action: () => go('home') },
    { label: 'Instellingen', action: () => {} }
  ]);

  const huidigeGlobaal = ratingModeInstellingen.globaal || 'exercise';

  app.innerHTML = `
    <div class="instelling-rij">
      <div>
        <label class="field-label">Beoordelen per</label>
        <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">Geldt voor oefeningen zonder eigen afwijkende instelling</div>
      </div>
      <div class="instelling-toggle-groep">
        <button class="keuze-knop ${huidigeGlobaal === 'set' ? 'gekozen' : ''}" onclick="zetGlobaleRatingMode('set')">Set</button>
        <button class="keuze-knop ${huidigeGlobaal === 'exercise' ? 'gekozen' : ''}" onclick="zetGlobaleRatingMode('exercise')">Oefening</button>
      </div>
    </div>
    <div style="font-size:13px;color:var(--text-dim);line-height:1.6;padding:4px 2px;">
      <b>Set</b>: na elke set apart RIR/vorm/pijn invullen — directe feedback per set.<br>
      <b>Oefening</b>: na de hele oefening één keer RIR/vorm/pijn invullen, geldt voor alle sets — sneller.
    </div>
  `;
}

function zetGlobaleRatingMode(waarde) {
  ratingModeInstellingen.globaal = waarde;
  if (window.firebaseProgressie) {
    window.firebaseProgressie.slaInstellingenOp(ratingModeInstellingen).catch(() => {
      toast('Instelling opslaan mislukt — check je internetverbinding');
    });
  }
  route();
}

// --- Engine-koppeling: SCHEMA-oefening -> PROGRAM_CONFIG-config ----------

/**
 * Normaliseert elke vorm waarin een dag wordt aangeduid ("a", "Dag A", "dag-a", ...)
 * naar de korte letter ("a"/"b"/"c") die program.json gebruikt in exercises[].dag.
 */
function normaliseerDagId(dagRuw) {
  if (!dagRuw) return null;
  const s = String(dagRuw).toLowerCase().trim();
  // Bewust GEEN /[abc]/-scan over de hele string: "Dag C" bevat zelf ook een "a"
  // (in "dag"), dus zo'n scan zou altijd de eerste "a" raken en "Dag C" fout als
  // "a" normaliseren. In plaats daarvan: pak het laatste woord/teken ("c" uit
  // "dag c", of de kale letter "c" als die al los wordt doorgegeven).
  const laatsteWoord = s.split(/[\s_-]+/).pop();
  if (laatsteWoord === 'a' || laatsteWoord === 'b' || laatsteWoord === 'c') return laatsteWoord;
  if (s === 'a' || s === 'b' || s === 'c') return s;
  return null;
}

// Cache-key bevat nu ook dagId, want dezelfde oefeningnaam ("Single-arm lateral
// raise") komt in program.json meerdere keren voor met verschillende id's/ladders
// per dag (bv. single_arm_lateral_raise_a zonder ladder vs. _c mét een +1kg-stap).
// Zonder de dag mee te wegen zou altijd de EERSTE match in de array worden gebruikt,
// ongeacht van welke dag de oefening afkomstig is — dat was een bug in de eerste
// versie van deze functie.
const PROGRAM_CONFIG_CACHE = {};
function vindProgramConfig(naam, dagRuw) {
  if (!naam || !window.PROGRAM_CONFIG) return null;
  const dagId = normaliseerDagId(dagRuw);
  const cacheKey = `${naam}::${dagId || ''}`;
  if (PROGRAM_CONFIG_CACHE[cacheKey] !== undefined) return PROGRAM_CONFIG_CACHE[cacheKey];

  const genormaliseerd = naam.toLowerCase();
  const kandidaten = window.PROGRAM_CONFIG.exercises.filter(e =>
    e.name.toLowerCase() === genormaliseerd ||
    genormaliseerd.startsWith(e.name.toLowerCase()) ||
    genormaliseerd.includes(e.name.toLowerCase())
  );

  let gevonden = null;
  if (kandidaten.length > 1 && dagId) {
    gevonden = kandidaten.find(e => e.dag === dagId) || kandidaten[0];
  } else {
    gevonden = kandidaten[0] || null;
  }

  PROGRAM_CONFIG_CACHE[cacheKey] = gevonden || null;
  return PROGRAM_CONFIG_CACHE[cacheKey];
}

/** Vertaalt een RIR-stringwaarde uit RIR_OPTIES ("4","3","2","1","0") naar een getal voor de engine. "4" ("4+") wordt 4. */
function rirNaarGetal(rirString) {
  if (rirString === null || rirString === undefined || rirString === '') return null;
  const n = Number(rirString);
  return Number.isFinite(n) ? n : null;
}

/** Vertaalt VORM_OPTIES ("goed"/"twijfelachtig"/"slecht") naar het engine-vocabulaire ("goed"/"matig"/"slecht"). */
function vormNaarEngine(vormWaarde) {
  if (vormWaarde === 'twijfelachtig') return 'matig';
  return vormWaarde || null;
}

/** En terug, voor het tonen van een eerder opgeslagen engine-vorm-waarde in de UI. */
function vormVanEngine(engineVorm) {
  if (engineVorm === 'matig') return 'twijfelachtig';
  return engineVorm || null;
}

// --- Sessie-identiteit + herstel-snapshot (opdracht §6 + §16) -------------

let huidigeSessionId = null; // stabiele id voor de lopende logsessie, gezet bij start

function nieuweSessionId(dagId) {
  return `${dagId}_${Date.now()}`;
}

/**
 * Slaat een compacte snapshot van de voortgang op, zodat een afgebroken PWA-
 * sessie (sluiten/crash/achtergrond-kill door iOS) hervat kan worden zodra er
 * weer verbinding is. Wordt aangeroepen na elke "Set klaar" en bij elke
 * kaartwissel — niet per toetsaanslag.
 */
function bewaarSessieVoortgang() {
  if (!huidigeSessionId || !window.firebaseProgressie || !huidigLogDag) return;
  window.firebaseProgressie.slaSessieVoortgangOp(huidigeSessionId, {
    dagId: huidigLogDag.id,
    logIndex,
    isNoodtraining: !!huidigLogDag.isNoodtraining,
    noodKeuzeNamen: huidigLogDag.isNoodtraining
      ? { skill: noodKeuze.skill && noodKeuze.skill.naam, strength: noodKeuze.strength && noodKeuze.strength.naam, hypertrophy: noodKeuze.hypertrophy && noodKeuze.hypertrophy.naam }
      : null,
    energie: huidigeEnergie,
    logData, // ook de ingevulde exercise-modus-kaarten, anders gaat die invoer verloren bij herstel
    setModusState: Object.keys(setModusPerKaart).reduce((acc, idx) => {
      // Alleen data bewaren (geen DOM-referenties of functies) — dit moet als JSON naar Firestore kunnen.
      const k = setModusPerKaart[idx];
      acc[idx] = {
        geclassificeerdeSets: k.geclassificeerdeSets,
        exerciseState: k.exerciseState,
        startStateStatus: k.startStateStatus,
        modus: k.modus,
        afgerond: k.afgerond,
        actieveSet: k.actieveSet,
        genegeerdeVoorstellen: k.genegeerdeVoorstellen,
        pijnGestopt: k.pijnGestopt,
        oefeningBeslissing: k.oefeningBeslissing,
        uitkomst: k.uitkomst,
        testSet: k.testSet,
        testOvergeslagen: k.testOvergeslagen,
        _laatstVerwerkteSignature: k._laatstVerwerkteSignature
      };
      return acc;
    }, {})
  }).catch(opslagFout('herstel-snapshot'));
}

/** Controleert of er een onafgeronde sessie van een ANDERE eerdere keer bestaat, voor de herstel-banner op de Trainen-pagina. */
let openSessieVoorHerstel = null;
async function checkOpenSessies() {
  if (!window.firebaseProgressie || !window.firebaseAuth || !window.firebaseAuth.huidigeUser()) return;
  try {
    const sessies = await window.firebaseProgressie.haalOpenSessiesOp();
    // Sluit de sessie uit die we zelf nu actief aan het opbouwen zijn.
    openSessieVoorHerstel = sessies.find(s => s.id !== huidigeSessionId) || null;
  } catch (e) {
    openSessieVoorHerstel = null;
  }
}

function renderHerstelBanner() {
  if (!openSessieVoorHerstel) return '';
  const dag = SCHEMA.dagen.find(d => d.id === openSessieVoorHerstel.dagId);
  const dagNaam = dag ? dag.naam : openSessieVoorHerstel.dagId;
  return `
    <div class="herstel-banner">
      <div class="herstel-banner-titel">Onafgeronde training gevonden</div>
      <div class="herstel-banner-sub">${dagNaam} — niet afgerond, waarschijnlijk door het sluiten van de app.</div>
      <div class="herstel-banner-knoppen">
        <button class="btn primary" onclick="hervatSessie('${openSessieVoorHerstel.id}')">Hervatten</button>
        <button class="btn danger-outline" onclick="verwijderOnafgerondeSessie('${openSessieVoorHerstel.id}')">Verwijderen</button>
      </div>
    </div>
  `;
}

async function hervatSessie(sessionId) {
  if (!window.firebaseProgressie) return;
  try {
    const snap = await window.firebaseProgressie.haalOpenSessiesOp();
    const sessie = snap.find(s => s.id === sessionId);
    if (!sessie) { toast('Sessie niet meer gevonden'); openSessieVoorHerstel = null; herteken(); return; }
    huidigeSessionId = sessionId;
    const dag = SCHEMA.dagen.find(d => d.id === sessie.dagId);
    if (!dag) { toast('Dag niet gevonden'); return; }
    // Noodversie-keuzes terugzetten op naam (SCHEMA heeft geen stabiele id's voor nood-opties).
    if (sessie.isNoodtraining && sessie.noodKeuzeNamen) {
      noodKeuze = {
        skill: NOODVERSIE_KEUZES.skill.find(o => o.naam === sessie.noodKeuzeNamen.skill) || null,
        strength: NOODVERSIE_KEUZES.strength.find(o => o.naam === sessie.noodKeuzeNamen.strength) || null,
        hypertrophyDag: null,
        hypertrophy: null,
        hitMuscles: leegHitMuscles()
      };
      // hypertrophy staat verspreid over dagen in NOODVERSIE_KEUZES.hypertrophy — doorzoeken op naam.
      Object.keys(NOODVERSIE_KEUZES.hypertrophy).forEach(dagKey => {
        const match = NOODVERSIE_KEUZES.hypertrophy[dagKey].find(o => o.naam === sessie.noodKeuzeNamen.hypertrophy);
        if (match) { noodKeuze.hypertrophy = match; noodKeuze.hypertrophyDag = dagKey; }
      });
      noodKeuzeActief = true;
    }
    openSessieVoorHerstel = null;
    go('loggen/' + dag.id);
    // renderLoggen bouwt logOefeningen opnieuw op; logIndex en setModusPerKaart na die opbouw herstellen.
    setTimeout(() => {
      logIndex = Math.min(sessie.logIndex || 0, logOefeningen.length - 1);
      if (sessie.logData) logData = sessie.logData;
      huidigeEnergie = typeof sessie.energie === 'number' ? sessie.energie : null;
      if (sessie.setModusState) {
        Object.keys(sessie.setModusState).forEach(idx => {
          const k = Object.assign(nieuweSetModusKaartState(), sessie.setModusState[idx]);
          const sets = k.geclassificeerdeSets || [];
          // het feedbackpaneel hoort bij de laatst beoordeelde set
          k.laatsteSetResultaat = sets.length ? sets[sets.length - 1].resultaat : null;
          setModusPerKaart[idx] = k;
        });
      }
      renderLogKaart();
    }, 0);
  } catch (e) {
    toast('Hervatten mislukt — check je internetverbinding');
  }
}

async function verwijderOnafgerondeSessie(sessionId) {
  const fp = window.firebaseProgressie;
  if (!fp) return;
  try {
    // De beslissingen van deze afgebroken training tellen niet mee (zie markeerSessieAlsVerworpen).
    const beslissingen = await fp.haalDecisionsVanSessieOp(sessionId);
    await Promise.all(beslissingen
      .filter(d => (d.decisionType === 'EXERCISE' || d.decisionType === 'OVERRULE') && !d.vervangenDoor)
      .map(d => fp.werkDecisionBijOp(d.id, { vervangenDoor: 'verworpen' })));
    await fp.verwijderSessieOp(sessionId);
    openSessieVoorHerstel = null;
    toast('Onafgeronde training verwijderd');
    herteken();
  } catch (e) {
    console.error('Onafgeronde sessie verwijderen mislukt:', e);
    toast('Verwijderen mislukt — check je internetverbinding');
  }
}

// ============================================================
// FASE 3 — OEFENINGSOVERZICHT (opdracht §14.4, §14.5, §17 Fase 3)
//
// Samenvattingskaart na elke oefening, bevestigen/overrulen van
// progressiebeslissingen, en het vastleggen daarvan. Daaronder staat ook het
// herstel van een aantal Fase 2-gebreken die dit fundament nodig had
// (zie README-FASE3.md, sectie "Gevonden en hersteld uit Fase 2").
//
// Ontwerp in één alinea: tijdens de training worden sets en beslissingen DIRECT
// bewaard (opdracht §18.8), maar de oefeningstatus (niveau, streaks, pijnblokkade)
// verandert pas wanneer de training wordt opgeslagen (commitSessieUitkomsten). Zo
// betekent "zonder opslaan verlaten" echt dat de voortgang niet verandert, en
// gebeurt er nooit iets aan je niveau midden in een training (opdracht §18.5).
// ============================================================

// --- Zichtbare opslagfouten -------------------------------------------------
// In Fase 2 verdwenen mislukte Firestore-writes in `.catch(() => {})`. Daardoor
// bleef o.a. onopgemerkt dat de SET-beslissingen in setmodus nooit werden
// opgeslagen. Elke fout wordt nu geteld, gelogd en één keer per soort getoond.
const opslagFouten = { aantal: 0, perSoort: {} };
function opslagFout(soort) {
  return (fout) => {
    opslagFouten.aantal++;
    opslagFouten.perSoort[soort] = (opslagFouten.perSoort[soort] || 0) + 1;
    console.error(`Opslaan mislukt (${soort}):`, fout);
    if (opslagFouten.perSoort[soort] === 1) toast(`Opslaan mislukt: ${soort} — check je internetverbinding`);
  };
}

function exerciseIdVoor(o, config) {
  return (config && config.id) || `schema_${o.naam.toLowerCase().replace(/[^a-z0-9]+/g, '_')}`;
}

/** Vaste, vlakke samenvatting van de config die bij een beslissing gold (opdracht §12.2, "welke configuratie gold?"). */
function configSnapshotVan(config) {
  const c = config || {};
  const meta = (window.PROGRAM_CONFIG && window.PROGRAM_CONFIG._meta) || {};
  return {
    id: c.id ?? null, type: c.type ?? null, sets: c.sets ?? null,
    repMin: c.repMin ?? null, repMax: c.repMax ?? null,
    holdStart: c.holdStart ?? null, holdMax: c.holdMax ?? null, testSec: c.testSec ?? null,
    restSec: c.restSec ?? null,
    ladder: (Array.isArray(c.ladder) ? c.ladder : []).map(l => ({ id: l.id, gate: l.gate ?? null })),
    programVersie: meta.versie ?? null
  };
}

function revisieId(basisId, revisie) { return revisie <= 1 ? basisId : `${basisId}_r${revisie}`; }

function markeerVervangen(oudId, nieuwId) {
  if (!window.firebaseProgressie || !oudId) return;
  window.firebaseProgressie.werkDecisionBijOp(oudId, { vervangenDoor: nieuwId }).catch(opslagFout('beslissing bijwerken'));
}

function dagenSinds(ms) {
  return typeof ms === 'number' ? Math.max(0, Math.floor((Date.now() - ms) / 86400000)) : null;
}

function exerciseContext(kaartState) {
  const d = dagenSinds(kaartState.exerciseState && kaartState.exerciseState.lastPerformedAt);
  const context = d === null ? {} : { daysSinceLastPerformed: d };
  if (deloadIsActief()) context.deloadActive = true; // opdracht §9 regel 2 / §11: HOLD, geen progressie
  return context;
}

// --- Startstate van een oefening laden --------------------------------------
// In Fase 2 werd de oefeningstatus wel geschreven maar nooit teruggelezen, dus
// elke training begon met een lege state en streaks konden niet bestaan.
// Cache per sessie: exerciseId -> { status: 'ok', data|null } of { status: 'fout' }.
// "ok" met data=null betekent: er is nog geen state (nieuwe oefening) — dat is
// geldig. "fout" betekent: ophalen mislukt — dan is de state ONBEKEND en wordt er
// voor die oefening niets aan voortgang weggeschreven (anders zouden we echte
// streaks en niveaus overschrijven met een lege state).
const exerciseStateCache = {};
const STATE_VELDEN = ['currentLevelId', 'currentTarget', 'successStreak', 'failureStreak', 'stagnationStreak',
  'painBlocked', 'painFreeStreak', 'holdMaxStreak', 'lastPerformedAt', 'awaitingTest', 'recent', 'status'];

function schoneState(data) {
  const uit = {};
  if (data) STATE_VELDEN.forEach(k => { if (data[k] !== undefined) uit[k] = data[k]; });
  return uit;
}

function startStateVoorIdx(idx) {
  const o = logOefeningen[idx];
  const id = exerciseIdVoor(o, bouwEngineConfig(o));
  const c = exerciseStateCache[id];
  if (!c) return { status: 'laden', state: {} };
  if (c.status === 'fout') return { status: 'fout', state: {} };
  return { status: 'ok', state: schoneState(c.data) };
}

function laadExerciseStatesVoorSessie() {
  if (!window.firebaseProgressie || !window.firebaseAuth || !window.firebaseAuth.huidigeUser()) return Promise.resolve();
  const ids = [...new Set(logOefeningen
    .filter(o => o.type !== 'warmup' && o.type !== 'cooldown')
    .map(o => exerciseIdVoor(o, bouwEngineConfig(o))))];
  ids.forEach(id => { delete exerciseStateCache[id]; });
  return Promise.all(ids.map(id =>
    window.firebaseProgressie.haalExerciseStateOp(id)
      .then(data => { exerciseStateCache[id] = { status: 'ok', data: data || null }; })
      .catch(e => { exerciseStateCache[id] = { status: 'fout' }; console.error('Oefeningstatus laden mislukt:', id, e); })
  )).then(hydrateStartStates);
}

/** Kaarten die al bestonden voordat de state binnen was, krijgen 'm alsnog — zolang er nog niets is beoordeeld. */
function hydrateStartStates() {
  Object.keys(setModusPerKaart).forEach(idx => {
    const k = setModusPerKaart[idx];
    if (!k || k.startStateStatus !== 'laden') return;
    if (k.geclassificeerdeSets.length > 0) { k.startStateStatus = 'fout'; return; } // te laat: er is al op een lege state beoordeeld
    const s = startStateVoorIdx(idx);
    k.exerciseState = s.state;
    k.startStateStatus = s.status;
  });
}

// --- Beslissing van een oefening vastleggen ---------------------------------
const OVERRULE_LABELS = { HOLD: 'Behouden', UP: 'Omhoog', DOWN: 'Omlaag' };
const BRON_TEKST = {
  auto: 'automatisch doorgevoerd (kleine stap)',
  bevestigd: 'door jou bevestigd',
  overrule: 'door jou aangepast',
  pijn_hervat: 'hervat na pijnblokkade, één niveau lager'
};

function levelChangeTekst(config, lc) {
  const H = window.ProgressieHistorie;
  return `Niveau van "${H.niveauLabel(config, lc.van)}" naar "${H.niveauLabel(config, lc.naar)}" — ${BRON_TEKST[lc.bron] || lc.bron}.`;
}

function classificeerVoorOefening(s) {
  const E = window.ProgressieEngine;
  const stopte = !!(s.resultaat && s.resultaat.nextSet && s.resultaat.nextSet.action === E.SET_ACTION.STOP_EXERCISE);
  return {
    setClass: s.setClass, reps: s.data.reps, holdSec: s.data.holdSec, rir: s.data.rir,
    form: s.data.form, load: s.data.load, type: s.data.type, pain: s.data.pain === true,
    // de engine leest `stopped` voor de vermoeidheidsstop (hold); een pijnstop (BLOCKED) loopt via de pijnregel
    stopped: stopte && s.setClass !== E.SET_CLASS.BLOCKED
  };
}

/**
 * Draait evaluateExercise() over de tot nu toe beoordeelde sets en legt de uitkomst
 * vast. De state en eventuele niveauwijziging worden hier alleen BEREKEND
 * (kaartState.uitkomst.transitie); ze worden pas weggeschreven door
 * commitSessieUitkomsten() wanneer de training wordt opgeslagen.
 * @returns {boolean} true als er een uitkomst is vastgelegd
 */
function sluitOefeningAf(idx, o, config, kaartState) {
  const E = window.ProgressieEngine;
  const classified = kaartState.geclassificeerdeSets.map(classificeerVoorOefening);
  if (kaartState.testSet) classified.unshift(classificeerVoorOefening(kaartState.testSet));
  const context = exerciseContext(kaartState);
  const exerciseResultaat = E.evaluateExercise(config, kaartState.exerciseState, classified, context);
  if (exerciseResultaat.valid === false) {
    toast(`Oefeningsanalyse mislukt: ${exerciseResultaat.errorMessage}`);
    return false;
  }
  kaartState.oefeningBeslissing = exerciseResultaat;
  kaartState.afgerond = true;
  legUitkomstVast(idx, o, config, classified, exerciseResultaat, context);
  return true;
}

/** Totaal reps of holdseconden van de geldige werksets (basis voor stagnatiedetectie). */
function totaalVanSets(classified, config) {
  const E = window.ProgressieEngine;
  return classified
    .filter(s => s.type !== 'test' && s.type !== 'warmup' && s.setClass && s.setClass !== E.SET_CLASS.INVALID && s.setClass !== E.SET_CLASS.BLOCKED)
    .reduce((t, s) => t + ((config.type === 'hold' ? s.holdSec : s.reps) || 0), 0);
}
function stagnatieDrempelUitConfig() {
  const m = window.PROGRAM_CONFIG && window.PROGRAM_CONFIG._meta && window.PROGRAM_CONFIG._meta.stagnatie;
  return m && typeof m.sessiesAchtereen === 'number' ? m.sessiesAchtereen : 3;
}

function legUitkomstVast(idx, o, config, classified, exerciseResultaat, context) {
  const E = window.ProgressieEngine;
  const kaartState = haalOfMaakSetModusState(idx);
  const exerciseId = exerciseIdVoor(o, config);
  const vorige = kaartState.uitkomst || null;
  const revisie = (vorige ? vorige.revisie : 0) + 1;
  const decisionId = revisieId(`${huidigeSessionId}_${exerciseId}_exercise`, revisie);
