    return evaluateRepsSet(config, state, setsSoFar, newSet, baseRest);
  }

  // --- Prioriteit 4: Hold-oefeningen ---
  if (config.type === 'hold') {
    return evaluateHoldSet(config, state, setsSoFar, newSet, baseRest);
  }

  // Onbereikbaar gegeven de validatie hierboven, maar nooit stilzwijgend doorvallen.
  return invalid('UNHANDLED_TYPE', `Oefeningstype "${config.type}" wordt niet ondersteund.`);
}

/**
 * Reps-oefeningen — opdracht §8.3.
 */
function evaluateRepsSet(config, state, setsSoFar, newSet, baseRest) {
  const reps = typeof newSet.reps === 'number' ? newSet.reps : 0;
  const rir = typeof newSet.rir === 'number' ? newSet.rir : null;
  const { repMin, repMax } = config;

  // Vorm = matig: set wordt wel geregistreerd/geclassificeerd volgens de normale
  // regels, maar mag straks in evaluateExercise niet als bewijs voor progressie
  // tellen (dat wordt daar afgehandeld via form !== 'goed').

  const eerdereTeZwaarInDezeOefening = setsSoFar.filter(s => s.setClass === SET_CLASS.TE_ZWAAR).length;

  let result;

  if (reps < repMin) {
    result = {
      setClass: SET_CLASS.TE_ZWAAR,
      action: SET_ACTION.REST_LONGER,
      restExtra: 30,
      reasonText: `Je haalde ${reps} herhalingen, onder het streefminimum van ${repMin}. Extra rust ingelast.`,
      ruleId: 'REPS_TE_ZWAAR'
    };
  } else if (reps >= repMax && rir !== null && rir >= 3) {
    result = {
      setClass: SET_CLASS.TE_LICHT,
      action: SET_ACTION.SUGGEST_LOAD_UP,
      restExtra: 0,
      reasonText: `Je haalde het maximale aantal herhalingen (${reps}) met veel reserve (RIR ${rir}). De belasting mag waarschijnlijk omhoog.`,
      ruleId: 'REPS_TE_LICHT_RIR3PLUS'
    };
  } else if (reps >= repMax && rir !== null && (rir === 1 || rir === 2)) {
    result = {
      setClass: SET_CLASS.TOP,
      action: SET_ACTION.SAME,
      restExtra: 0,
      reasonText: `Je behaalde het maximale aantal herhalingen (${reps}) met voldoende reserve (RIR ${rir}).`,
      ruleId: 'REPS_TOP_RIR1_2'
    };
  } else if (rir === 0) {
    result = {
      setClass: SET_CLASS.OP_DOEL,
      action: SET_ACTION.REST_LONGER,
      restExtra: 30,
      reasonText: reps < 1 && setsSoFar.filter(s => s.n === undefined).length === 0
        ? 'Zwaarder dan gepland — RIR 0 bij de eerste set.'
        : 'RIR 0 geregistreerd. Extra rust ingelast voor de volgende set.',
      ruleId: 'REPS_RIR0_EXTRA_RUST'
    };
  } else if (reps >= repMin && reps < repMax && rir !== null && rir >= 2) {
    result = {
      setClass: SET_CLASS.OP_DOEL,
      action: SET_ACTION.SAME,
      restExtra: 0,
      targetRepsOverride: Math.min(reps + 1, repMax),
      reasonText: `Binnen het streefbereik (${reps} herhalingen) met voldoende reserve. Volgende keer eventueel +1 rep.`,
      ruleId: 'REPS_OP_DOEL'
    };
  } else {
    // Binnen bereik maar RIR 1 (niet expliciet in de tabel, valt tussen TOP- en
    // OP_DOEL-voorwaarden) — classificeren als OP_DOEL zonder specifieke actie,
    // dit is de veilige, niet-progressie-bevorderende default middenin het bereik.
    result = {
      setClass: SET_CLASS.OP_DOEL,
      action: SET_ACTION.SAME,
      restExtra: 0,
      reasonText: `Binnen het streefbereik (${reps} herhalingen).`,
      ruleId: 'REPS_OP_DOEL_DEFAULT'
    };
  }

  // RIR 0 bij set 1 van de oefening: speciale melding (opdracht §8.3: "RIR 0 bij set 1:
  // toon de melding 'Zwaarder dan gepland'"), ongeacht welke tak hierboven koos.
  const isEersteSet = setsSoFar.length === 0;
  if (rir === 0 && isEersteSet) {
    result.reasonText = 'Zwaarder dan gepland dan verwacht — RIR 0 bij de eerste set. Extra rust ingelast.';
    result.ruleId = 'REPS_RIR0_SET1_ZWAARDER';
    result.action = SET_ACTION.REST_LONGER;
    result.restExtra = 30;
  }

  // Twee opeenvolgende TE_ZWAAR-sets: voorstel belasting omlaag, alleen als de
  // eerstvolgende ladderstap SINGLE is (CONFIRM2 => geen automatische wijziging,
  // wat hier betekent: geen voorstel tonen, de set blijft gewoon TE_ZWAAR).
  if (result.setClass === SET_CLASS.TE_ZWAAR && eerdereTeZwaarInDezeOefening >= 1) {
    const volgendeStapGate = bepaalVolgendeGate(config, state, 'omlaag');
    if (volgendeStapGate === 'single') {
      result.action = SET_ACTION.SUGGEST_LOAD_DOWN;
      result.reasonText = 'Twee sets achter elkaar onder het streefminimum. Een stap terug in belasting kan verstandig zijn.';
      result.ruleId = 'REPS_TE_ZWAAR_TWEEMAAL_LOAD_DOWN';
    }
    // Bij confirm2 blijft de actie zoals hierboven bepaald (REST_LONGER), geen
    // automatische wijziging — conform opdracht §8.3.
  }

  // Maximaal één voorstel voor belastingverhoging per oefening per training.
  if (result.action === SET_ACTION.SUGGEST_LOAD_UP) {
    const alGehadDitKeer = setsSoFar.some(s => s.lastAction === SET_ACTION.SUGGEST_LOAD_UP);
    if (alGehadDitKeer) {
      result.action = SET_ACTION.SAME;
      result.reasonText = 'Je haalde opnieuw het maximum met reserve — er is deze training al eerder een verhoging voorgesteld.';
      result.ruleId = 'REPS_LOAD_UP_AL_VOORGESTELD';
    }
  }

  const targetReps = result.targetRepsOverride !== undefined ? result.targetRepsOverride : (reps < repMax ? repMax : repMax);

  return {
    setClass: result.setClass,
    nextSet: {
      action: result.action,
      targetReps: Math.min(targetReps, repMax),
      targetHold: null,
      targetLoad: newSet.load ?? null,
      restSec: baseRest + (result.restExtra || 0)
    },
    reasonText: result.reasonText,
    ruleId: result.ruleId
  };
}

/**
 * Hold-oefeningen — opdracht §8.4.
 */
function evaluateHoldSet(config, state, setsSoFar, newSet, baseRest) {
  const holdSec = typeof newSet.holdSec === 'number' ? newSet.holdSec : 0;
  const { holdStart, holdMax } = config;
  const target = holdMax; // "target" = het doel voor déze training; bij ontbrekend state-target vallen we terug op holdMax
  const eersteSetHold = setsSoFar.length > 0 && typeof setsSoFar[0].holdSec === 'number'
    ? setsSoFar[0].holdSec
    : holdSec; // als dit de eerste set zelf is, is "set 1" deze set

  let result;

  if (holdSec >= target) {
    result = {
      setClass: setsSoFar.length === 0 ? SET_CLASS.TOP : SET_CLASS.OP_DOEL,
      action: SET_ACTION.SAME,
      restExtra: 0,
      reasonText: `Je hield ${holdSec} sec vast, het doel van ${target} sec is behaald.`,
      ruleId: 'HOLD_TARGET_BEHAALD'
    };
  } else if (holdSec < target * 0.5) {
    result = {
      setClass: SET_CLASS.TE_ZWAAR,
      action: SET_ACTION.REST_LONGER,
      restExtra: 60,
      reasonText: `Je hield ${holdSec} sec vast, minder dan de helft van het doel (${target} sec).`,
      ruleId: 'HOLD_TE_ZWAAR'
    };
  } else if (setsSoFar.length > 0 && holdSec < eersteSetHold * 0.7) {
    result = {
      setClass: SET_CLASS.VERMOEID,
      action: SET_ACTION.STOP_EXERCISE,
      restExtra: 0,
      reasonText: `Je hield ${holdSec} sec vast, minder dan 70% van je eerste set (${eersteSetHold} sec). De oefening wordt gestopt.`,
      ruleId: 'HOLD_ONDER_70PCT_STOP'
    };
  } else if (setsSoFar.length > 0 && holdSec < eersteSetHold * 0.8) {
    result = {
      setClass: SET_CLASS.VERMOEID,
      action: SET_ACTION.REST_LONGER,
      restExtra: 45,
      reasonText: `Je hield ${holdSec} sec vast, minder dan 80% van je eerste set (${eersteSetHold} sec). Extra rust ingelast.`,
      ruleId: 'HOLD_VERMOEID'
    };
  } else {
    result = {
      setClass: SET_CLASS.OP_DOEL,
      action: SET_ACTION.SAME,
      restExtra: 0,
      reasonText: `Je hield ${holdSec} sec vast — onder het doel maar binnen een normale bandbreedte.`,
      ruleId: 'HOLD_OP_DOEL'
    };
  }

  return {
    setClass: result.setClass,
    nextSet: {
      action: result.action,
      targetReps: null,
      targetHold: Math.min(target, holdMax),
      targetLoad: newSet.load ?? null,
      restSec: baseRest + (result.restExtra || 0)
    },
    reasonText: result.reasonText,
    ruleId: result.ruleId
  };
}

/**
 * Bepaalt het gate-type dat relevant is voor een stap vanaf het huidige niveau.
 *
 * - "omhoog": het gate-type van de EERSTVOLGENDE (hogere) ladderstap — dat is de
 *   stap die zou worden doorgevoerd bij progressie.
 * - "omlaag": het gate-type van het HUIDIGE niveau zelf — dat is de stap waarmee
 *   je ooit op dit niveau bent gekomen, en dus de stap die zou worden teruggedraaid
 *   bij een regressie. Een CONFIRM2-niveau terugdraaien is immers net zo'n grote
 *   wijziging als het was om ernaartoe te gaan, dus mag niet automatisch.
 *
 * Geeft null terug als er geen volgend niveau bestaat (plafond) resp. als het
 * huidige niveau het eerste/onbekende niveau is (bodem — er is dan niets "groots"
 * om terug te draaien, dus geen blokkade op basis van gate).
 *
 * @param {Object} config
 * @param {Object} state
 * @param {'omhoog'|'omlaag'} richting
 * @returns {'single'|'confirm2'|null}
 */
function bepaalVolgendeGate(config, state, richting) {
  const ladder = Array.isArray(config.ladder) ? config.ladder : [];
  if (ladder.length === 0) return null;
  const huidigeIndex = ladder.findIndex(l => l.id === (state && state.currentLevelId));

  if (richting === 'omhoog') {
    if (huidigeIndex === -1) return ladder.length > 0 ? ladder[0].gate : null;
    const volgendeIndex = huidigeIndex + 1;
    if (volgendeIndex >= ladder.length) return null;
    return ladder[volgendeIndex].gate;
  }

  // richting === 'omlaag': gate van het HUIDIGE niveau (de stap die wordt teruggedraaid).
  if (huidigeIndex === -1) return null; // onbekend niveau: geen basis om een gate aan te hangen
  return ladder[huidigeIndex].gate;
}

// ------------------------------------------------------------
// evaluateExercise() — Niveau 2: oefeningsanalyse.
//
// Prioriteitsvolgorde (opdracht §9):
//   1. Pijnblokkade
//   2. Lange onderbreking (≥14 dagen) of actieve deload
//   3. Meerdere belastingsniveaus in één training → kies primair niveau
//   4. Reps-progressiebeslissing
//   5. Hold-progressiebeslissing
//   6. Stagnatie
//   7. Bevestigingslogica (gate-afhankelijk, verweven in UP-paden hierboven)
//
// @param {Object} config - de program.json-config van déze ene oefening
// @param {Object} state - exercise-state (zie Firestore §12.1)
// @param {Array<Object>} classifiedSets - alle door evaluateSet() geclassificeerde
//        WERKsets van deze oefening in deze training (warmup/test niet nodig hier)
// @param {Object} context - { daysSinceLastPerformed, deloadActive, history } waarbij
//        history (optioneel) eerdere sessies bevat voor stagnatie-/streak-detectie:
//        [{ totalReps, totalHoldSec, levelId, allTop, rirMin, formAllGood, failedSetCount }]
// @returns {Object} { decision, nextTarget, reasonText, ruleId } of
//          { valid: false, errorCode, errorMessage } bij ongeldige invoer
// ------------------------------------------------------------
function evaluateExercise(config, state, classifiedSets, context) {
  if (!config || typeof config !== 'object') {
    return invalid('MISSING_CONFIG', 'Oefeningsconfiguratie ontbreekt.');
  }
  if (config.type !== 'reps' && config.type !== 'hold') {
    return invalid('INVALID_CONFIG_TYPE', `Onbekend oefeningstype "${config.type}" — verwacht "reps" of "hold".`);
  }
  if (!Array.isArray(classifiedSets)) {
    return invalid('MISSING_SETS', 'classifiedSets moet een array zijn.');
  }

  state = state || {};
  context = context || {};
  config = configVoorNiveau(config, state.currentLevelId);

  // Test- en warm-upsets zijn nooit werksets: ze tellen niet mee voor de reps-/hold-analyse (opdracht §6/§10).
  const testSet = classifiedSets.find(s => s && s.type === 'test') || null;
  const werkSets = classifiedSets.filter(s => s && s.setClass && s.setClass !== null && s.type !== 'test' && s.type !== 'warmup');
  const geldigeWerkSets = werkSets.filter(s => s.setClass !== SET_CLASS.INVALID);

  // --- Regel 1: Pijnblokkade ---
  // Pijn in een testset blokkeert net zo goed als pijn in een werkset.
  const pijnInDezeSessie = werkSets.some(s => s.setClass === SET_CLASS.BLOCKED)
    || (testSet !== null && (testSet.setClass === SET_CLASS.BLOCKED || testSet.pain === true))
    || state.painBlocked === true;
  if (pijnInDezeSessie) {
    const pijnvrijeSessiesAchtereen = typeof state.painFreeStreak === 'number' ? state.painFreeStreak : 0;
    if (state.painBlocked === true && pijnvrijeSessiesAchtereen < 2) {
      return {
        decision: EXERCISE_DECISION.BLOCKED,
        nextTarget: { levelId: verlaagNiveau(config, state), targetReps: null, targetSets: config.sets || null },
        reasonText: 'Deze oefening is geblokkeerd vanwege eerder gemelde pijn. Hervatten kan pas na twee opeenvolgende pijnvrije sessies, één niveau lager.',
        ruleId: 'EXERCISE_PAIN_BLOCKED'
      };
    }
    return {
      decision: EXERCISE_DECISION.BLOCKED,
      nextTarget: { levelId: verlaagNiveau(config, state), targetReps: null, targetSets: config.sets || null },
      reasonText: 'Pijn geregistreerd tijdens deze sessie. Geen progressie toegestaan totdat twee opeenvolgende sessies pijnvrij zijn.',
      ruleId: 'EXERCISE_PAIN_NEW_BLOCK'
    };
  }

  // --- Regel 2: Lange onderbreking of deload ---
  const dagenSindsLaatsteKeer = typeof context.daysSinceLastPerformed === 'number' ? context.daysSinceLastPerformed : null;
  if ((dagenSindsLaatsteKeer !== null && dagenSindsLaatsteKeer >= 14) || context.deloadActive === true) {
    return {
      decision: EXERCISE_DECISION.HOLD,
      nextTarget: { levelId: state.currentLevelId || null, targetReps: state.currentTarget ? state.currentTarget.reps : null, targetSets: config.sets || null },
      reasonText: context.deloadActive === true
        ? 'Er is een deload actief. Het niveau blijft gelijk, geen progressie deze week.'
        : `Deze oefening is minimaal 14 dagen niet uitgevoerd (${dagenSindsLaatsteKeer} dagen). Niveau blijft gelijk om geen progressie op verouderde prestaties te baseren.`,
      ruleId: context.deloadActive === true ? 'EXERCISE_DELOAD_HOLD' : 'EXERCISE_LONG_BREAK_HOLD'
    };
  }

  // --- Testpoging (hold, regel 5): beslist op de testset alleen; werksets zijn dan bijzaak ---
  if (config.type === 'hold' && state.awaitingTest === true && testSet) {
    return evaluateHoldTest(config, state, testSet);
  }

  if (geldigeWerkSets.length === 0) {
    return {
      decision: EXERCISE_DECISION.HOLD,
      nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: config.sets || null },
      reasonText: 'Geen geldige werksets om te beoordelen.',
      ruleId: 'EXERCISE_NO_VALID_SETS'
    };
  }

  // --- Regel 3: Meerdere belastingsniveaus in één training ---
  // (Alleen relevant als sets een load-veld voeren; bij gelijkspel wint het hoogste niveau.)
  const niveauGroepen = groepeerOpLoad(geldigeWerkSets);
  const primaireGroep = kiesPrimaireGroep(niveauGroepen);
  const primaireSets = primaireGroep ? primaireGroep.sets : geldigeWerkSets;

  // --- Regel 4/5: Reps- of hold-progressiebeslissing ---
  if (config.type === 'reps') {
    return evaluateExerciseReps(config, state, primaireSets, context);
  }
  return evaluateExerciseHold(config, state, primaireSets, context);
}

function groepeerOpLoad(sets) {
  const groepen = new Map();
  sets.forEach(s => {
    const key = s.load === undefined || s.load === null ? '__geen_load__' : String(s.load);
    if (!groepen.has(key)) groepen.set(key, { load: s.load ?? null, sets: [] });
    groepen.get(key).sets.push(s);
  });
  return Array.from(groepen.values());
}

function kiesPrimaireGroep(groepen) {
  if (groepen.length === 0) return null;
  if (groepen.length === 1) return groepen[0];
  // Meeste geldige werksets wint; bij gelijkspel het hoogste niveau (load).
  let beste = groepen[0];
  groepen.forEach(g => {
    if (g.sets.length > beste.sets.length) {
      beste = g;
    } else if (g.sets.length === beste.sets.length) {
      const gLoad = typeof g.load === 'number' ? g.load : -Infinity;
      const besteLoad = typeof beste.load === 'number' ? beste.load : -Infinity;
      if (gLoad > besteLoad) beste = g;
    }
  });
  return beste;
}

function evaluateExerciseReps(config, state, sets, context) {
  const alleTop = sets.every(s => s.setClass === SET_CLASS.TOP);
  const alleGoedeVorm = sets.every(s => s.form === 'goed');
  const minRir = sets.reduce((min, s) => (typeof s.rir === 'number' && s.rir < min ? s.rir : min), Infinity);
  const heeftRir0 = sets.some(s => s.rir === 0);
  const teZwaarOfInvalidCount = sets.filter(s => s.setClass === SET_CLASS.TE_ZWAAR || s.setClass === SET_CLASS.INVALID).length;

  // --- Progressie: UP ---
  if (alleTop && alleGoedeVorm && minRir >= 1 && !heeftRir0) {
    const volgendeGate = bepaalVolgendeGate(config, state, 'omhoog');
    if (volgendeGate === null) {
      return {
        decision: EXERCISE_DECISION.HOLD,
        nextTarget: { levelId: state.currentLevelId || null, targetReps: config.repMax, targetSets: config.sets },
        reasonText: 'Alle werksets zijn succesvol, maar er is geen volgend ladderniveau beschikbaar (plafond bereikt). Niveau blijft gelijk.',
        ruleId: 'EXERCISE_LADDER_CEILING'
      };
    }
    if (volgendeGate === 'single') {
      const nieuweLevelId = volgendLevelId(config, state);
      return {
        decision: EXERCISE_DECISION.UP,
        nextTarget: { levelId: nieuweLevelId, targetReps: config.repMin, targetSets: config.sets },
        reasonText: 'Alle werksets zijn succesvol afgerond. Je voldoet aan de voorwaarden voor progressie.',
        ruleId: 'EXERCISE_ALL_TOP_SINGLE_UP'
      };
    }
    // confirm2: pas UP na twee opeenvolgende succesvolle sessies.
    const successStreak = (typeof state.successStreak === 'number' ? state.successStreak : 0) + 1;
    if (successStreak >= 2) {
      const nieuweLevelId = volgendLevelId(config, state);
      return {
        decision: EXERCISE_DECISION.UP,
        nextTarget: { levelId: nieuweLevelId, targetReps: config.repMin, targetSets: config.sets },
        reasonText: 'Twee opeenvolgende succesvolle sessies op dit niveau. De grote progressiestap wordt bevestigd.',
        ruleId: 'EXERCISE_CONFIRM2_UP'
      };
    }
    return {
      decision: EXERCISE_DECISION.HOLD,
      nextTarget: { levelId: state.currentLevelId || null, targetReps: config.repMax, targetSets: config.sets },
      reasonText: 'Succesvolle sessie op een niveau dat een grote stap vereist (bevestiging). Nog één succesvolle sessie nodig voordat de stap wordt doorgevoerd.',
      ruleId: 'EXERCISE_CONFIRM2_FIRST_SUCCESS'
    };
  }

  // --- Regressie: DOWN ---
  if (teZwaarOfInvalidCount >= 2) {
    const failureStreak = (typeof state.failureStreak === 'number' ? state.failureStreak : 0) + 1;
    if (failureStreak >= 2) {
      return {
        decision: EXERCISE_DECISION.DOWN,
        nextTarget: { levelId: state.currentLevelId || null, targetReps: config.repMin, targetSets: config.sets, voorstel: true },
        reasonText: 'Twee opeenvolgende sessies met minimaal twee mislukte sets. Een stap terug wordt voorgesteld (vereist bevestiging).',
        ruleId: 'EXERCISE_DOWN_PROPOSAL'
      };
    }
    return {
      decision: EXERCISE_DECISION.HOLD,
      nextTarget: { levelId: state.currentLevelId || null, targetReps: config.repMin, targetSets: config.sets },
      reasonText: 'Minimaal twee mislukte sets in deze sessie. Niveau blijft gelijk; bij herhaling volgende keer wordt een stap terug voorgesteld.',
      ruleId: 'EXERCISE_FIRST_FAILURE_HOLD'
    };
  }

  // --- RIR 0: geen progressie ---
  if (heeftRir0) {
    return {
      decision: EXERCISE_DECISION.HOLD,
      nextTarget: { levelId: state.currentLevelId || null, targetReps: bepaalGemengdDoel(sets, config), targetSets: config.sets },
      reasonText: 'RIR 0 geregistreerd in deze sessie. Geen progressie toegekend.',
      ruleId: 'EXERCISE_RIR0_HOLD'
    };
  }

  // --- Gemengde prestatie: HOLD met aangepast doel ---
  return {
    decision: EXERCISE_DECISION.HOLD,
    nextTarget: { levelId: state.currentLevelId || null, targetReps: bepaalGemengdDoel(sets, config), targetSets: config.sets },
    reasonText: 'Onvoldoende bewijs voor progressie. Niveau blijft gelijk, doel voor volgende training bijgesteld op basis van de gemengde prestatie.',
    ruleId: 'EXERCISE_MIXED_HOLD'
  };
}

/**
 * Bij een gemengde prestatie (bv. 8-8-6) wordt het volgende doel per set +1 t.o.v.
 * de laagst behaalde set, zonder boven repMax uit te komen. Voorbeeld uit de
 * opdracht: 8-8-6 wordt 8-8-7.
 */
function bepaalGemengdDoel(sets, config) {
  const repsPerSet = sets.map(s => (typeof s.reps === 'number' ? s.reps : config.repMin));
  const laagste = Math.min(...repsPerSet);
  return Math.min(laagste + 1, config.repMax);
}

/**
 * Beoordeelt de testpoging op het volgende ladderniveau (opdracht §9 regel 5):
 * minimaal testSec met goede vorm = UP, anders HOLD. Een mislukte test zet de
 * holdMax-teller terug; er komen dan opnieuw twee sessies op holdMax voordat er weer een test wordt gepland.
 */
function evaluateHoldTest(config, state, testSet) {
  const testSec = testSecVoor(config, state);
  const behaald = typeof testSet.holdSec === 'number' ? testSet.holdSec : null;
  const geslaagd = testSec !== null && behaald !== null && behaald >= testSec && testSet.form === 'goed';
  if (geslaagd) {
    return {
      decision: EXERCISE_DECISION.UP,
      nextTarget: { levelId: volgendLevelId(config, state), targetReps: null, targetSets: config.sets },
      reasonText: `Testpoging geslaagd (${behaald} sec ≥ ${testSec} sec vereist, goede vorm). Progressie naar het volgende niveau.`,
      ruleId: 'EXERCISE_HOLD_TEST_PASSED'
    };
  }
  const reden = testSec === null ? 'er is geen testSec geconfigureerd'
    : testSet.form !== 'goed' ? `de vorm was niet goed (${testSet.form || 'onbekend'})`
    : `${behaald ?? 0} sec is minder dan de ${testSec} sec die vereist is`;
  return {
    decision: EXERCISE_DECISION.HOLD,
    nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: config.sets },
    reasonText: `Testpoging niet geslaagd: ${reden}. Niveau blijft gelijk.`,
    ruleId: 'EXERCISE_HOLD_TEST_FAILED'
  };
}

function evaluateExerciseHold(config, state, sets, context) {
  const alleGoedeVorm = sets.every(s => s.form === 'goed');
  const alleHalenTarget = sets.every(s => s.setClass === SET_CLASS.TOP || s.setClass === SET_CLASS.OP_DOEL);
  const teZwaarOfInvalidCount = sets.filter(s => s.setClass === SET_CLASS.TE_ZWAAR || s.setClass === SET_CLASS.VERMOEID || s.setClass === SET_CLASS.INVALID).length;
  const vermoeidheidsstop = sets.some(s => s.setClass === SET_CLASS.VERMOEID && s.stopped === true);

  if (alleHalenTarget && alleGoedeVorm) {
    const huidigTarget = state.currentTarget && typeof state.currentTarget.holdSec === 'number' ? state.currentTarget.holdSec : config.holdStart;
    const nieuwDoel = Math.min(huidigTarget + 5, config.holdMax);
    const holdMaxTweeSessiesAchtereen = huidigTarget >= config.holdMax && state.holdMaxStreak >= 1;

    if (holdMaxTweeSessiesAchtereen) {
      const testSec = testSecVoor(config, state);
      if (testSec === null) {
        return {
          decision: EXERCISE_DECISION.HOLD,
          nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: config.sets },
          reasonText: 'HoldMax is twee sessies op rij behaald, maar er is geen testSec/volgend ladderniveau geconfigureerd. Niveau blijft gelijk.',
          ruleId: 'EXERCISE_HOLD_MAX_NO_TEST_CONFIG'
        };
      }
      if (volgendLevelId(config, state) === (state.currentLevelId === undefined ? null : state.currentLevelId)) {
        return {
          decision: EXERCISE_DECISION.HOLD,
          nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: config.sets },
          reasonText: 'HoldMax is twee sessies op rij behaald, maar er is geen volgend ladderniveau om op te testen. Niveau blijft gelijk.',
          ruleId: 'EXERCISE_HOLD_MAX_NO_NEXT_LEVEL'
        };
      }
      return {
        decision: EXERCISE_DECISION.TEST,
        nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: 1, testSec },
        reasonText: `HoldMax (${config.holdMax} sec) is twee opeenvolgende sessies behaald. Eén testpoging op het volgende niveau wordt gepland (vereist: minimaal ${testSec} sec, goede vorm).`,
        ruleId: 'EXERCISE_HOLD_MAX_TWICE_TEST'
      };
    }

    return {
      decision: EXERCISE_DECISION.HOLD,
      nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: config.sets, targetHold: nieuwDoel },
      reasonText: `Alle sets behaalden het doel met goede vorm. Doel verhoogd naar ${nieuwDoel} sec (max ${config.holdMax} sec).`,
      ruleId: 'EXERCISE_HOLD_INCREASE_5S'
    };
  }

  if (vermoeidheidsstop || teZwaarOfInvalidCount >= 2) {
    const failureStreak = (typeof state.failureStreak === 'number' ? state.failureStreak : 0) + 1;
    if (failureStreak >= 2) {
      return {
        decision: EXERCISE_DECISION.DOWN,
        nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: config.sets, voorstel: true },
        reasonText: 'Tweede opeenvolgende sessie met vermoeidheidsstop of meerdere te zware/ongeldige sets. Een stap terug wordt voorgesteld (vereist bevestiging).',
        ruleId: 'EXERCISE_HOLD_DOWN_PROPOSAL'
      };
    }
    return {
      decision: EXERCISE_DECISION.HOLD,
      nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: config.sets },
      reasonText: 'Vermoeidheidsstop of meerdere te zware/ongeldige sets. Niveau blijft gelijk; bij herhaling wordt een stap terug voorgesteld.',
      ruleId: 'EXERCISE_HOLD_FIRST_FAILURE_HOLD'
    };
  }

  return {
    decision: EXERCISE_DECISION.HOLD,
    nextTarget: { levelId: state.currentLevelId || null, targetReps: null, targetSets: config.sets },
    reasonText: 'Onvoldoende bewijs voor progressie. Niveau blijft gelijk.',
    ruleId: 'EXERCISE_HOLD_MIXED_HOLD'
  };
}

function volgendLevelId(config, state) {
  const ladder = Array.isArray(config.ladder) ? config.ladder : [];
  if (ladder.length === 0) return state.currentLevelId || null;
  const huidigeIndex = ladder.findIndex(l => l.id === state.currentLevelId);
  if (huidigeIndex === -1) return ladder[0].id;
  if (huidigeIndex + 1 >= ladder.length) return ladder[huidigeIndex].id; // al op het hoogste niveau
  return ladder[huidigeIndex + 1].id;
}

/**
 * Welke testtijd geldt voor de stap omhoog vanaf het huidige niveau? Een ladderniveau mag een eigen
 * `testSec` hebben (de eis om dát niveau binnen te komen, bv. 5 sec voor een straddle-aanzet);
 * zonder eigen waarde geldt `config.testSec`. Null = geen test geconfigureerd, dus geen testpoging.
 */
function testSecVoor(config, state) {
  const ladder = Array.isArray(config.ladder) ? config.ladder : [];
  const huidig = state && state.currentLevelId !== undefined ? state.currentLevelId : null;
  const volgendId = volgendLevelId(config, state || {});
  const volgend = volgendId !== huidig ? ladder.find(l => l.id === volgendId) : null; // op het plafond is er geen "volgend" niveau
  if (volgend && typeof volgend.testSec === 'number') return volgend.testSec;
  return typeof config.testSec === 'number' ? config.testSec : null;
}

function verlaagNiveau(config, state) {
  const ladder = Array.isArray(config.ladder) ? config.ladder : [];
  if (ladder.length === 0) return state.currentLevelId || null;
  const huidigeIndex = ladder.findIndex(l => l.id === state.currentLevelId);
  if (huidigeIndex <= 0) return ladder[0] ? ladder[0].id : (state.currentLevelId || null);
  return ladder[huidigeIndex - 1].id;
}

// ------------------------------------------------------------
// FASE 3 — State-overgang na een oefening.
//
// evaluateExercise() BESLIST alleen. Deze functie bepaalt wat er daarna met de
// persistente oefeningstatus (opdracht §12.1) gebeurt: streaks bijhouden,
// pijnblokkade bijhouden, en — alleen waar de opdracht dat toestaat — het
// niveau wijzigen.
//
// Regels (opdracht §18):
//   - Punt 11: grote stappen (CONFIRM2-progressie, DOWN-voorstellen) worden
//     NOOIT zonder bevestiging doorgevoerd. Zonder keuze komt er een `voorstel`
//     terug en blijft het niveau gelijk.
//   - Punt 5: dit draait pas NA de oefening, nooit middenin een training.
//   - Punt 7: de functie is zuiver en leest altijd de state van VÓÓR de sessie
//     (`startState`). Opnieuw aanroepen met dezelfde invoer geeft hetzelfde
//     resultaat (idempotent), ook als de gebruiker later nog een keuze maakt.
//
// Eigenschap die hierop leunt: streaks worden berekend uit startState, nooit
// uit een eerder resultaat van deze functie.
// ------------------------------------------------------------

/**
 * Classificeert elke ruleId van evaluateExercise() naar het effect op de
 * oefeningstatus. Staat bewust in een tabel i.p.v. verspreid in if-statements,
 * zodat een nieuwe ruleId in de engine niet stilletjes buiten beeld blijft:
 * een test controleert dat elke ruleId in dit bestand hier voorkomt.
 *
 * Effecten:
 *   UP_AUTO          kleine stap (gate "single"): wordt na de oefening doorgevoerd
 *   UP_CONFIRM       grote stap: alleen met bevestiging
 *   DOWN_CONFIRM     regressie: alleen met bevestiging
 *   SUCCESS_PENDING  succesvolle sessie, stap nog niet verdiend (telt mee voor CONFIRM2)
 *   SUCCESS_CEILING  succes, maar er is geen hoger niveau
 *   FAILURE          eerste mislukte sessie (telt mee voor DOWN-voorstel)
 *   STAGNATION       geen bewijs voor progressie (gemengd, RIR 0)
 *   HOLD_PROGRESS    hold-doel is verhoogd
 *   TEST             testpoging gepland; de testset volgt de volgende training (state.awaitingTest)
 *   TEST_FAILED      testpoging mislukt: de testmarkering vervalt, holdMax moet opnieuw worden gehaald
 *   PAIN             pijnblokkade
 *   NEUTRAL          streaks blijven ongemoeid (lange pauze, deload, geen geldige sets)
 */
const RULE_EFFECT = Object.freeze({
  EXERCISE_PAIN_BLOCKED: 'PAIN',
  EXERCISE_PAIN_NEW_BLOCK: 'PAIN',
  EXERCISE_DELOAD_HOLD: 'NEUTRAL',
  EXERCISE_LONG_BREAK_HOLD: 'NEUTRAL',
  EXERCISE_NO_VALID_SETS: 'NEUTRAL',
  EXERCISE_LADDER_CEILING: 'SUCCESS_CEILING',
  EXERCISE_ALL_TOP_SINGLE_UP: 'UP_AUTO',
  EXERCISE_CONFIRM2_UP: 'UP_CONFIRM',
  EXERCISE_CONFIRM2_FIRST_SUCCESS: 'SUCCESS_PENDING',
  EXERCISE_DOWN_PROPOSAL: 'DOWN_CONFIRM',
  EXERCISE_FIRST_FAILURE_HOLD: 'FAILURE',
  EXERCISE_RIR0_HOLD: 'STAGNATION',
  EXERCISE_MIXED_HOLD: 'STAGNATION',
  // Hold-pad. "TEST_PASSED" vraagt altijd bevestiging: een variantwissel is een grote stap (opdracht §18.11).
  EXERCISE_HOLD_TEST_PASSED: 'UP_CONFIRM',
  EXERCISE_HOLD_TEST_FAILED: 'TEST_FAILED',
  EXERCISE_HOLD_MAX_NO_NEXT_LEVEL: 'SUCCESS_CEILING',
  EXERCISE_HOLD_MAX_NO_TEST_CONFIG: 'NEUTRAL',
  EXERCISE_HOLD_MAX_TWICE_TEST: 'TEST',
  EXERCISE_HOLD_INCREASE_5S: 'HOLD_PROGRESS',
  EXERCISE_HOLD_DOWN_PROPOSAL: 'DOWN_CONFIRM',
  EXERCISE_HOLD_FIRST_FAILURE_HOLD: 'FAILURE',
  EXERCISE_HOLD_MIXED_HOLD: 'STAGNATION'
});

const OVERRULE_KEUZES = Object.freeze(['HOLD', 'UP', 'DOWN']);

/**
 * Eén niveau lager. Anders dan verlaagNiveau() (dat voor de pijn-weergave in
 * evaluateExercise blijft bestaan) gaat dit vanaf het EERSTE ladderniveau terug
 * naar het startniveau (null = "vóór de ladder"), en vanaf een onbekend of leeg
 * niveau nergens heen. verlaagNiveau() zou vanaf null juist naar ladder[0]
 * (omhoog!) springen.
 */
function lagerNiveau(config, levelId) {
  const ladder = Array.isArray(config.ladder) ? config.ladder : [];
  if (ladder.length === 0) return levelId === undefined ? null : levelId;
  const i = ladder.findIndex(l => l.id === levelId);
  if (i === -1) return levelId === undefined ? null : levelId;
  if (i === 0) return null;
  return ladder[i - 1].id;
}

function startDoel(config) {
  return {
    sets: config.sets ?? null,
    reps: config.type === 'reps' ? (config.repMin ?? null) : null,
    holdSec: null
  };
}

const RECENT_MAX = 6;

function normaliseerState(raw) {
  const s = raw && typeof raw === 'object' ? raw : {};
  const getal = v => (typeof v === 'number' && Number.isFinite(v) ? v : 0);
  return {
    currentLevelId: s.currentLevelId === undefined ? null : s.currentLevelId,
    currentTarget: s.currentTarget && typeof s.currentTarget === 'object'
      ? { sets: s.currentTarget.sets ?? null, reps: s.currentTarget.reps ?? null, holdSec: s.currentTarget.holdSec ?? null }
      : null,
    successStreak: getal(s.successStreak),
    failureStreak: getal(s.failureStreak),
    stagnationStreak: getal(s.stagnationStreak),
    painBlocked: s.painBlocked === true,
    painFreeStreak: getal(s.painFreeStreak),
    holdMaxStreak: getal(s.holdMaxStreak),
    lastPerformedAt: typeof s.lastPerformedAt === 'number' ? s.lastPerformedAt : null,
    awaitingTest: s.awaitingTest === true,
    // Laatste trainingen op dit niveau (voor stagnatiedetectie): [{levelId, totaal}], oud → nieuw.
    recent: Array.isArray(s.recent)
      ? s.recent.filter(r => r && typeof r.totaal === 'number' && Number.isFinite(r.totaal))
        .map(r => ({ levelId: r.levelId === undefined ? null : r.levelId, totaal: r.totaal })).slice(-RECENT_MAX)
      : []
  };
}

/**
 * Welke overrule-keuzes zijn zinvol vanaf deze startState? Voor de UI: een
 * knop "Omhoog" op een oefening zonder (hoger) ladderniveau doet niets en moet
 * dus niet worden aangeboden.
 * @returns {{HOLD:{naar:*,mogelijk:boolean}, UP:{...}, DOWN:{...}}}
 */
function beschikbareOverrules(config, startState, opties) {
  const basis = normaliseerState(startState);
  const pijnGeblokkeerd = !!(opties && opties.pijnGeblokkeerd);
  const omhoog = volgendLevelId(config, basis);
  const omlaag = lagerNiveau(config, basis.currentLevelId);
  return {
    HOLD: { naar: basis.currentLevelId, mogelijk: true },
    UP: { naar: omhoog, mogelijk: !pijnGeblokkeerd && omhoog !== basis.currentLevelId },
    DOWN: { naar: omlaag, mogelijk: omlaag !== basis.currentLevelId }
  };
}

/**
 * @param {Object} config - program.json-config van déze oefening
 * @param {Object} startState - exercise-state VAN VÓÓR deze sessie (of null)
 * @param {Object} exerciseResult - uitkomst van evaluateExercise()
 * @param {Object} [opties]
 * @param {null|'ACCEPT'|'HOLD'|'UP'|'DOWN'} [opties.keuze]
 *        null   = nog geen keuze: alleen kleine stappen worden doorgevoerd
 *        ACCEPT = gebruiker bevestigt het voorstel van de engine
 *        HOLD/UP/DOWN = overrule: niveau t.o.v. startState behouden / een stap omhoog / een stap omlaag
 * @param {boolean} [opties.pijnInSessie] - was er een BLOCKED-set in deze sessie?
 * @param {number} [opties.nu] - tijdstip (ms) voor lastPerformedAt
 * @returns {{state:Object, levelChange:Object|null, voorstel:Object|null, effect:string}
 *          | {valid:false, errorCode:string, errorMessage:string}}
 */
function bepaalStateNaOefening(config, startState, exerciseResult, opties) {
  if (!config || typeof config !== 'object') {
    return invalid('MISSING_CONFIG', 'Oefeningsconfiguratie ontbreekt.');
  }
  if (!exerciseResult || typeof exerciseResult !== 'object' || !exerciseResult.decision) {
    return invalid('MISSING_EXERCISE_RESULT', 'Een geldig evaluateExercise()-resultaat is verplicht.');
  }
  opties = opties || {};
  const keuze = opties.keuze === undefined ? null : opties.keuze;
  if (keuze !== null && keuze !== 'ACCEPT' && !OVERRULE_KEUZES.includes(keuze)) {
    return invalid('INVALID_CHOICE', `Onbekende keuze "${keuze}" — verwacht null, ACCEPT, HOLD, UP of DOWN.`);
  }
  const pijnInSessie = opties.pijnInSessie === true;

  const basis = normaliseerState(startState);
  config = configVoorNiveau(config, basis.currentLevelId);
  const nt = exerciseResult.nextTarget || {};
  const effect = RULE_EFFECT[exerciseResult.ruleId] || 'UNKNOWN';

  const nieuw = Object.assign({}, basis);
  if (typeof opties.nu === 'number') nieuw.lastPerformedAt = opties.nu;
  let bron = null;
  let bronRuleId = exerciseResult.ruleId || null;
  let voorstel = null;

  const resetStreaks = () => {
    nieuw.successStreak = 0; nieuw.failureStreak = 0; nieuw.stagnationStreak = 0; nieuw.holdMaxStreak = 0;
  };
  const wijzigNiveau = (naar, b) => {
    resetStreaks();
    nieuw.awaitingTest = false; // een geslaagde test of een ander niveau sluit de testpoging af
    if (naar !== basis.currentLevelId) {
      nieuw.currentLevelId = naar;
      nieuw.currentTarget = startDoel(config);
      nieuw.recent = []; // totalen van een ander niveau zijn niet vergelijkbaar
      bron = b;
    }
  };

  switch (effect) {
    case 'UP_AUTO':
      wijzigNiveau(nt.levelId === undefined ? basis.currentLevelId : nt.levelId, 'auto');
      break;

    case 'UP_CONFIRM':
      if (keuze === 'ACCEPT') {
        wijzigNiveau(nt.levelId === undefined ? basis.currentLevelId : nt.levelId, 'bevestigd');
      } else {
        // Zonder bevestiging blijft het niveau gelijk. De streak blijft staan, zodat
        // een volgende succesvolle sessie het voorstel opnieuw doet.
        nieuw.successStreak = basis.successStreak + 1;
        nieuw.failureStreak = 0; nieuw.stagnationStreak = 0;
        voorstel = { type: 'UP', naar: nt.levelId === undefined ? basis.currentLevelId : nt.levelId };
      }
      break;

    case 'DOWN_CONFIRM': {
      const lager = lagerNiveau(config, basis.currentLevelId);
      if (keuze === 'ACCEPT') {
        wijzigNiveau(lager, 'bevestigd');
      } else {
        nieuw.failureStreak = basis.failureStreak + 1;
        nieuw.successStreak = 0; nieuw.holdMaxStreak = 0;
        voorstel = { type: 'DOWN', naar: lager, geenLagerNiveau: lager === basis.currentLevelId };
      }
      break;
    }

    case 'SUCCESS_PENDING':
      nieuw.successStreak = basis.successStreak + 1;
      nieuw.failureStreak = 0; nieuw.stagnationStreak = 0; nieuw.holdMaxStreak = 0;
      break;

    case 'SUCCESS_CEILING':
      nieuw.successStreak = basis.successStreak + 1;
      nieuw.failureStreak = 0; nieuw.stagnationStreak = 0;
      break;

    case 'FAILURE':
      nieuw.failureStreak = basis.failureStreak + 1;
      nieuw.stagnationStreak = basis.stagnationStreak + 1;
      nieuw.successStreak = 0; nieuw.holdMaxStreak = 0;
      break;

    case 'STAGNATION':
      nieuw.stagnationStreak = basis.stagnationStreak + 1;
      nieuw.successStreak = 0; nieuw.failureStreak = 0; nieuw.holdMaxStreak = 0;
      break;

    case 'HOLD_PROGRESS': {
      const huidigHold = basis.currentTarget && typeof basis.currentTarget.holdSec === 'number'
        ? basis.currentTarget.holdSec : config.holdStart;
      // Twee sessies op rij op holdMax is de voorwaarde voor een testpoging (engine, regel 5).
      nieuw.holdMaxStreak = (typeof config.holdMax === 'number' && huidigHold >= config.holdMax) ? basis.holdMaxStreak + 1 : 0;
      nieuw.currentTarget = {
        sets: nt.targetSets ?? config.sets ?? null,
        reps: null,
        holdSec: typeof nt.targetHold === 'number' ? nt.targetHold : huidigHold
      };
      nieuw.failureStreak = 0; nieuw.stagnationStreak = 0;
      break;
    }

    case 'TEST':
      nieuw.failureStreak = 0; nieuw.stagnationStreak = 0;
      nieuw.awaitingTest = true; // de volgende training biedt de testset aan
      break;

    case 'TEST_FAILED':
      nieuw.awaitingTest = false;
      nieuw.holdMaxStreak = 0;
      nieuw.successStreak = 0;
      break;

    case 'PAIN':
      nieuw.successStreak = 0; nieuw.holdMaxStreak = 0;
      nieuw.awaitingTest = false;
      if (pijnInSessie) {
        nieuw.painBlocked = true;
        nieuw.painFreeStreak = 0;
      } else if (basis.painBlocked) {
        nieuw.painFreeStreak = basis.painFreeStreak + 1;
        if (nieuw.painFreeStreak >= 2) {
          // Twee pijnvrije sessies achter elkaar: blokkade opheffen en één niveau lager hervatten (engine-tekst).
          nieuw.painBlocked = false;
          nieuw.painFreeStreak = 0;
          wijzigNiveau(lagerNiveau(config, basis.currentLevelId), 'pijn_hervat');
        }
      }
      break;

    case 'NEUTRAL':
      break;

    default: // UNKNOWN: een ruleId die deze tabel niet kent — liever geen streak meetellen dan een verkeerde.
      nieuw.successStreak = 0; nieuw.failureStreak = 0;
  }

  // Overrule: de gebruiker bepaalt het niveau t.o.v. het niveau van vóór deze sessie.
  if (OVERRULE_KEUZES.includes(keuze)) {
    const pijnGeblokkeerd = nieuw.painBlocked === true;
    let doel = basis.currentLevelId;
    if (keuze === 'UP' && !pijnGeblokkeerd) doel = volgendLevelId(config, basis);
    if (keuze === 'DOWN') doel = lagerNiveau(config, basis.currentLevelId);
    nieuw.currentLevelId = basis.currentLevelId;
    nieuw.currentTarget = basis.currentTarget;
    bron = null;
    resetStreaks();
    nieuw.awaitingTest = false;
    nieuw.recent = basis.recent;
    if (doel !== basis.currentLevelId) {
      nieuw.currentLevelId = doel;
      nieuw.currentTarget = startDoel(config);
      nieuw.recent = [];
      bron = 'overrule';
    }
    bronRuleId = `USER_OVERRULE_${keuze}`;
    voorstel = null;
  }

  nieuw.status = nieuw.painBlocked ? 'blocked' : 'active';

  // Stagnatie (opdracht §9 regel 6): totaal van deze training erbij, op het niveau waar de training
  // op is uitgevoerd. Pijn-, pauze- en deloadsessies zeggen niets over stagnatie en tellen niet mee.
  const totaal = typeof opties.totaal === 'number' && Number.isFinite(opties.totaal) && opties.totaal > 0 ? opties.totaal : null;
  if (totaal !== null && effect !== 'NEUTRAL' && effect !== 'PAIN' && effect !== 'UNKNOWN' && !OVERRULE_KEUZES.includes(keuze)) {
    const eenLevel = bron === null ? nieuw.recent : []; // bij een niveauwijziging begint de reeks opnieuw
    const metDeze = eenLevel.concat([{ levelId: basis.currentLevelId, totaal }]);
    if (bron === null) nieuw.recent = metDeze.slice(-RECENT_MAX);
  }
  const stagnatie = bepaalStagnatie(config, basis.currentLevelId === nieuw.currentLevelId ? nieuw : Object.assign({}, nieuw, { recent: [] }), { drempel: opties.stagnatieDrempel });

  return {
    state: nieuw,
    levelChange: bron ? { van: basis.currentLevelId, naar: nieuw.currentLevelId, bron, ruleId: bronRuleId } : null,
    voorstel,
    effect,
    stagnatie
  };
}

const STAGNATIE_CHECKLIST = Object.freeze(['Slaap', 'Voeding', 'Trainingsvolume', 'Eerlijke RIR-inschatting', 'Herstel tussen trainingen']);
const STAGNATIE_VOLGORDE = Object.freeze(['tempo', 'pauze', 'microload', 'variant', 'alternatief']);

/**
 * Stagnatie: de laatste `drempel` trainingen op hetzelfde niveau hadden exact hetzelfde
 * totaal (reps of holdseconden). Geeft een signaal terug met checklist en voorstellen uit de
 * configuratie (config.progressieOpties en config.alternatives). Verandert nooit het niveau:
 * stagnatie leidt nooit automatisch tot regressie (opdracht §9 regel 6).
 * @returns {null | {ruleId:string, sessies:number, totaal:number, eenheid:string, reasonText:string, checklist:string[], voorstellen:{type:string,tekst:string}[]}}
 */
function bepaalStagnatie(config, state, opties) {
  const drempel = opties && typeof opties.drempel === 'number' && opties.drempel >= 2 ? opties.drempel : 3;
  const s = normaliseerState(state);
  const laatste = s.recent.slice(-drempel);
  if (laatste.length < drempel) return null;
  const gelijkNiveau = laatste.every(r => r.levelId === laatste[0].levelId);
  const gelijkTotaal = laatste.every(r => r.totaal === laatste[0].totaal);
  if (!gelijkNiveau || !gelijkTotaal) return null;
  const eenheid = config && config.type === 'hold' ? 'sec' : 'reps';
  const opties2 = Array.isArray(config && config.progressieOpties) ? config.progressieOpties : [];
  const alternatieven = (Array.isArray(config && config.alternatives) ? config.alternatives : [])
    .map(a => ({ type: 'alternatief', tekst: typeof a === 'string' ? a : (a && a.name) || '' })).filter(a => a.tekst);
  const voorstellen = opties2.filter(o => o && o.tekst).map(o => ({ type: o.type || 'variant', tekst: o.tekst })).concat(alternatieven)
    .sort((a, b) => STAGNATIE_VOLGORDE.indexOf(a.type) - STAGNATIE_VOLGORDE.indexOf(b.type));
  return {
    ruleId: 'STAGNATION_FLAG',
    sessies: drempel,
    totaal: laatste[0].totaal,
    eenheid,
    reasonText: `Stagnatie: ${drempel} opeenvolgende trainingen op hetzelfde niveau met hetzelfde totaal (${laatste[0].totaal} ${eenheid}). Dit is een signaal, geen regressie.`,
    checklist: STAGNATIE_CHECKLIST.slice(),
    voorstellen
  };
}

// ------------------------------------------------------------
// Decision-logging helper — bouwt het datastructuur-object voor de Firestore
// "decisions"-collectie (opdracht §12.2). Puur: schrijft zelf niets weg, de
// aanroeper (Firestore-laag, Fase 2) is verantwoordelijk voor het opslaan.
// ------------------------------------------------------------
function buildDecisionRecord({ exerciseId, sessionId, setId, decisionType, inputSnapshot, result, accepted }) {
  return {
    exerciseId: exerciseId ?? null,
    sessionId: sessionId ?? null,
    setId: setId ?? null,
    decisionType: decisionType ?? null, // "SET" of "EXERCISE"
    inputSnapshot: inputSnapshot ?? {},
    result: result ?? {},
    ruleId: result && result.ruleId ? result.ruleId : null,
    reasonText: result && result.reasonText ? result.reasonText : null,
    accepted: accepted === undefined ? null : accepted,
    timestamp: null, // door de Firestore-laag in te vullen met serverTimestamp()
    supersedes: null // door de Firestore-laag in te vullen bij een correctie van een eerdere beslissing
  };
}

const ENGINE_EXPORTS = {
  SET_CLASS,
  SET_ACTION,
  EXERCISE_DECISION,
  evaluateSet,
  evaluateExercise,
  buildDecisionRecord,
  // Fase 3
  RULE_EFFECT,
  OVERRULE_KEUZES,
  bepaalStateNaOefening,
  beschikbareOverrules,
  lagerNiveau,
  // Fase 4
  bepaalStagnatie,
  STAGNATIE_CHECKLIST,
  testSecVoor,
  // 2026-11-09
  configVoorNiveau
};

// Werkt zowel in Node (CommonJS, voor engine.test.js) als als kale <script> in
// de browser (waar "module" niet bestaat) — geen build-stap nodig in beide
// gevallen, conform opdracht §4.1/§16. Dit verandert niets aan de pure,
// Firebase-/DOM-vrije functies hierboven, alleen hoe ze naar buiten worden gegeven.
if (typeof module !== 'undefined' && module.exports) {
  module.exports = ENGINE_EXPORTS;
}
if (typeof window !== 'undefined') {
  window.ProgressieEngine = ENGINE_EXPORTS;
}

})();
</script>
<script>
// [INGEBAKKEN:historie.js]
// Pure weergave-logica voor niveaugeschiedenis en trainingsdetail (Fase 3).
// NIET HANDMATIG AANPASSEN: wordt gegenereerd door bouw-html.py uit historie.js.
(function () {
// ============================================================
// HISTORIE.JS — pure functies die uit opgeslagen gegevens de weergave bouwen
// voor de voortgangspagina (opdracht §14.5, Fase 3).
//
// Net als engine.js: geen Firebase, geen DOM, geen oefeningsnamen hardcoded,
// dezelfde invoer geeft altijd dezelfde uitvoer. De aanroeper (de UI) haalt de
// documenten op en zet Firestore-Timestamps om naar milliseconden; hier komen
// alleen gewone objecten binnen.
//
// Historische consistentie (opdracht §16): de weergave leest uitsluitend wat er
// destijds is vastgelegd (o.a. het veld `effect` in elke oefeningsbeslissing).
// Een latere wijziging van program.json of engine.js kan oude beslissingen dus
// niet achteraf anders laten uitzien.
// ============================================================

'use strict';

const START_LABEL = 'Startniveau';
const TOEKOMST = Number.MAX_SAFE_INTEGER;

// Effecten (zie RULE_EFFECT in engine.js) die een stagnatiereeks onderbreken ...
const VOORUITGANG = new Set(['UP_AUTO', 'UP_CONFIRM', 'SUCCESS_PENDING', 'SUCCESS_CEILING', 'HOLD_PROGRESS', 'TEST']);
// ... en die ertoe bijdragen. Alles daarbuiten (pijn, pauze, deload) is neutraal.
const GEEN_VOORUITGANG = new Set(['STAGNATION', 'FAILURE', 'DOWN_CONFIRM']);

const tijd = d => (typeof d.timestamp === 'number' ? d.timestamp : TOEKOMST);
const opTijd = (a, b) => (tijd(a) - tijd(b)) || String(a.id || '').localeCompare(String(b.id || ''));

function ladderIndex(config, levelId) {
  const ladder = config && Array.isArray(config.ladder) ? config.ladder : [];
  if (levelId === null || levelId === undefined) return -1;
  return ladder.findIndex(l => l.id === levelId);
}

function niveauLabel(config, levelId) {
  if (levelId === null || levelId === undefined) return (config && typeof config.startLabel === 'string' && config.startLabel) || START_LABEL;
  const ladder = config && Array.isArray(config.ladder) ? config.ladder : [];
  const l = ladder.find(x => x.id === levelId);
  return l ? (l.label || l.id) : String(levelId);
}

/**
 * Bouwt de niveaugeschiedenis van één oefening (opdracht §14.5).
 *
 * @param {Object} p
 * @param {Object} p.config - program.json-config van de oefening (voor ladder + labels)
 * @param {Object|null} p.state - huidige exerciseState
 * @param {Array<Object>} p.decisions - alle decisions van deze oefening (EXERCISE, OVERRULE, LEVEL_CHANGE);
 *        SET-decisions mogen meegegeven worden en worden genegeerd
 * @param {number} [p.stagnatieDrempel=3] - _meta.stagnatie.sessiesAchtereen
 * @returns {{huidig:Object, niveaus:Array, wijzigingen:Array, beslissingen:Array, stagnatieperiodes:Array}}
 */
function bouwNiveauGeschiedenis({ config, state, decisions, stagnatieDrempel }) {
  const drempel = typeof stagnatieDrempel === 'number' && stagnatieDrempel >= 2 ? stagnatieDrempel : 3;
  const alle = Array.isArray(decisions) ? decisions : [];

  const oefeningen = alle.filter(d => d.decisionType === 'EXERCISE').sort(opTijd);
  const actief = oefeningen.filter(d => !d.vervangenDoor);
  const overrules = alle.filter(d => d.decisionType === 'OVERRULE' && !d.vervangenDoor).sort(opTijd);
  const wijzigingenRuw = alle
    .filter(d => d.decisionType === 'LEVEL_CHANGE' && !d.vervangenDoor && d.van !== d.naar)
    .sort(opTijd);

  const wijzigingen = wijzigingenRuw.map(w => ({
    at: typeof w.timestamp === 'number' ? w.timestamp : null,
    sessionId: w.sessionId || null,
    van: w.van === undefined ? null : w.van,
    naar: w.naar === undefined ? null : w.naar,
    vanLabel: niveauLabel(config, w.van),
    naarLabel: niveauLabel(config, w.naar),
    richting: ladderIndex(config, w.naar) > ladderIndex(config, w.van) ? 'omhoog' : 'omlaag',
    bron: w.bron || null,
    ruleId: w.ruleId || null,
    reasonText: w.reasonText || null
  }));

  // --- Niveaus als aaneengesloten perioden --------------------------------
  const huidigId = state && state.currentLevelId !== undefined ? state.currentLevelId : null;
  const niveaus = [];
  if (wijzigingenRuw.length === 0) {
    niveaus.push({ levelId: huidigId, label: niveauLabel(config, huidigId), vanaf: null, tot: null });
  } else {
    niveaus.push({ levelId: wijzigingenRuw[0].van ?? null, label: niveauLabel(config, wijzigingenRuw[0].van), vanaf: null, tot: wijzigingen[0].at });
    wijzigingenRuw.forEach((w, i) => {
      niveaus.push({
        levelId: w.naar ?? null,
        label: niveauLabel(config, w.naar),
        vanaf: wijzigingen[i].at,
        tot: i + 1 < wijzigingen.length ? wijzigingen[i + 1].at : null
      });
    });
  }
  niveaus.forEach(n => {
    n.sessies = actief.filter(d => {
      const t = tijd(d);
      return (n.vanaf === null || t >= n.vanaf) && (n.tot === null || t < n.tot);
    }).length;
  });

  const laatste = niveaus[niveaus.length - 1];
  const huidig = { levelId: huidigId, label: niveauLabel(config, huidigId), vanaf: laatste.levelId === huidigId ? laatste.vanaf : null };

  // --- Beslissingen (nieuwste eerst), inclusief vervangen versies -----------
  const wijzigingPerSessie = new Map();
  wijzigingenRuw.forEach(w => { if (w.sessionId) wijzigingPerSessie.set(w.sessionId, w); });

  const beslissingen = oefeningen.map(d => {
    const overrule = overrules.find(o => o.sessionId === d.sessionId);
    const wijziging = wijzigingPerSessie.get(d.sessionId) || null;
    let status;
    // 'verworpen' = de training waar dit bij hoorde is zonder opslaan verlaten: telt nergens mee
    if (d.vervangenDoor === 'verworpen') status = 'verworpen';
    else if (d.vervangenDoor) status = 'vervangen';
    else if (overrule) status = 'overruled';
    else if (d.accepted === true) status = 'bevestigd';
    else if (wijziging && wijziging.bron === 'auto') status = 'automatisch';
    else if (d.effect === 'UP_CONFIRM' || d.effect === 'DOWN_CONFIRM') status = 'open';
    else status = 'geen_wijziging';
    return {
      at: typeof d.timestamp === 'number' ? d.timestamp : null,
      sessionId: d.sessionId || null,
      decision: (d.result && d.result.decision) || null,
      ruleId: d.ruleId || null,
      effect: d.effect || null,
      reasonText: d.reasonText || null,
      status,
      overruleKeuze: overrule ? overrule.keuze || null : null,
      niveauWijziging: wijziging ? { van: wijziging.van ?? null, naar: wijziging.naar ?? null, vanLabel: niveauLabel(config, wijziging.van), naarLabel: niveauLabel(config, wijziging.naar), bron: wijziging.bron || null } : null
    };
  }).reverse();

  // --- Stagnatieperiodes ----------------------------------------------------
  const stagnatieperiodes = [];
  let reeks = [];
  const sluit = lopend => {
    if (reeks.length >= drempel) {
      stagnatieperiodes.push({
        vanAt: typeof reeks[0].timestamp === 'number' ? reeks[0].timestamp : null,
        totAt: typeof reeks[reeks.length - 1].timestamp === 'number' ? reeks[reeks.length - 1].timestamp : null,
        sessies: reeks.length,
        lopend
      });
    }
    reeks = [];
  };
  actief.forEach(d => {
    if (VOORUITGANG.has(d.effect)) sluit(false);
    else if (GEEN_VOORUITGANG.has(d.effect)) reeks.push(d);
    // neutrale effecten (pijn, pauze, deload, onbekend) breken de reeks niet en tellen niet mee
  });
  sluit(true);

  return { huidig, niveaus, wijzigingen, beslissingen, stagnatieperiodes };
}

/**
 * Voegt de oude `logs`-documenten en de nieuwe `sets`-documenten samen tot één
 * lijst trainingen met per training de individuele sets (opdracht §14.5).
 *
 * - Een log en sets met hetzelfde sessionId zijn dezelfde training: de sets
 *   leveren dan het detail (setClass, RIR, vorm per set), de log de datum/dag.
 * - Logs zonder sessionId (alles van vóór Fase 3) blijven gewoon bestaan, met
 *   één RIR/vorm voor de hele oefening zoals die destijds is vastgelegd.
 * - Sets zonder log (bv. na een pijnstop, of als het wegschrijven naar logs
 *   mislukte) verschijnen ook, zodat er niets verloren gaat.
 * Er wordt bewust NIET op datum ontdubbeld: liever een dubbele regel dan een
 * training verbergen.
 *
 * @param {Object} p
 * @param {Array<Object>} p.logs - [{id, sessionId?, dagId, dagNaam, sets:[{set,reps,gewicht}], rir, vorm, notitie, aangemaaktOp:ms}]
 * @param {Array<Object>} p.setDocs - [{id, sessionId, setN, reps, holdSec, load, rir, form, pain, setClass, restSec, aangemaaktOp:ms}]
 * @param {'reps'|'sec'} p.eenheid
 * @param {string[]} [p.verworpenSessies] - sessies die zonder opslaan zijn verlaten; hun losse sets worden als 'niet opgeslagen' gemarkeerd
 * @returns {Array<Object>} nieuwste training eerst
 */
function groepeerTrainingen({ logs, setDocs, eenheid, verworpenSessies }) {
  const verworpen = new Set(Array.isArray(verworpenSessies) ? verworpenSessies : []);
  const isSec = eenheid === 'sec';
  const getal = v => {
    const n = typeof v === 'number' ? v : parseFloat(v);
    return Number.isFinite(n) ? n : null;
  };

  const perSessie = new Map();
  (Array.isArray(setDocs) ? setDocs : []).forEach(d => {
    if (!d || !d.sessionId) return;
    if (!perSessie.has(d.sessionId)) perSessie.set(d.sessionId, new Map());
    const n = d.setN ?? d.n;
    const bestaand = perSessie.get(d.sessionId).get(n);
    // dezelfde set twee keer (opnieuw opgeslagen): de laatste wint
    if (!bestaand || (d.aangemaaktOp || 0) >= (bestaand.aangemaaktOp || 0)) perSessie.get(d.sessionId).set(n, d);
  });

  const vanSetDocs = map => [...map.values()]
    .sort((a, b) => (a.setN ?? a.n) - (b.setN ?? b.n))
    .map(d => ({
      n: d.setN ?? d.n,
      waarde: getal(isSec ? d.holdSec : d.reps),
      load: getal(d.load),
      rir: getal(d.rir),
      vorm: d.form || null,
      pijn: d.pain === true,
      setClass: d.setClass || null,
      type: d.type || 'werk'
    }));

  const eerstetijd = map => Math.min(...[...map.values()].map(d => d.aangemaaktOp || TOEKOMST));
  const trainingen = [];
  const gebruikt = new Set();

  (Array.isArray(logs) ? logs : []).forEach(log => {
    const metDetail = log.sessionId && perSessie.has(log.sessionId);
    if (metDetail) gebruikt.add(log.sessionId);
    const sets = metDetail
      ? vanSetDocs(perSessie.get(log.sessionId))
      : (Array.isArray(log.sets) ? log.sets : []).map(s => ({
        n: getal(s.set),
        waarde: getal(s.reps),
        load: getal(s.gewicht),
        rir: getal(log.rir),
        vorm: log.vorm || null,
        pijn: false,
        setClass: null,
        type: 'werk'
      }));
    trainingen.push({
      sleutel: log.id || `log_${trainingen.length}`,
      sessionId: log.sessionId || null,
      at: typeof log.aangemaaktOp === 'number' ? log.aangemaaktOp : null,
      dagId: log.dagId || null,
      dagNaam: log.dagNaam || null,
      notitie: log.notitie || '',
      bron: metDetail ? 'beide' : 'logs',
      verworpen: false,
      sets
    });
  });

  perSessie.forEach((map, sessionId) => {
    if (gebruikt.has(sessionId)) return;
    const eerste = eerstetijd(map);
    trainingen.push({
      sleutel: `sets_${sessionId}`,
      sessionId,
      at: eerste === TOEKOMST ? null : eerste,
      dagId: null,
      dagNaam: null,
      notitie: '',
      bron: 'sets',
      verworpen: verworpen.has(sessionId),
      sets: vanSetDocs(map)
    });
  });

  trainingen.forEach(t => {
    const waarden = t.sets.map(s => s.waarde).filter(w => w !== null);
    t.totaal = waarden.reduce((a, b) => a + b, 0);
    t.beste = waarden.length ? Math.max(...waarden) : null;
  });

  return trainingen.sort((a, b) => (b.at === null ? TOEKOMST : b.at) - (a.at === null ? TOEKOMST : a.at));
}

const HISTORIE_EXPORTS = { bouwNiveauGeschiedenis, groepeerTrainingen, niveauLabel, START_LABEL };

if (typeof module !== 'undefined' && module.exports) {
  module.exports = HISTORIE_EXPORTS;
}
if (typeof window !== 'undefined') {
  window.ProgressieHistorie = HISTORIE_EXPORTS;
}

})();
</script>
<script>
// [INGEBAKKEN:analyse.js]
// Pure week-/maandanalyse en deloadlogica (Fase 5/6). Geen Firebase, geen DOM.
// NIET HANDMATIG AANPASSEN: wordt gegenereerd door bouw-html.py uit analyse.js.
(function () {
// ============================================================
// analyse.js — Fase 5 (weekanalyse + deload) en Fase 6 (maandrapport).
//
// Pure functies: geen Firebase, geen DOM, geen klok (de aanroeper geeft `nu` mee).
// Alle drempels staan in program.json (_meta.volume, _meta.volumeIndicatoren,
// _meta.deload, _meta.weekAnalyse). Er staat hier geen oefeningsnaam of getal
// dat een trainingsregel bepaalt.
// ============================================================
'use strict';

const DAG_MS = 86400000;

// ---------- hulpfuncties -------------------------------------------------------

function getal(v) {
  const n = typeof v === 'number' ? v : parseFloat(v);
  return Number.isFinite(n) ? n : null;
}

/** Maandag 00:00 (lokale tijd) van de week waarin `nu` valt, plus `offset` weken. */
function weekGrenzen(nu, offset) {
  const d = new Date(nu);
  d.setHours(0, 0, 0, 0);
  const dagVanWeek = (d.getDay() + 6) % 7; // maandag = 0
  d.setDate(d.getDate() - dagVanWeek + 7 * (offset || 0));
  const start = d.getTime();
  const e = new Date(start);
  e.setDate(e.getDate() + 7);
  return { start, eind: e.getTime() };
}

/** Eerste dag 00:00 van de kalendermaand waarin `nu` valt (+ offset maanden) en de eerste dag van de volgende. */
function maandGrenzen(nu, offset) {
  const d = new Date(nu);
  const start = new Date(d.getFullYear(), d.getMonth() + (offset || 0), 1).getTime();
  const eind = new Date(d.getFullYear(), d.getMonth() + (offset || 0) + 1, 1).getTime();
  return { start, eind };
}

function maakNaamIndex(config) {
  const perNaam = new Map();
  const perId = new Map();
  (config && Array.isArray(config.exercises) ? config.exercises : []).forEach(e => {
    perId.set(e.id, e);
    perNaam.set(String(e.name || '').trim().toLowerCase(), e);
  });
  return { perNaam, perId };
}

/**
 * Is deze set een effectieve werkset (opdracht §10)? Geeft { telt, reden } terug.
 * reden (alleen als telt=false): 'test' | 'invalid' | 'slechteVorm' | 'pijn' | 'rirOnbekend' | 'rirTeHoog'
 */
function beoordeelEffectieveSet(set, volumeCfg) {
  const maxRir = volumeCfg && typeof volumeCfg.maxRir === 'number' ? volumeCfg.maxRir : 3;
  if (set.type === 'test') return { telt: false, reden: 'test' };
  if (set.type === 'warmup') return { telt: false, reden: 'warmup' };
  if (set.setClass === 'INVALID') return { telt: false, reden: 'invalid' };
  if (set.vorm === 'slecht') return { telt: false, reden: 'slechteVorm' };
  if (set.pijn === true) return { telt: false, reden: 'pijn' };
  if (set.rir === null || set.rir === undefined) return { telt: false, reden: 'rirOnbekend' };
  if (set.rir > maxRir) return { telt: false, reden: 'rirTeHoog' };
  return { telt: true, reden: null };
}

/**
 * Brengt set-documenten en oudere logs samen tot één lijst van sets met een oefening, tijdstip en
 * sessie. Een log telt alleen mee als er voor dezelfde sessie en oefening geen set-documenten zijn
 * (anders zouden setmodus-sets dubbel tellen: elke set wordt ook in `logs` gespiegeld).
 * Legacy-logs kennen één RIR en één vorm per oefening en geen pijnvlag.
 */
function verzamelSets({ config, sets, logs, verworpenSessies }) {
  const idx = maakNaamIndex(config);
  const verworpen = new Set(Array.isArray(verworpenSessies) ? verworpenSessies : []);
  const uit = [];
  const metDetail = new Set();
  let onbekendeOefening = 0;

  const perSetKey = new Map();
  (Array.isArray(sets) ? sets : []).forEach(d => {
    if (!d || !d.exerciseId) return;
    if (d.sessionId && verworpen.has(d.sessionId)) return;
    metDetail.add(`${d.sessionId}|${d.exerciseId}`);
    const key = `${d.sessionId}|${d.exerciseId}|${d.setN ?? d.n}`;
    const bestaand = perSetKey.get(key);
    if (!bestaand || (d.aangemaaktOp || 0) >= (bestaand.aangemaaktOp || 0)) perSetKey.set(key, d);
  });
  perSetKey.forEach(d => {
    const cfg = idx.perId.get(d.exerciseId);
    if (!cfg) { onbekendeOefening++; return; }
    uit.push({
      bron: 'sets', exerciseId: d.exerciseId, sessionId: d.sessionId || null, at: d.aangemaaktOp ?? null, n: getal(d.setN ?? d.n),
      type: d.type || 'werk', setClass: d.setClass || null, vorm: d.form || null, pijn: d.pain === true,
      rir: getal(d.rir), reps: getal(d.reps), holdSec: getal(d.holdSec), load: getal(d.load)
    });
  });

  (Array.isArray(logs) ? logs : []).forEach(log => {
    if (!log) return;
    if (log.sessionId && verworpen.has(log.sessionId)) return;
    const cfg = idx.perNaam.get(String(log.oefeningNaam || '').trim().toLowerCase());
    if (!cfg) { if (log.oefeningType !== 'warmup' && log.oefeningType !== 'cooldown') onbekendeOefening++; return; }
    if (log.sessionId && metDetail.has(`${log.sessionId}|${cfg.id}`)) return;
    const isHold = cfg.type === 'hold';
    (Array.isArray(log.sets) ? log.sets : []).forEach(s => {
      uit.push({
        bron: 'logs', exerciseId: cfg.id, sessionId: log.sessionId || null, at: log.aangemaaktOp ?? null, n: getal(s.set), dagId: log.dagId || null,
        type: 'werk', setClass: null, vorm: log.vorm || null, pijn: false, rir: getal(log.rir),
        reps: isHold ? null : getal(s.reps), holdSec: isHold ? getal(s.reps) : null, load: getal(s.gewicht)
      });
    });
  });
  return { sets: uit, onbekendeOefening };
}

/** Status van een gewogen weekvolume volgens _meta.volumeIndicatoren. */
function volumeStatus(waarde, indicatoren) {
  const ind = indicatoren || {};
  const g = k => (ind[k] || {});
  if ((g('zeerHoog').min !== undefined && waarde >= g('zeerHoog').min) || (g('hoog').max !== undefined && waarde > g('hoog').max)) return 'zeerHoog';
  if (g('goed').max !== undefined && waarde > g('goed').max) return 'hoog';
  if (g('goed').min !== undefined && waarde >= g('goed').min) return 'goed';
  if (g('onderStreefbereik').min !== undefined && waarde >= g('onderStreefbereik').min) return 'onderStreefbereik';
  return 'laag';
}

const STATUS_TEKST = Object.freeze({
  laag: 'Laag', onderStreefbereik: 'Onder streefbereik', goed: 'Goed', hoog: 'Hoog', zeerHoog: 'Zeer hoog'
});

/**
 * Effectief volume in een periode: per spiergroep (primair × gewichtPrimair, secundair × gewichtSecundair),
 * skill-volume apart, en een telling van wat er niet meetelt en waarom.
 * Eén set telt voor elke betrokken spiergroep met zijn eigen weging; er is geen "dubbele hele set":
 * het totaal van de spiergroepen is dus bewust groter dan het aantal sets.
 */
function berekenVolume({ config, sets, logs, verworpenSessies, van, tot }) {
  const meta = (config && config._meta) || {};
  const volumeCfg = meta.volume || {};
  const wP = typeof volumeCfg.gewichtPrimair === 'number' ? volumeCfg.gewichtPrimair : 1;
  const wS = typeof volumeCfg.gewichtSecundair === 'number' ? volumeCfg.gewichtSecundair : 0.5;
  const skillApart = volumeCfg.skillApart !== false;
  const idx = maakNaamIndex(config);
  const verz = verzamelSets({ config, sets, logs, verworpenSessies });
  const uitgesloten = { invalid: 0, slechteVorm: 0, pijn: 0, rirTeHoog: 0, rirOnbekend: 0, test: 0, warmup: 0, onbekendeOefening: verz.onbekendeOefening };
  const groepen = new Map();
  const skill = new Map();
  const sessies = new Set();
  let geldigeSets = 0, effectieveSets = 0, invalidSets = 0, werkSetsTotaal = 0;

  const voegToe = (groepId, cfg, aantal) => {
    if (!groepen.has(groepId)) groepen.set(groepId, { id: groepId, sets: 0, bijdragen: new Map() });
    const g = groepen.get(groepId);
    g.sets += aantal;
    g.bijdragen.set(cfg.id, (g.bijdragen.get(cfg.id) || 0) + aantal);
  };

  verz.sets.forEach(s => {
    if (typeof s.at === 'number' && ((typeof van === 'number' && s.at < van) || (typeof tot === 'number' && s.at >= tot))) return;
    const cfg = idx.perId.get(s.exerciseId);
    if (s.type !== 'test' && s.type !== 'warmup') { werkSetsTotaal++; if (s.setClass === 'INVALID') invalidSets++; }
    const b = beoordeelEffectieveSet(s, volumeCfg);
    if (s.sessionId) sessies.add(s.sessionId);
    if (!b.telt) { uitgesloten[b.reden]++; return; }
    geldigeSets++;
    effectieveSets++;
    if (skillApart && cfg.category === 'skill') {
      if (!skill.has(cfg.id)) skill.set(cfg.id, { exerciseId: cfg.id, naam: cfg.name, sets: 0, seconden: 0 });
      const k = skill.get(cfg.id);
      k.sets += 1;
      k.seconden += s.holdSec || 0;
      return;
    }
    ((cfg.muscles && cfg.muscles.primary) || []).forEach(m => voegToe(m, cfg, wP));
    ((cfg.muscles && cfg.muscles.secondary) || []).forEach(m => voegToe(m, cfg, wS));
  });

  // Alle spiergroepen uit de configuratie tonen, ook met 0 sets, zodat een ontbrekende groep zichtbaar is.
  const labels = meta.spiergroepLabels || {};
  const alle = new Set();
  idx.perId.forEach(cfg => {
    if (skillApart && cfg.category === 'skill') return;
    ((cfg.muscles && cfg.muscles.primary) || []).concat((cfg.muscles && cfg.muscles.secondary) || []).forEach(m => alle.add(m));
  });
  const volgorde = Array.isArray(meta.spiergroepVolgorde) ? meta.spiergroepVolgorde : [];
  const ids = [...alle].sort((a, b) => {
    const ia = volgorde.indexOf(a), ib = volgorde.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || a.localeCompare(b);
  });
  const spiergroepen = ids.map(id => {
    const g = groepen.get(id) || { id, sets: 0, bijdragen: new Map() };
    const status = volumeStatus(g.sets, meta.volumeIndicatoren);
    return {
      id, label: labels[id] || id, sets: g.sets, status, statusTekst: STATUS_TEKST[status],
      bijdragen: [...g.bijdragen.entries()].map(([exerciseId, sets]) => ({ exerciseId, naam: idx.perId.get(exerciseId).name, sets })).sort((a, b) => b.sets - a.sets)
    };
  });
  const skillLijst = [...skill.values()].sort((a, b) => b.sets - a.sets);
  return {
    spiergroepen,
    skill: { sets: skillLijst.reduce((t, k) => t + k.sets, 0), seconden: skillLijst.reduce((t, k) => t + k.seconden, 0), perOefening: skillLijst },
    uitgesloten,
    tellingen: { effectieveSets, werkSets: werkSetsTotaal, invalidSets, sessies: sessies.size },
    eenheden: { primair: wP, secundair: wS, skillApart }
  };
}

// ---------- stagnatie en energie -------------------------------------------------

/**
 * Oefeningen die nu een stagnatiesignaal hebben. `bepaalStagnatie` komt uit engine.js (zo staat de
 * stagnatiedefinitie op één plek). Oefeningen die al lang niet meer zijn uitgevoerd tellen niet mee.
 */
function stagnerendeOefeningen({ config, exerciseStates, bepaalStagnatie, nu }) {
  const meta = (config && config._meta) || {};
  const maxDagen = meta.weekAnalyse && typeof meta.weekAnalyse.stagnatieMaxDagenGeleden === 'number' ? meta.weekAnalyse.stagnatieMaxDagenGeleden : null;
  const drempel = meta.stagnatie && meta.stagnatie.sessiesAchtereen;
  const uit = [];
  (config.exercises || []).forEach(cfg => {
    const st = exerciseStates && exerciseStates[cfg.id];
    if (!st) return;
    if (maxDagen !== null && typeof st.lastPerformedAt === 'number' && nu - st.lastPerformedAt > maxDagen * DAG_MS) return;
    const s = bepaalStagnatie(cfg, st, { drempel });
    if (s) uit.push({ exerciseId: cfg.id, naam: cfg.name, ruleId: s.ruleId, sessies: s.sessies, totaal: s.totaal, eenheid: s.eenheid, voorstellen: s.voorstellen });
  });
  return uit;
}

function energieOverzicht({ trainingen, config, tot, nu }) {
  const meta = (config && config._meta) || {};
  const lengte = meta.weekAnalyse && meta.weekAnalyse.energieReeksLengte ? meta.weekAnalyse.energieReeksLengte : 8;
  const grens = typeof tot === 'number' ? tot : nu;
  const lijst = (Array.isArray(trainingen) ? trainingen : [])
    .filter(t => t && typeof t.at === 'number' && t.at < grens)
    .sort((a, b) => a.at - b.at);
  const reeks = lijst.slice(-lengte).map(t => ({ at: t.at, energie: getal(t.energie), dagNaam: t.dagNaam || null }));
  const metWaarde = reeks.filter(r => r.energie !== null);
  const gemiddelde = metWaarde.length ? Math.round((metWaarde.reduce((s, r) => s + r.energie, 0) / metWaarde.length) * 10) / 10 : null;
  return { reeks, gemiddelde, ontbrekend: reeks.length - metWaarde.length };
}

// ---------- deload (opdracht §11) -----------------------------------------------

/** Is er een deload actief? Een deload eindigt vanzelf op `eindigtOp`. */
function deloadActief(deload, nu) {
  if (!deload || deload.actief !== true) return false;
  return typeof deload.eindigtOp !== 'number' || nu < deload.eindigtOp;
}

/** Halveer het aantal werksets, naar boven afgerond (opdracht §11). */
function deloadAantalSets(sets, factor) {
  if (typeof sets !== 'number' || sets <= 0) return sets;
  const f = typeof factor === 'number' && factor > 0 && factor <= 1 ? factor : 0.5;
  return Math.max(1, Math.ceil(sets * f));
}

function startDeload(deload, nu, config) {
  const cfg = (config && config._meta && config._meta.deload) || {};
  const duur = typeof cfg.duurDagen === 'number' ? cfg.duurDagen : 7;
  return Object.assign({}, deload || {}, {
    actief: true, sinds: nu, eindigtOp: nu + duur * DAG_MS, bevestigdOp: nu, laatsteDeloadOp: nu,
    beeindigdOp: null, afgewezenOp: null,
    volumeFactor: typeof cfg.volumeFactor === 'number' ? cfg.volumeFactor : 0.5,
    targetRir: typeof cfg.targetRir === 'number' ? cfg.targetRir : 3
  });
}

function beeindigDeload(deload, nu) {
  return Object.assign({}, deload || {}, { actief: false, beeindigdOp: nu });
}

function wijsDeloadAf(deload, nu) {
  return Object.assign({}, deload || {}, { afgewezenOp: nu });
}

/**
 * Toetst de drie deloadcriteria van opdracht §11 en doet een voorstel als er minstens één geldt.
 * Het voorstel moet altijd worden bevestigd; deze functie wijzigt niets.
 *  1. ≥ minOefeningenMetFailStreak oefeningen met een falende beslissing (effect in faalEffecten) in de
 *     laatste faalSessiesVenster trainingen (binnen faalMaxDagenGeleden dagen).
 *  2. Energie ≤ energieMax bij de laatste energieSessiesAchtereen trainingen.
 *  3. ≥ wekenSindsLaatsteDeload weken sinds de laatste deload (of, als die er nooit was, sinds de eerste
 *     geregistreerde training) én ≥ minStagnerendeOefeningen stagnerende oefeningen.
 */
function bepaalDeload({ config, decisions, trainingen, stagnerend, deload, eersteTrainingOp, ruleEffect, nu }) {
  const c = (config && config._meta && config._meta.deload) || {};
  const effecten = ruleEffect || {};
  const faalEffecten = Array.isArray(c.faalEffecten) ? c.faalEffecten : [];
  const venster = c.faalSessiesVenster || 2;
  const idx = maakNaamIndex(config);
  const actief = deloadActief(deload, nu);

  // --- 1: falende oefeningen in de laatste sessies
  const actieve = (Array.isArray(decisions) ? decisions : []).filter(d => d && d.decisionType === 'EXERCISE' && !d.vervangenDoor && d.sessionId && typeof d.timestamp === 'number'
    && (typeof c.faalMaxDagenGeleden !== 'number' || nu - d.timestamp <= c.faalMaxDagenGeleden * DAG_MS));
  const sessieTijd = new Map();
  actieve.forEach(d => sessieTijd.set(d.sessionId, Math.max(sessieTijd.get(d.sessionId) || 0, d.timestamp)));
  const laatsteSessies = [...sessieTijd.entries()].sort((a, b) => b[1] - a[1]).slice(0, venster).map(e => e[0]);
  const falend = new Map();
  actieve.filter(d => laatsteSessies.includes(d.sessionId)).forEach(d => {
    const effect = d.effect || effecten[d.ruleId || (d.result && d.result.ruleId)] || null;
    if (effect && faalEffecten.includes(effect)) falend.set(d.exerciseId, (idx.perId.get(d.exerciseId) || {}).name || d.exerciseId);
  });
  const minFail = c.minOefeningenMetFailStreak;
  const k1 = {
    nr: 1, ruleId: 'DELOAD_FAIL_CLUSTER', voldaan: laatsteSessies.length >= 1 && falend.size >= minFail,
    tekst: laatsteSessies.length === 0
      ? `Geen oefeningsbeslissingen in de afgelopen ${c.faalMaxDagenGeleden} dagen om te beoordelen.`
      : `${falend.size} oefening(en) met een mislukte beslissing in de laatste ${laatsteSessies.length} training(en); grens is ${minFail}.`,
    details: { oefeningen: [...falend.values()], sessies: laatsteSessies.length }
  };

  // --- 2: lage energie
  const lijst = (Array.isArray(trainingen) ? trainingen : []).filter(t => t && typeof t.at === 'number').sort((a, b) => a.at - b.at);
  const n = c.energieSessiesAchtereen;
  const laatste = lijst.slice(-n);
  const waarden = laatste.map(t => getal(t.energie));
  const k2 = {
    nr: 2, ruleId: 'DELOAD_LOW_ENERGY',
    voldaan: laatste.length >= n && waarden.every(w => w !== null && w <= c.energieMax),
    tekst: laatste.length < n
      ? `Te weinig trainingen met energiescore (${laatste.length} van ${n}).`
      : `Energie van de laatste ${n} trainingen: ${waarden.map(w => w === null ? 'niet ingevuld' : w + '/5').join(', ')}; grens is ≤ ${c.energieMax}/5.`,
    details: { waarden }
  };

  // --- 3: lang geleden + stagnatie
  const aantalStagn = Array.isArray(stagnerend) ? stagnerend.length : 0;
  const basis = deload && typeof deload.laatsteDeloadOp === 'number' ? { ms: deload.laatsteDeloadOp, soort: 'laatste deload' }
    : (typeof eersteTrainingOp === 'number' ? { ms: eersteTrainingOp, soort: 'eerste geregistreerde training (er is nog geen deload vastgelegd)' } : null);
  const weken = basis ? Math.floor((nu - basis.ms) / (7 * DAG_MS)) : null;
  const k3 = {
    nr: 3, ruleId: 'DELOAD_OVERDUE_STAGNATION',
    voldaan: weken !== null && weken >= c.wekenSindsLaatsteDeload && aantalStagn >= c.minStagnerendeOefeningen,
    tekst: weken === null
      ? 'Geen trainingen of deload bekend om de periode te bepalen.'
      : `${weken} week/weken sinds ${basis.soort} (grens ${c.wekenSindsLaatsteDeload}) en ${aantalStagn} stagnerende oefening(en) (grens ${c.minStagnerendeOefeningen}).`,
    details: { weken, aantalStagn, basis: basis ? basis.soort : null }
  };

  const criteria = [k1, k2, k3];
  const voldaan = criteria.filter(k => k.voldaan);
  const afgewezenRecent = deload && typeof deload.afgewezenOp === 'number' && typeof c.afwijzingDagen === 'number' && (nu - deload.afgewezenOp) < c.afwijzingDagen * DAG_MS;
  let voorstel = null;
  if (!actief && voldaan.length > 0 && !afgewezenRecent) {
    voorstel = {
      ruleIds: voldaan.map(k => k.ruleId),
      reasonText: 'Deload voorgesteld: ' + voldaan.map(k => k.tekst).join(' '),
      uitvoering: {
        volumeFactor: c.volumeFactor, targetRir: c.targetRir, duurDagen: c.duurDagen,
        tekst: `Halve werksets (naar boven afgerond), dezelfde belasting, streef naar minimaal RIR ${c.targetRir}, geen progressieverhogingen en geen nieuwe tests, ${c.duurDagen} dagen.`
      }
    };
  }
  return { actief, criteria, voorstel, afgewezenRecent: !!afgewezenRecent, deload: deload || null };
}

// ---------- weekanalyse ---------------------------------------------------------

/**
 * Volledige weekanalyse (opdracht §14.6). `weekOffset` 0 = deze week, -1 = vorige week.
 * Stagnatie, energie en deload gaan over de actuele situatie (`nu`), volume over de gekozen week.
 */
function evaluateWeek(invoer) {
  const { config, sets, logs, trainingen, decisions, exerciseStates, deload, eersteTrainingOp, bepaalStagnatie, ruleEffect, nu } = invoer;
  const weekOffset = invoer.weekOffset || 0;
  const grenzen = weekGrenzen(nu, weekOffset);
  const verworpenSessies = (Array.isArray(decisions) ? decisions : []).filter(d => d && d.vervangenDoor === 'verworpen' && d.sessionId).map(d => d.sessionId);
  const volume = berekenVolume({ config, sets, logs, verworpenSessies: invoer.verworpenSessies || verworpenSessies, van: grenzen.start, tot: grenzen.eind });
  const stagnatie = stagnerendeOefeningen({ config, exerciseStates, bepaalStagnatie, nu });
  const energie = energieOverzicht({ trainingen, config, tot: weekOffset === 0 ? undefined : grenzen.eind, nu });
  const weekTrainingen = (Array.isArray(trainingen) ? trainingen : []).filter(t => t && t.at >= grenzen.start && t.at < grenzen.eind).length;
  const deloadAnalyse = bepaalDeload({ config, decisions, trainingen, stagnerend: stagnatie, deload, eersteTrainingOp, ruleEffect, nu });
  return {
    week: { start: grenzen.start, eind: grenzen.eind, offset: weekOffset },
    trainingen: Math.max(weekTrainingen, volume.tellingen.sessies),
    ...volume,
    stagnatie,
    energie,
    deload: deloadAnalyse
  };
}


// ---------- maandrapport (opdracht §14.7) -----------------------------------------

function pct(deel, totaal) { return totaal > 0 ? Math.round((deel / totaal) * 1000) / 10 : null; }
function nl(x) { return String(Math.round(x * 10) / 10).replace('.', ','); }
function lokaleDatumSleutel(ms) { const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }

/**
 * Persoonlijke records in [van, tot). Een record is een geldige set die niet wordt "ingehaald" door een eerdere
 * geldige set van dezelfde oefening: bij reps heeft geen eerdere set een gewicht ≥ en reps ≥, bij hold is het de
 * langste hold ooit. De eerste meting van een oefening is geen record (er is niets om mee te vergelijken).
 * Vorm 'slecht', pijn en INVALID tellen niet; een hold-testpoging telt wel.
 */
function bepaalRecords({ config, sets, logs, verworpenSessies, van, tot }) {
  const idx = maakNaamIndex(config);
  const verz = verzamelSets({ config, sets, logs, verworpenSessies }).sets;
  const perOefening = new Map();
  verz.forEach(s => {
    const cfg = idx.perId.get(s.exerciseId);
    const hold = cfg.type === 'hold';
    if (typeof s.at !== 'number') return;
    if (s.vorm === 'slecht' || s.pijn === true || s.setClass === 'INVALID') return;
    if (s.type !== 'werk' && !(s.type === 'test' && hold)) return;
