  const pijnInSessie = classified.some(s => s.setClass === E.SET_CLASS.BLOCKED);
  const stateBekend = kaartState.startStateStatus === 'ok';
  let transitie = stateBekend
    ? E.bepaalStateNaOefening(config, kaartState.exerciseState, exerciseResultaat, { keuze: null, pijnInSessie, nu: Date.now(), totaal: totaalVanSets(classified, config), stagnatieDrempel: stagnatieDrempelUitConfig() })
    : null;
  if (transitie && transitie.valid === false) { console.error('State-overgang ongeldig:', transitie); transitie = null; }

  kaartState.uitkomst = {
    exerciseId, revisie, decisionId, result: exerciseResultaat, pijnInSessie, keuze: null, totaal: totaalVanSets(classified, config),
    overruleSeq: vorige ? vorige.overruleSeq : 0, overruleId: null,
    transitie, stateBekend, stateGeschreven: false, levelGeschreven: false
  };

  if (!window.firebaseProgressie || !huidigeSessionId) return kaartState.uitkomst;
  const record = E.buildDecisionRecord({
    exerciseId, sessionId: huidigeSessionId, setId: null, decisionType: 'EXERCISE',
    inputSnapshot: { classified, startState: kaartState.exerciseState, startStateBekend: stateBekend, context },
    result: exerciseResultaat, accepted: null
  });
  // `effect` wordt MEE opgeslagen zodat de geschiedenis een beslissing later nooit anders
  // kan classificeren dan op het moment zelf (opdracht §16, historische consistentie).
  record.effect = E.RULE_EFFECT[exerciseResultaat.ruleId] || 'UNKNOWN';
  record.configSnapshot = configSnapshotVan(config);
  record.revisie = revisie;
  record.supersedes = vorige ? vorige.decisionId : null;
  record.vervangenDoor = null;
  window.firebaseProgressie.slaDecisionOp(decisionId, record).catch(opslagFout('beslissing'));
  if (vorige) {
    markeerVervangen(vorige.decisionId, decisionId);
    if (vorige.overruleId) markeerVervangen(vorige.overruleId, decisionId);
  }
  return kaartState.uitkomst;
}

// --- Bevestigen en overrulen -----------------------------------------------
let overruleOpen = {}; // idx -> true zolang het keuzepaneel openstaat

function bevestigVoorstelOefening(idx) { kiesUitkomst(idx, 'ACCEPT'); }
function overruleOefening(idx, keuze) { kiesUitkomst(idx, keuze); }
function wisselOverruleKeuzes(idx) { overruleOpen[idx] = !overruleOpen[idx]; vernieuwSamenvatting(); }

function vernieuwSamenvatting() {
  // Bewust renderLogKaart() i.p.v. herteken(): herteken() zou eerst bewaarHuidigeKaart() draaien.
  if (huidigLogDag) renderLogKaart();
}

function kiesUitkomst(idx, keuze) {
  const E = window.ProgressieEngine;
  const kaartState = haalOfMaakSetModusState(idx);
  const u = kaartState.uitkomst;
  if (!u || !u.stateBekend) return;
  const o = logOefeningen[idx];
  const config = bouwEngineConfig(o);
  const transitie = E.bepaalStateNaOefening(config, kaartState.exerciseState, u.result, {
    keuze, pijnInSessie: u.pijnInSessie, nu: Date.now(), totaal: u.totaal, stagnatieDrempel: stagnatieDrempelUitConfig()
  });
  if (transitie.valid === false) { toast(`Keuze niet mogelijk: ${transitie.errorMessage}`); return; }
  if (keuze === 'ACCEPT' && !(u.transitie && u.transitie.voorstel)) return; // er valt niets te bevestigen

  u.keuze = keuze;
  u.transitie = transitie;
  u.stateGeschreven = false;
  u.levelGeschreven = false;
  overruleOpen[idx] = false;

  if (window.firebaseProgressie && huidigeSessionId) {
    const fp = window.firebaseProgressie;
    const isOverrule = keuze !== 'ACCEPT';
    fp.werkDecisionBijOp(u.decisionId, { accepted: !isOverrule, acceptedAt: Date.now() }).catch(opslagFout('beslissing bijwerken'));
    if (isOverrule) {
      u.overruleSeq += 1;
      const nieuwId = `${huidigeSessionId}_${u.exerciseId}_overrule_${u.overruleSeq}`;
      const record = E.buildDecisionRecord({
        exerciseId: u.exerciseId, sessionId: huidigeSessionId, setId: null, decisionType: 'OVERRULE',
        inputSnapshot: {
          engineBeslissing: u.result.decision, engineRuleId: u.result.ruleId,
          startLevelId: kaartState.exerciseState.currentLevelId ?? null
        },
        result: { keuze, naarLevelId: transitie.state.currentLevelId },
        accepted: false
      });
      record.ruleId = `USER_OVERRULE_${keuze}`;
      record.reasonText = `Door de gebruiker aangepast: ${OVERRULE_LABELS[keuze]}.`;
      record.keuze = keuze;
      record.configSnapshot = configSnapshotVan(config);
      record.revisie = u.overruleSeq;
      record.supersedes = u.decisionId;
      record.vervangenDoor = null;
      fp.slaDecisionOp(nieuwId, record).catch(opslagFout('overrule'));
      if (u.overruleId) markeerVervangen(u.overruleId, nieuwId);
      u.overruleId = nieuwId;
    } else if (u.overruleId) {
      // Bevestigd na eerder een overrule: die overrule is daarmee vervangen.
      markeerVervangen(u.overruleId, u.decisionId);
      u.overruleId = null;
    }
  }
  bewaarSessieVoortgang();
  vernieuwSamenvatting();
}

// --- Wegschrijven bij het opslaan van de training ----------------------------
/**
 * Schrijft per oefening de nieuwe exerciseState weg, en — alleen als het niveau
 * netto veranderde — één LEVEL_CHANGE-beslissing met de reden. Wordt aangeroepen
 * bij "Afronden" en "Opslaan en verlaten", nooit bij "Verlaten zonder opslaan".
 * Alle ID's zijn deterministisch en elke stap onthoudt of hij al gelukt is, dus
 * opnieuw proberen na een mislukte poging veroorzaakt geen dubbele of strijdige
 * writes.
 * @returns {Promise<{geschreven:number, fouten:number}>}
 */
async function commitSessieUitkomsten() {
  const E = window.ProgressieEngine;
  const fp = window.firebaseProgressie;
  const sessionId = huidigeSessionId; // vastleggen: de aanroeper reset huidigeSessionId direct daarna
  const resultaat = { geschreven: 0, fouten: 0 };
  if (!fp || !sessionId) return resultaat;

  const taken = [];
  Object.keys(setModusPerKaart).forEach(idx => {
    const k = setModusPerKaart[idx];
    const u = k && k.uitkomst;
    if (!u || !u.stateBekend || !u.transitie) return;
    const o = logOefeningen[idx];
    if (!o) return;
    const config = bouwEngineConfig(o);
    const lc = u.transitie.levelChange;
    taken.push((async () => {
      if (!u.stateGeschreven) {
        await fp.slaExerciseStateOp(u.exerciseId, u.transitie.state);
        u.stateGeschreven = true;
      }
      if (lc && !u.levelGeschreven) {
        const record = E.buildDecisionRecord({
          exerciseId: u.exerciseId, sessionId, setId: null, decisionType: 'LEVEL_CHANGE',
          inputSnapshot: { startState: k.exerciseState, keuze: u.keuze },
          result: lc, accepted: lc.bron === 'auto' ? null : true
        });
        record.ruleId = lc.ruleId;
        record.reasonText = levelChangeTekst(config, lc);
        record.van = lc.van ?? null;
        record.naar = lc.naar ?? null;
        record.bron = lc.bron;
        record.configSnapshot = configSnapshotVan(config);
        record.supersedes = u.decisionId;
        record.vervangenDoor = null;
        await fp.maakDecisionAanIndienNieuwOp(`${sessionId}_${u.exerciseId}_level`, record);
        u.levelGeschreven = true;
      }
      if (u.transitie.stagnatie && !u.stagnatieGeschreven) {
        const sg = u.transitie.stagnatie;
        const record = E.buildDecisionRecord({
          exerciseId: u.exerciseId, sessionId, setId: null, decisionType: 'STAGNATION',
          inputSnapshot: { recent: u.transitie.state.recent, drempel: sg.sessies }, result: sg, accepted: null
        });
        record.configSnapshot = configSnapshotVan(config);
        record.supersedes = null;
        record.vervangenDoor = null;
        await fp.maakDecisionAanIndienNieuwOp(`${sessionId}_${u.exerciseId}_stagnation`, record);
        u.stagnatieGeschreven = true;
      }
      resultaat.geschreven++;
    })().catch(e => { resultaat.fouten++; opslagFout('voortgang')(e); }));
  });
  await Promise.all(taken);
  return resultaat;
}

// --- Samenvattingskaart (opdracht §14.4) ------------------------------------
/** Stagnatiesignaal met checklist en voorstellen (opdracht §9 regel 6). Altijd als hulpmiddel, nooit als regressie. */
function renderStagnatieKaart(sg) {
  if (!sg) return '';
  const voorstellen = sg.voorstellen.length
    ? `<div class="sv-kop">Mogelijke volgende stap</div><ul class="sv-lijst">${sg.voorstellen.map(v => `<li><b>${htmlEsc({ tempo: 'Tempo', pauze: 'Pauze', microload: 'Microbelasting', variant: 'Variant', alternatief: 'Alternatief' }[v.type] || v.type)}:</b> ${htmlEsc(v.tekst)}</li>`).join('')}</ul>`
    : `<div class="sv-dim">Voor deze oefening zijn nog geen voorstellen ingesteld.</div>`;
  return `<div class="sv-stagnatie">
    <div class="sv-stagnatie-titel">Stagnatie</div>
    <div>${htmlEsc(sg.reasonText)}</div>
    <div class="sv-kop">Check eerst</div>
    <ul class="sv-lijst">${sg.checklist.map(c => `<li>${htmlEsc(c)}</li>`).join('')}</ul>
    ${voorstellen}
    <div class="sv-dim">Regel: ${htmlEsc(sg.ruleId)} · er verandert niets automatisch aan je niveau.</div>
  </div>`;
}

// Regels waarbij holdMax is behaald maar er (nog) geen hoger niveau of testpoging is: dat is onderhoud, geen fout. Alleen de weergave.
const ONDERHOUD_REGELS = ['EXERCISE_HOLD_MAX_NO_TEST_CONFIG', 'EXERCISE_HOLD_MAX_NO_NEXT_LEVEL'];
const SV_TITELS = { UP: 'Progressie behaald', HOLD: 'Niveau blijft gelijk', DOWN: 'Stap terug voorgesteld', TEST: 'Testpoging gepland', BLOCKED: 'Geblokkeerd' };

function formatteerSetRegel(s, isTijd) {
  const d = s.data;
  const waarde = isTijd ? (d.holdSec !== null && d.holdSec !== undefined ? `${d.holdSec} sec` : '–') : (d.reps !== null && d.reps !== undefined ? `${d.reps} reps` : '–');
  const last = d.load !== null && d.load !== undefined && !Number.isNaN(d.load) && d.load !== 0 ? `${d.load} kg` : '';
  const rir = d.rir !== null && d.rir !== undefined ? `RIR ${d.rir}` : '';
  const delen = [waarde, last, rir, d.form || '', d.pain ? 'pijn' : ''].filter(Boolean);
  return delen.join(' · ');
}

function renderOefeningSamenvatting(idx) {
  const E = window.ProgressieEngine;
  const H = window.ProgressieHistorie;
  const o = logOefeningen[idx];
  const config = bouwEngineConfig(o);
  const k = haalOfMaakSetModusState(idx);
  const b = k.oefeningBeslissing;
  const u = k.uitkomst;
  if (!b) return '';
  const isTijd = config.type === 'hold';
  const t = u && u.transitie;
  const heeftLadder = Array.isArray(config.ladder) && config.ladder.length > 0;

  const testRij = k.testSet ? `
    <div class="sv-set">
      <span class="sv-nr">T</span>
      <span class="sv-tekst">Testpoging · ${k.testSet.data.holdSec} sec · ${k.testSet.data.form || ''}${k.testSet.data.pain ? ' · pijn' : ''}</span>
      <span class="feedback-chip ${k.testSet.geslaagd ? 'klasse-goed' : 'klasse-waarschuwing'}">${k.testSet.geslaagd ? 'GESLAAGD' : 'TEST'}</span>
    </div>` : '';
  const rijen = testRij + k.geclassificeerdeSets.map(s => `
    <div class="sv-set">
      <span class="sv-nr">${s.data.n}</span>
      <span class="sv-tekst">${formatteerSetRegel(s, isTijd)}</span>
      <span class="feedback-chip ${setClassNaarKleurKlasse(s.setClass)}">${s.setClass || ''}</span>
    </div>`).join('');

  const voorstelOmhoog = t && t.voorstel && t.voorstel.type === 'UP';
  const kleurKlasse = voorstelOmhoog || b.decision === 'UP' || b.decision === 'TEST' ? 'klasse-goed'
    : b.decision === 'DOWN' || b.decision === 'BLOCKED' ? 'klasse-fout' : 'klasse-waarschuwing';
  const titel = voorstelOmhoog ? 'Progressie verdiend' : (SV_TITELS[b.decision] || b.decision);

  const doel = b.nextTarget || {};
  let doelTekst = '';
  if (doel.targetReps) doelTekst = `${doel.targetSets || ''}×${doel.targetReps} reps`;
  else if (doel.targetHold) doelTekst = `${doel.targetSets || ''}×${doel.targetHold} sec`;
  else if (doel.testSec) doelTekst = `Testpoging: minimaal ${doel.testSec} sec`;

  // --- Niveau-regel: wat gebeurt er met het niveau, en wanneer? ---
  let niveauHtml = '';
  if (u && !u.stateBekend) {
    niveauHtml = `<div class="sv-waarschuwing">Je eerdere voortgang van deze oefening kon niet worden geladen. De beslissing hierboven is voorlopig en er wordt voor deze oefening niets aan niveau of voortgang opgeslagen.</div>`;
  } else if (t) {
    if (t.levelChange) {
      niveauHtml = `<div class="sv-niveau">${levelChangeTekst(config, t.levelChange)} <span class="sv-dim">Wordt vastgelegd zodra je de training opslaat.</span></div>`;
    } else if (t.voorstel) {
      const naarLabel = H.niveauLabel(config, t.voorstel.naar);
      if (t.voorstel.geenLagerNiveau) {
        const reg = Array.isArray(config.regressie) && config.regressie.length ? ` Overweeg: ${config.regressie.map(r => htmlEsc(r.naam)).join(', ')}.` : '';
      niveauHtml = `<div class="sv-niveau">Een stap terug wordt voorgesteld, maar er is geen lager niveau ingesteld. Het niveau blijft gelijk.${reg}</div>`;
      } else if (t.voorstel.type === 'UP') {
        niveauHtml = `<div class="sv-niveau"><b>Voorstel:</b> naar "${naarLabel}". Dit is een grote stap en gaat alleen door als jij het bevestigt.</div>`;
      } else {
        niveauHtml = `<div class="sv-niveau"><b>Voorstel:</b> een stap terug naar "${naarLabel}". Dit gaat alleen door als jij het bevestigt.</div>`;
      }
    } else if (heeftLadder) {
      niveauHtml = `<div class="sv-niveau">Niveau blijft: "${H.niveauLabel(config, t.state.currentLevelId)}".</div>`;
    }
    if (t.state.painBlocked) {
      niveauHtml += `<div class="sv-waarschuwing">Pijnblokkade actief: geen progressie totdat je twee opeenvolgende trainingen pijnvrij bent.</div>`;
    }
  }
  niveauHtml += renderStagnatieKaart(t && t.stagnatie);
  const stopTekst = k.pijnGestopt && k.laatsteSetResultaat
    ? `<div class="sv-waarschuwing">Oefening gestopt: ${k.laatsteSetResultaat.reasonText || ''}</div>` : '';

  // --- Acties: bevestigen en overrulen ---
  let actiesHtml = '';
  if (u && u.stateBekend && t) {
    const beschikbaar = E.beschikbareOverrules(config, k.exerciseState, { pijnGeblokkeerd: !!t.state.painBlocked });
    const kanOverrulen = heeftLadder; // knop altijd tonen bij een ladder; niet-mogelijke keuzes staan uitgeschakeld mét reden
    const wachtOpBevestiging = !!t.voorstel && !t.voorstel.geenLagerNiveau && u.keuze !== 'ACCEPT';
    const keuzeTekst = u.keuze ? `<div class="sv-keuze">Jouw keuze: <b>${u.keuze === 'ACCEPT' ? 'Bevestigd' : OVERRULE_LABELS[u.keuze]}</b> ✓</div>` : '';

    const knoppen = [];
    if (wachtOpBevestiging) {
      knoppen.push(`<button class="btn primary" onclick="bevestigVoorstelOefening(${idx})">Bevestig stap</button>`);
    }
    if (kanOverrulen) {
      knoppen.push(`<button class="btn ghost" onclick="wisselOverruleKeuzes(${idx})">Overrule</button>`);
    }
    const paneel = overruleOpen[idx] && kanOverrulen ? `
      <div class="overrule-paneel">
        ${['HOLD', 'UP', 'DOWN'].map(key => {
          const m = beschikbaar[key];
          const sub = heeftLadder ? H.niveauLabel(config, m.naar) : '';
          return `<button class="overrule-keuze ${u.keuze === key ? 'gekozen' : ''}" ${m.mogelijk ? '' : 'disabled'} onclick="overruleOefening(${idx}, '${key}')">
            <span class="overrule-naam">${OVERRULE_LABELS[key]}</span>
            <span class="overrule-sub">${m.mogelijk ? sub : (key === 'UP' && t.state.painBlocked ? 'niet tijdens pijnblokkade' : 'niet mogelijk')}</span>
          </button>`;
        }).join('')}
      </div>` : '';
    const geenNiveaus = !heeftLadder
      ? `<div class="sv-dim">Voor deze oefening zijn nog geen niveaus ingesteld in program.json, dus er valt niets te overrulen. De beslissing wordt wel bewaard.</div>` : '';
    actiesHtml = `${keuzeTekst}${knoppen.length ? `<div class="sv-acties">${knoppen.join('')}</div>` : ''}${paneel}${geenNiveaus}`;
  }

  return `
    <div class="samenvatting">
      <div class="sv-kop">Tijdlijn</div>
      <div class="sv-sets">${rijen}</div>
      <div class="oefening-beslissing-kaart">
        <div class="oefening-beslissing-titel ${kleurKlasse}">${titel}</div>
        <div class="oefening-beslissing-reden">${b.reasonText || ''}</div>
        <div class="sv-regel">Regel: ${ONDERHOUD_REGELS.includes(b.ruleId) ? 'onderhoud' : (b.ruleId || '')}</div>
        ${doelTekst ? `<div class="oefening-beslissing-doel">Volgende training: ${doelTekst}</div>` : ''}
      </div>
      ${stopTekst}${niveauHtml}${actiesHtml}
    </div>`;
}

// --- Tussenscherm in exercise-modus ------------------------------------------
// In setmodus staat de samenvatting op de kaart zelf zodra de laatste set klaar is.
// In exercise-modus gebeurt de beoordeling pas bij "Volgende"; dan verschijnt de
// samenvatting eerst als eigen scherm (één keer per wijziging van de invoer).
let samenvattingIdx = null;

function renderSamenvattingScherm() {
  const idx = samenvattingIdx;
  const o = logOefeningen[idx];
  const totaal = logOefeningen.length;
  setHeader(`Loggen · ${huidigLogDag.kort.replace('\n', ' ')}`, `${idx + 1} van ${totaal}`, [
    { label: 'Home', action: () => go('home') },
    { label: 'Trainen', action: () => go('trainen') },
    { label: 'Loggen', action: () => {} }
  ]);
  const dots = logOefeningen.map((_, i) => `<div class="prog-dot ${i === idx ? 'active' : ''} ${logData[i] ? 'done' : ''}"></div>`).join('');
  app.innerHTML = `
    <div class="prog-dots">${dots}</div>
    <div class="log-ex log-ex-single">
      <div class="ex-title">${o.naam}</div>
      ${renderOefeningSamenvatting(idx)}
    </div>
    <div class="log-nav">
      <button class="btn nav-btn" onclick="samenvattingTerug()">← Terug naar oefening</button>
      <button class="btn primary nav-btn" onclick="samenvattingVerder()">Volgende →</button>
    </div>`;
}

function samenvattingTerug() { samenvattingIdx = null; overruleOpen = {}; renderLogKaart(); window.scrollTo(0, 0); }
function samenvattingVerder() {
  samenvattingIdx = null; overruleOpen = {};
  logIndex = Math.min(logIndex + 1, logOefeningen.length - 1);
  renderLogKaart();
  window.scrollTo(0, 0);
}

/**
 * Een training die zonder opslaan wordt verlaten verandert de oefeningstatus niet. De
 * beslissingen die er al waren (direct bewaard, opdracht §18.8) blijven bestaan als
 * historie, maar krijgen de markering 'verworpen' zodat ze nergens meetellen (niveau,
 * stagnatie) en op de voortgangspagina als "niet opgeslagen" te herkennen zijn.
 */
function markeerSessieAlsVerworpen() {
  if (!window.firebaseProgressie) return;
  Object.values(setModusPerKaart).forEach(k => {
    const u = k && k.uitkomst;
    if (!u) return;
    [u.decisionId, u.overruleId].filter(Boolean).forEach(id => markeerVervangen(id, 'verworpen'));
  });
}

/** Zet de kaart-gebonden hulpstate terug (de sessie-id zelf zetten de aanroepers). */
function resetSessieHulpstate() {
  huidigeEnergie = null;
  setModusPerKaart = {};
  setModusRirKeuze = {}; setModusVormKeuze = {}; setModusPijnKeuze = {};
  samenvattingIdx = null;
  overruleOpen = {};
}

// --- Spiegel naar de bestaande "logs"-opslag ----------------------------------
// Setmodus schreef in Fase 2 alleen naar "sets"; de progressiepagina en alle
// bestaande grafieken lezen "logs". Daardoor verdween elke oefening die in
// setmodus was gelogd uit de voortgang. Nu wordt elke afgeronde set ook in de
// bestaande logData-vorm gezet, zodat slaLogDataOpInFirestore() 'm ongewijzigd
// meeneemt. Legacy kent één RIR/vorm per oefening: dat is die van de laatste set.
function spiegelNaarLogData(idx, o, config, kaartState) {
  const isTijd = config.type === 'hold';
  const sets = {};
  kaartState.geclassificeerdeSets.forEach(s => {
    const waarde = isTijd ? s.data.holdSec : s.data.reps;
    sets[s.data.n] = {
      reps: waarde === null || waarde === undefined ? '' : String(waarde),
      gewicht: o.type === 'skill' ? null : (Number.isFinite(s.data.load) ? s.data.load : null)
    };
  });
  const laatste = kaartState.geclassificeerdeSets[kaartState.geclassificeerdeSets.length - 1];
  const ui = (laatste && laatste.ui) || {};
  logData[idx] = {
    sets,
    rir: ui.rir !== undefined ? ui.rir : null,
    vorm: ui.vorm !== undefined ? ui.vorm : null,
    pijn: kaartState.geclassificeerdeSets.some(s => s.data.pain),
    notitie: (logData[idx] && logData[idx].notitie) || ''
  };
}

// --- De training opslaan: voortgang + logs + sessie-opruiming ---------------
function metTimeout(belofte, ms) {
  return new Promise(resolve => {
    const t = setTimeout(() => resolve('wacht'), ms);
    belofte.then(() => { clearTimeout(t); resolve('ok'); })
      .catch(e => { clearTimeout(t); console.error('Opslaan van de training mislukt:', e); resolve('fout'); });
  });
}

/**
 * Schrijft alles weg wat bij "de training opslaan" hoort, in vaste volgorde:
 *   1. oefeningstatus + niveauwijzigingen (commitSessieUitkomsten),
 *   2. de bestaande logs (idempotent: vaste document-id's per sessie en kaart),
 *   3. het herstel-snapshot weghalen.
 * Het snapshot gaat dus pas weg als 1 en 2 gelukt zijn. Mislukt er iets, dan
 * blijft de training open (of herstelbaar) en kan het opnieuw zonder dubbele data.
 * Resultaat: 'ok' | 'wacht' (geen bevestiging binnen 8 s, vermoedelijk offline;
 * de writes blijven in de wachtrij staan) | 'fout'.
 */
function bewaarTrainingInFirestore() {
  const sessionId = huidigeSessionId;
  const dag = huidigLogDag;
  const oefeningen = logOefeningen;
  const data = logData;
  const energie = huidigeEnergie;
  const metDeload = deloadIsActief();
  const taak = (async () => {
    const commit = await commitSessieUitkomsten();
    if (commit.fouten > 0) throw new Error('Voortgang van de oefeningen kon niet worden opgeslagen');
    await slaLogDataOpInFirestore(dag, oefeningen, data, sessionId);
    if (window.firebaseProgressie && sessionId) {
      // Energie per training (opdracht §14.2). null = niet ingevuld.
      await window.firebaseProgressie.slaTrainingOp(sessionId, { dagId: dag.id, dagNaam: dag.naam, energie, deload: metDeload });
    }
    if (window.firebaseProgressie && sessionId) {
      await window.firebaseProgressie.verwijderSessieOp(sessionId).catch(opslagFout('sessie opruimen'));
    }
  })();
  return metTimeout(taak, 8000);
}


// ============================================================
// LOGGEN — één kaart per oefening (incl. warm-up/cooldown), met navigatie
// ============================================================
let logOefeningen = [];   // huidige lijst kaarten voor de actieve logsessie
let logIndex = 0;
let logData = {};
// Per kaart-index: set-modus-specifieke state. Zie nieuweSetModusKaartState().
let setModusPerKaart = {};

function renderLoggen(dagId) {
  const dag = SCHEMA.dagen.find(d => d.id === dagId);
  if (!dag) return renderTrainenMenu();

  if (!ingelogd) {
    setHeader(`Loggen · ${dag.kort.replace('\n', ' ')}`, "Log in om te loggen", [
      { label: 'Home', action: () => go('home') },
      { label: 'Trainen', action: () => go('trainen') },
      { label: 'Loggen', action: () => {} }
    ]);
    app.innerHTML = renderLoginBox();
    return;
  }

  // Noodversie: eerst skill/strength/hypertrophy laten kiezen voordat de kaart-flow start.
  if (dag.isNoodtraining) {
    if (!noodKeuzeActief) {
      // Echte nieuwe start (vanuit het dag-overzicht): keuzes leegmaken en de sessie openen.
      noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() };
      noodKeuzeActief = true;
    }
    const alleKeuzesGemaakt = noodKeuze.skill && noodKeuze.strength && noodKeuze.hypertrophy;
    if (!alleKeuzesGemaakt) {
      renderNoodKeuzeScherm(dag);
      return;
    }
    if (!huidigLogDag || huidigLogDag.id !== dag.id || !huidigLogDag._noodOpgebouwd) {
      huidigLogDag = dag;
      huidigLogDag._noodOpgebouwd = true;
      logOefeningen = [
        { type: 'warmup', naam: 'Warm-up', items: dag.warmup },
        { type: 'skill', dagId: dag.id, ...noodKeuze.skill },
        { type: 'strength', dagId: dag.id, ...noodKeuze.strength },
        { type: 'hypertrophy', dagId: dag.id, ...noodKeuze.hypertrophy },
        { type: 'cooldown', naam: 'Cooldown', items: dag.cooldown }
      ];
      logIndex = 0;
      logData = {};
      timerState = {};
      uitlegOpen = {};
      if (!huidigeSessionId) huidigeSessionId = nieuweSessionId(dag.id);
      resetSessieHulpstate();
      laadExerciseStatesVoorSessie();
    }
    renderLogKaart();
    return;
  }

  if (!huidigLogDag || huidigLogDag.id !== dag.id) {
    huidigLogDag = dag;
    logOefeningen = [
      { type: 'warmup', naam: 'Warm-up', items: dag.warmup },
      ...dag.skill.oefeningen.map(o => ({ type: 'skill', ...o })),
      ...(dag.strength || []).map(o => ({ type: 'strength', ...o })),
      ...(dag.hypertrophy || []).map(o => ({ type: 'hypertrophy', ...o })),
      ...(dag.legs || []).map(o => ({ type: 'legs', ...o })),
      { type: 'cooldown', naam: 'Cooldown', items: dag.cooldown }
    ];
    logIndex = 0;
    logData = {};
    timerState = {};
    uitlegOpen = {};
    if (!huidigeSessionId) huidigeSessionId = nieuweSessionId(dag.id);
    resetSessieHulpstate();
    laadExerciseStatesVoorSessie();
  }

  renderLogKaart();
}

function renderLogKaart() {
  vraagWakeLockAan(); // scherm blijft aan zolang je aan het loggen bent
  if (samenvattingIdx !== null && samenvattingIdx === logIndex) { renderSamenvattingScherm(); return; }
  const item = logOefeningen[logIndex];
  const totaal = logOefeningen.length;
  const isLaatste = logIndex === totaal - 1;
  const isEerste = logIndex === 0;

  setHeader(`Loggen · ${huidigLogDag.kort.replace('\n', ' ')}`, `${logIndex + 1} van ${totaal}`, [
    { label: 'Home', action: () => go('home') },
    { label: 'Trainen', action: () => go('trainen') },
    { label: 'Loggen', action: () => {} }
  ]);

  const dots = logOefeningen.map((_, i) => `
    <div class="prog-dot ${i === logIndex ? 'active' : ''} ${logData[i] || (logOefeningen[i].type === 'warmup' || logOefeningen[i].type === 'cooldown') && i < logIndex ? 'done' : ''}"></div>
  `).join('');

  let kaartHtml = '';
  let uitlegHtml = '';
  let notitieHtml = '';
  let gebruiktSetModus = false;
  let setModusWachtOpAfronding = false;

  if (item.type === 'warmup' || item.type === 'cooldown') {
    kaartHtml = renderWarmupCooldownKaart(item, logIndex);
  } else {
    const programMatch = vindProgramConfig(item.naam, item.dagId || (huidigLogDag && huidigLogDag.id));
    const effectieveMode = bepaalEffectieveRatingMode(programMatch ? programMatch.id : null, item.type);
    gebruiktSetModus = effectieveMode === 'set' && !!window.ProgressieEngine;

    haalOfMaakSetModusState(logIndex).modus = gebruiktSetModus ? 'set' : 'exercise';
    if (gebruiktSetModus) {
      kaartHtml = renderSetModusKaart(item, logIndex);
      const kaartState = haalOfMaakSetModusState(logIndex);
      // Zolang de oefening nog niet is afgerond (of geblokkeerd door pijn), mag je
      // niet via de gewone navigatieknop doorklikken — "Set klaar" is dan de enige weg.
      setModusWachtOpAfronding = !kaartState.afgerond && !kaartState.pijnGestopt;
    } else {
      kaartHtml = renderOefeningKaart(item, logIndex);
      uitlegHtml = renderUitlegBlock(item.naam, logIndex);
      notitieHtml = renderNotitieVeld(logIndex);
    }
  }

  app.innerHTML = `
    <div class="prog-dots">${dots}</div>
    ${item.type === 'warmup' || item.type === 'cooldown' ? '' : renderDeloadBanner()}
    ${kaartHtml}
    <div class="log-nav">
      <button class="btn nav-btn" onclick="logVorige()" ${isEerste ? 'disabled' : ''}>← Vorige</button>
      ${isLaatste
        ? `<button class="btn primary nav-btn" onclick="logAfronden()" ${setModusWachtOpAfronding ? 'disabled' : ''}>Afronden ✓</button>`
        : `<button class="btn primary nav-btn" onclick="logVolgende()" ${setModusWachtOpAfronding ? 'disabled' : ''}>Volgende →</button>`}
    </div>
    ${isLaatste ? renderEnergieKiezer() : ''}
    ${uitlegHtml}
    ${notitieHtml}
  `;

  // Sessie-voortgang na elke kaartwissel bewaren (opdracht §16, herstelbaarheid).
  bewaarSessieVoortgang();
}

/**
 * Vrij tekstveld onder de "Meer uitleg"-knop waar je per oefening iets kunt
 * noteren over hoe de set ging (bv. "voelde zwaar", "vorm werd slordig bij set 3").
 * Waarde wordt net als reps/gewicht/RIR bewaard in bewaarHuidigeKaart() en gaat
 * mee als los veld naar Firestore.
 */
function renderNotitieVeld(idx) {
  const bewaardeNotitie = (logData[idx] && logData[idx].notitie) || '';
  return `
    <div class="notitie-veld">
      <label class="field-label" for="notitie_${idx}">Notitie</label>
      <textarea id="notitie_${idx}" placeholder="Hoe ging deze oefening? (optioneel)" rows="2">${bewaardeNotitie}</textarea>
    </div>
  `;
}

function renderWarmupCooldownKaart(item, idx) {
  const isCooldown = item.type === 'cooldown';
  const itemsHtml = item.items.map((w, wi) => {
    const setsInfo = parseSetsEnTijd(w.target);

    let timersHtml = '';
    if (setsInfo) {
      // Sets×seconden-item (bv. "2×30 sec", "2×15 sec"): één losse timer per set.
      let setTimers = '';
      for (let s = 1; s <= setsInfo.sets; s++) {
        const key = `${idx}_${wi}_${s}`;
        setTimers += `
          <div class="wc-set-timer">
            <span class="wc-set-label">Set ${s}</span>
            ${renderTimerBlock(key, setsInfo.secPerSet)}
          </div>
        `;
      }
      timersHtml = setTimers;
    } else if (!w.target && w.sec) {
      // Geen target-structuur, puur een doorlopende tijdsduur (bv. "Jumping jacks", "Polsroutine").
      const key = `${idx}_${wi}`;
      timersHtml = renderTimerBlock(key, w.sec);
    }
    // Overige gevallen (target zonder "sec", zoals "2×15" reps of "4 per kant"): geen timer.

    return `
      <div class="wc-item">
        <div class="wc-name">${w.naam}</div>
        <div class="wc-dur">${w.target ? w.target : `${w.sec}s`}</div>
        ${timersHtml}
      </div>
    `;
  }).join('');

  return `
    <div class="log-ex log-ex-single">
      <div class="ex-title">${isCooldown ? 'Cooldown' : 'Warm-up'}</div>
      <div class="ex-target">${item.items.length} onderdelen</div>
      ${itemsHtml}
    </div>
  `;
}

function renderUitlegBlock(naam, idx) {
  const uitleg = OEFENING_UITLEG[naam];
  if (!uitleg) return '';
  const open = !!uitlegOpen[idx];

  return `
    <div class="uitleg-standalone">
      <button type="button" class="btn uitleg-toggle-btn full ${open ? 'open' : ''}" onclick="toggleUitleg(${idx})">
        <span>📖 Meer uitleg${open ? ' verbergen' : ''}</span>
        <span class="uitleg-chevron ${open ? 'open' : ''}">⌄</span>
      </button>
      ${open ? `
        <div class="uitleg-content">
          <div class="uitleg-row"><span class="uitleg-label">Begin</span><span>${uitleg.begin}</span></div>
          <div class="uitleg-row"><span class="uitleg-label">Eind</span><span>${uitleg.eind}</span></div>
          <div class="uitleg-row"><span class="uitleg-label">Let op</span><span>${uitleg.let_op}</span></div>
        </div>
      ` : ''}
    </div>
  `;
}

function toggleUitleg(idx) {
  uitlegOpen[idx] = !uitlegOpen[idx];
  herteken();
}

// ============================================================
// DRAAIWIEL — halve-cirkel dial control voor reps/seconden per set
// ============================================================
// ============================================================
// LINEAAL-CONTROL — schuifbare meetlat met vaste middenwijzer, horizontaal
// (reps/seconden) of verticaal (gewicht). Vloeiend slepen, magneet-snap naar
// de dichtstbijzijnde stap bij loslaten, geen +/- knoppen.
// ============================================================

// Hoeveel px op het scherm één stap inneemt op de lineaal.
const LINEAAL_PX_PER_EENHEID = 18;

function renderDraaiwiel(id, waarde, max, eenheid, richting, stap) {
  richting = richting || 'horizontaal';
  stap = stap || 1;
  const veilig = Math.max(0, Math.min(max, parseFloat(waarde) || 0));
  const isVert = richting === 'verticaal';
  const aantalTikken = Math.round(max / stap);
  // Om de hoeveel stappen een groot streepje + cijfer komt. Gekozen zodat er, net als bij
  // gewicht, altijd meerdere referentiepunten tegelijk zichtbaar zijn in het venster
  // (venster ≈ 200px, dus grootElke * LINEAAL_PX_PER_EENHEID moet daar ruim onder blijven).
  const grootElke = stap < 1 ? Math.round(1 / stap) : 3;

  // Elke stap krijgt een streepje (klein), elke grootElke-ste stap een groter streepje + cijfer.
  let tikjes = '';
  for (let i = 0; i <= aantalTikken; i++) {
    const stapWaarde = Math.round(i * stap * 100) / 100;
    const groot = i % grootElke === 0;
    const pos = i * LINEAAL_PX_PER_EENHEID;
    const posProp = isVert ? 'top' : 'left';
    tikjes += `<div class="lineaal-tik ${groot ? 'groot' : ''}" style="${posProp}:${pos}px"></div>`;
    if (groot) {
      tikjes += `<div class="lineaal-cijfer" style="${posProp}:${pos}px">${stapWaarde}</div>`;
    }
  }

  return `
    <div class="lineaal-wrap ${isVert ? 'verticaal' : ''}" id="wrap_${id}">
      <div class="lineaal-venster" id="venster_${id}">
        <div class="lineaal-wijzer"></div>
        <div class="lineaal-strook" id="strook_${id}" data-max="${max}" data-stap="${stap}" data-value="${veilig}" data-id="${id}">
          ${tikjes}
        </div>
        <div class="lineaal-fade lineaal-fade-l"></div>
        <div class="lineaal-fade lineaal-fade-r"></div>
      </div>
      <div class="draaiwiel-waarde" id="waardeWrap_${id}" onclick="toonHandmatigeInvoer('${id}')">
        <span id="val_${id}">${veilig}</span>
      </div>
      <input type="hidden" id="${id}" value="${veilig}">
    </div>
  `;
}

/**
 * Vervangt het klikbare cijfer-vakje door een numeriek invoerveld, zodat je een
 * waarde ook handmatig kunt typen in plaats van alleen te slepen. inputmode
 * "decimal" (bij niet-hele stappen, zoals gewicht in stappen van 0.5) of "numeric"
 * (bij hele stappen, reps/seconden) zorgt dat mobiele toestellen het numerieke
 * numpad tonen in plaats van het volledige toetsenbord.
 * @param {string} id
 */
function toonHandmatigeInvoer(id) {
  const strook = document.getElementById(`strook_${id}`);
  const wrap = document.getElementById(`waardeWrap_${id}`);
  if (!strook || !wrap) return;
  const huidigeWaarde = strook.dataset.value;
  const stap = parseFloat(strook.dataset.stap) || 1;
  const isDecimaal = stap < 1;

  wrap.innerHTML = `
    <input
      type="number"
      inputmode="${isDecimaal ? 'decimal' : 'numeric'}"
      id="invoer_${id}"
      class="handmatige-invoer"
      value="${huidigeWaarde}"
      step="${stap}"
      onblur="verwerkHandmatigeInvoer('${id}')"
      onkeydown="if(event.key==='Enter'){event.target.blur();}"
    >
  `;
  const invoerEl = document.getElementById(`invoer_${id}`);
  invoerEl.focus();
  invoerEl.select();
}

/**
 * Leest de handmatig getypte waarde, snapt 'm netjes vast op de lineaal (zelfde
 * update-pad als slepen), en bouwt het waarde-vakje weer terug naar de normale
 * klikbare weergave.
 * @param {string} id
 */
function verwerkHandmatigeInvoer(id) {
  const invoerEl = document.getElementById(`invoer_${id}`);
  if (!invoerEl) return; // al opnieuw gerenderd (bv. door snel wisselen van kaart)
  const nieuweWaarde = parseFloat(invoerEl.value);
  draaiwielSnapNaarWaarde(id, isNaN(nieuweWaarde) ? 0 : nieuweWaarde);
}

/**
 * Bouwt het waarde-vakje terug naar de normale (klikbare) weergave, en snapt de
 * gegeven waarde vast op de dichtstbijzijnde geldige stap — zelfde eindresultaat
 * als loslaten na slepen, maar dan vanaf een handmatig getypt getal.
 * @param {string} id
 * @param {number} waarde
 */
function draaiwielSnapNaarWaarde(id, waarde) {
  const strook = document.getElementById(`strook_${id}`);
  const wrap = document.getElementById(`waardeWrap_${id}`);
  if (!strook || !wrap) return;
  const stap = parseFloat(strook.dataset.stap) || 1;
  const dichtstbijzijnd = Math.round(waarde / stap) * stap;

  wrap.innerHTML = `<span id="val_${id}"></span>`;
  strook.classList.add('snappen');
  draaiwielUpdateVisueel(id, dichtstbijzijnd, true);
  setTimeout(() => strook.classList.remove('snappen'), 180);
}

function draaiwielIsVert(strook) {
  return strook.closest('.lineaal-wrap').classList.contains('verticaal');
}

function draaiwielFormatteer(waarde, stap) {
  // Bij hele stappen (reps) een heel getal tonen, bij decimale stappen (gewicht) netjes afronden.
  return stap < 1 ? (Math.round(waarde * 2) / 2).toString() : Math.round(waarde).toString();
}

function draaiwielUpdateVisueel(id, waarde, magTrillen) {
  const strook = document.getElementById(`strook_${id}`);
  if (!strook) return;
  const max = parseFloat(strook.dataset.max);
  const stap = parseFloat(strook.dataset.stap) || 1;
  const vorige = parseFloat(strook.dataset.value);
  const veilig = Math.max(0, Math.min(max, waarde));
  const isVert = draaiwielIsVert(strook);

  const offsetPx = (veilig / stap) * LINEAAL_PX_PER_EENHEID;
  strook.style.transform = isVert ? `translateY(-${offsetPx}px)` : `translateX(-${offsetPx}px)`;

  document.getElementById(`val_${id}`).textContent = draaiwielFormatteer(veilig, stap);
  document.getElementById(id).value = veilig;
  strook.dataset.value = veilig;

  if (magTrillen !== false && veilig !== vorige && navigator.vibrate) {
    navigator.vibrate(8);
  }
}

// Tijdens het slepen: de strook vloeiend op de exacte (niet-gekwantiseerde) pixelpositie
// zetten, geen snap en geen trilling. Het cijfer toont alvast de dichtstbijzijnde stap.
function draaiwielUpdateVloeiend(id, exacteWaarde) {
  const strook = document.getElementById(`strook_${id}`);
  if (!strook) return;
  const max = parseFloat(strook.dataset.max);
  const stap = parseFloat(strook.dataset.stap) || 1;
  const veilig = Math.max(0, Math.min(max, exacteWaarde));
  const isVert = draaiwielIsVert(strook);

  const offsetPx = (veilig / stap) * LINEAAL_PX_PER_EENHEID;
  strook.style.transform = isVert ? `translateY(-${offsetPx}px)` : `translateX(-${offsetPx}px)`;

  const dichtstbijzijnd = Math.round(veilig / stap) * stap;
  document.getElementById(`val_${id}`).textContent = draaiwielFormatteer(dichtstbijzijnd, stap);
  strook.dataset.slependeWaarde = veilig;
}

// Bij loslaten: snap (met korte animatie) naar de dichtstbijzijnde stap,
// werk de echte waarde bij, en trilt daar precies één keer.
function draaiwielSnapNaarDichtstbijzijnde(id) {
  const strook = document.getElementById(`strook_${id}`);
  if (!strook) return;
  const stap = parseFloat(strook.dataset.stap) || 1;
  const exact = parseFloat(strook.dataset.slependeWaarde);
  const bron = isNaN(exact) ? parseFloat(strook.dataset.value) : exact;
  const dichtstbijzijnd = Math.round(bron / stap) * stap;

  strook.classList.add('snappen');
  draaiwielUpdateVisueel(id, dichtstbijzijnd, true);
  setTimeout(() => strook.classList.remove('snappen'), 180);
}

function draaiwielVanPositie(id, clientPos, startPos, startWaarde) {
  const strook = document.getElementById(`strook_${id}`);
  const stap = parseFloat(strook.dataset.stap) || 1;
  const deltaPx = clientPos - startPos;
  const deltaStappen = deltaPx / LINEAAL_PX_PER_EENHEID; // NIET afgerond — vloeiende sleep
  const exacteWaarde = startWaarde - (deltaStappen * stap); // slepen "voorwaarts" = waarde omlaag, strook schuift mee
  draaiwielUpdateVloeiend(id, exacteWaarde);
}

function draaiwielInit(id) {
  const venster = document.getElementById(`venster_${id}`);
  const strook = document.getElementById(`strook_${id}`);
  if (!venster || !strook) return;
  const isVert = draaiwielIsVert(strook);
  let slepen = false;
  let startPos = 0;
  let startWaarde = parseFloat(strook.dataset.value);

  const start = (e) => {
    slepen = true;
    strook.classList.remove('snappen');
    const point = e.touches ? e.touches[0] : e;
    startPos = isVert ? point.clientY : point.clientX;
    startWaarde = parseFloat(strook.dataset.value);
    e.preventDefault();
  };
  const beweeg = (e) => {
    if (!slepen) return;
    const point = e.touches ? e.touches[0] : e;
    const pos = isVert ? point.clientY : point.clientX;
    draaiwielVanPositie(id, pos, startPos, startWaarde);
  };
  const stop = () => {
    if (!slepen) return;
    slepen = false;
    draaiwielSnapNaarDichtstbijzijnde(id);
  };

  venster.addEventListener('mousedown', start);
  venster.addEventListener('touchstart', start, { passive: false });
  window.addEventListener('mousemove', beweeg);
  window.addEventListener('touchmove', beweeg, { passive: false });
  window.addEventListener('mouseup', stop);
  window.addEventListener('touchend', stop);
}


// ============================================================
// FASE 2 — SETMODUS: één actieve set tegelijk, directe engine-feedback,
// directe Firestore-opslag per set. Zie opdracht §14.2.
// ============================================================

/**
 * Verse state voor één kaart-index in set-modus. Wordt aangemaakt zodra een
 * oefeningskaart voor het eerst in setmodus wordt geopend, en blijft bestaan
 * (via setModusPerKaart) zolang de logsessie loopt, zodat terug/vooruit-
 * navigeren tussen kaarten niets verliest.
 */
function nieuweSetModusKaartState() {
  return {
    actieveSet: 1,                 // 1-based: welke set nu wordt ingevoerd
    geclassificeerdeSets: [],      // engine-datamodel + setClass per al afgeronde set
    exerciseState: {},             // ruwe exercise-state (currentLevelId, streaks, ...) voor evaluateExercise
    laatsteSetResultaat: null,     // evaluateSet()-resultaat van de zojuist afgeronde set, voor het feedbackpaneel
    genegeerdeVoorstellen: {},     // per setnummer: welke actie al genegeerd is, zodat 'm niet opnieuw opdringt
    oefeningBeslissing: null,      // evaluateExercise()-resultaat zodra de laatste set is afgerond
    afgerond: false,
    pijnGestopt: false,            // true zodra een set BLOCKED/STOP_EXERCISE opleverde — verdere sets geblokkeerd
    modus: null,                   // 'set' | 'exercise': bepaalt welke invoer de bron van waarheid is
    startStateStatus: 'laden',     // 'ok' | 'fout' | 'laden': is de eerdere voortgang van deze oefening bekend?
    uitkomst: null,                // de vastgelegde oefeningsuitkomst (zie legUitkomstVast)
    setDecisionIds: {},            // exercise-modus: setnr -> id van de huidige SET-beslissing
    testSet: null,                 // hold: de testpoging van deze training ({data, geslaagd}), telt niet als werkset
    testOvergeslagen: false,       // de gebruiker koos ervoor de testpoging nu niet te doen
    _laatstVerwerkteSignature: null
  };
}

function haalOfMaakSetModusState(idx) {
  if (!setModusPerKaart[idx]) {
    const k = nieuweSetModusKaartState();
    const s = startStateVoorIdx(idx);
    k.exerciseState = s.state;
    k.startStateStatus = s.status;
    setModusPerKaart[idx] = k;
  }
  return setModusPerKaart[idx];
}

/** Vertaalt een setClass naar één van de drie CSS-kleurklassen die overal in Fase 2 worden hergebruikt. */
function setClassNaarKleurKlasse(setClass) {
  const E = window.ProgressieEngine;
  if (!E) return '';
  if (setClass === E.SET_CLASS.TOP || setClass === E.SET_CLASS.OP_DOEL) return 'klasse-goed';
  if (setClass === E.SET_CLASS.TE_LICHT || setClass === E.SET_CLASS.TE_ZWAAR || setClass === E.SET_CLASS.VERMOEID) return 'klasse-waarschuwing';
  if (setClass === E.SET_CLASS.INVALID || setClass === E.SET_CLASS.BLOCKED) return 'klasse-fout';
  return '';
}

function renderSetstrip(numSets, kaartState) {
  let bollen = '';
  for (let s = 1; s <= numSets; s++) {
    const afgerond = kaartState.geclassificeerdeSets[s - 1];
    const isActief = s === kaartState.actieveSet && !afgerond;
    const kleurKlasse = afgerond ? setClassNaarKleurKlasse(afgerond.setClass) : '';
    bollen += `<div class="setstrip-bol ${isActief ? 'actief' : ''} ${kleurKlasse}">${s}</div>`;
  }
  return `<div class="setstrip">${bollen}</div>`;
}

/**
 * Bouwt het engine-config-object voor een SCHEMA-oefening op. Combineert de
 * PROGRAM_CONFIG-match (repMin/repMax/holdStart/holdMax/ladder/...) met een
 * fallback op basis van de SCHEMA-target-string wanneer er geen match is,
 * zodat de engine ook voor (nog) niet-geconfigureerde oefeningen een
 * zinnig — zij het ladder-loos — resultaat geeft in plaats van te crashen.
 * @param {Object} o - het SCHEMA/logOefeningen-item (heeft .naam, .target, .rust, .eenheid)
 * @returns {Object|null} engine-config, of null als er geen zinnig type te bepalen is
 */
function bouwEngineConfig(o) {
  const programMatch = vindProgramConfig(o.naam, o.dagId || (huidigLogDag && huidigLogDag.id));
  if (programMatch) return programMatch;

  // Geen PROGRAM_CONFIG-match (bv. een noodversie-optie met net een andere naam-
  // toevoeging, of een oefening die nog niet in Fase 1 is ingevoerd): bouw een
  // minimale config uit de SCHEMA-targetstring, met een lege ladder — de engine
  // kan dan nog steeds classificeren (TOP/OP_DOEL/TE_ZWAAR/...), alleen UP-
  // progressie naar een volgend ladderniveau is dan niet beschikbaar.
  const isTijd = o.eenheid === 'sec';
  const rustSec = rustSeconden(o) || 90;
  if (isTijd) {
    const holdMatch = (o.target || '').match(/(\d+)(?:–(\d+))?\s*sec/);
    const holdMax = holdMatch ? parseInt(holdMatch[2] || holdMatch[1]) : 30;
    const holdStart = holdMatch ? parseInt(holdMatch[1]) : Math.round(holdMax * 0.6);
    return { id: null, name: o.naam, type: 'hold', restSec: rustSec, holdStart, holdMax, testSec: null, sets: parseInt((o.target.match(/^(\d+)×/) || [null, 3])[1]), ladder: [] };
  }
  const repMatch = (o.target || '').match(/(\d+)(?:[–-](\d+))?/g);
  const laatsteGetallen = repMatch && repMatch.length ? repMatch[repMatch.length - 1] : '6-8';
  const [laag, hoog] = String(laatsteGetallen).split(/[–-]/).map(n => parseInt(n));
  return { id: null, name: o.naam, type: 'reps', restSec: rustSec, repMin: laag || 6, repMax: hoog || laag || 8, sets: parseInt((o.target.match(/^(\d+)×/) || [null, 3])[1]), ladder: [] };
}

/**
 * Leest de huidige draaiwiel-/RIR-/vorm-/pijn-invoer van de actieve set uit de
 * DOM en bouwt het engine-datamodel (opdracht §6) op. Geeft null terug als de
 * verplichte velden (RIR, vorm) nog niet zijn ingevuld — "geen standaard-
 * selectie" (opdracht §13): de knop "Set klaar" mag dan niet doorzetten.
 */
function leesActieveSetInvoer(idx, config, setN) {
  const isTijd = config.type === 'hold';
  const repsEl = document.getElementById(`sm_reps_${idx}_${setN}`);
  const gewichtEl = document.getElementById(`sm_gewicht_${idx}_${setN}`);
  const rirGekozen = setModusRirKeuze[idx];
  const vormGekozen = setModusVormKeuze[idx];
  const pijnGekozen = !!setModusPijnKeuze[idx];

  if (rirGekozen === undefined || rirGekozen === null) return { fout: 'Kies eerst een RIR-waarde.' };
  if (!vormGekozen) return { fout: 'Kies eerst hoe de vorm was.' };

  return {
    data: {
      n: setN,
      type: 'werk',
      reps: isTijd ? null : (repsEl ? parseFloat(repsEl.value) : null),
      holdSec: isTijd ? (repsEl ? parseFloat(repsEl.value) : null) : null,
      load: gewichtEl ? parseFloat(gewichtEl.value) : null,
      assist: 0,
      rir: rirNaarGetal(rirGekozen),
      form: vormNaarEngine(vormGekozen),
      pain: pijnGekozen,
      restSec: null,
      setClass: null,
      ratedAt: Date.now()
    }
  };
}

// Tijdelijke keuze-state voor de actieve set se RIR/vorm/pijn-knoppen (per kaart-
// index, gereset zodra je naar de volgende set gaat — dit is bewust GEEN
// standaardselectie: leeg totdat de gebruiker bewust klikt, conform opdracht §13).
let setModusRirKeuze = {};
let setModusVormKeuze = {};
let setModusPijnKeuze = {};

function kiesSetModusRir(idx, waarde) { setModusRirKeuze[idx] = waarde; herteken(); }
function kiesSetModusVorm(idx, waarde) { setModusVormKeuze[idx] = waarde; herteken(); }
function wisselSetModusPijn(idx) { setModusPijnKeuze[idx] = !setModusPijnKeuze[idx]; herteken(); }

function renderSetModusKaart(o, idx) {
  const kaartState = haalOfMaakSetModusState(idx);
  const config = bouwEngineConfig(o);
  const isTijd = config.type === 'hold';
  const numSets = aantalSetsVoor(config.sets || parseInt((o.target.match(/^(\d+)×/) || [null, 3])[1]));
  const isSkill = o.type === 'skill';

  const setstripHtml = renderSetstrip(numSets, kaartState);

  // Oefening is klaar (alle sets afgerond én evaluateExercise is al gedraaid): toon de samenvattingskaart.
  if (kaartState.afgerond && kaartState.oefeningBeslissing) {
    return `
      <div class="log-ex log-ex-single">
        <div class="ex-title">${o.naam}</div>
        ${setstripHtml}
        ${renderOefeningSamenvatting(idx)}
      </div>
    `;
  }

  // Geblokkeerd door pijn: geen verdere setinvoer, alleen de BLOCKED-feedback tonen.
  if (kaartState.pijnGestopt) {
    return `
      <div class="log-ex log-ex-single">
        <div class="ex-title">${o.naam}</div>
        ${setstripHtml}
        ${renderFeedbackpaneel(kaartState.laatsteSetResultaat, config)}
      </div>
    `;
  }

  if (testNodig(kaartState, config)) return renderTestSetKaart(o, idx, config, kaartState);

  const setN = kaartState.actieveSet;
  const vorigeIngevuld = kaartState.geclassificeerdeSets[setN - 2]; // 0-based index van de set ervóór
  const repsWielId = `sm_reps_${idx}_${setN}`;
  const gewichtWielId = `sm_gewicht_${idx}_${setN}`;
  const repsMax = isTijd ? 120 : 30;
  const startWaarde = vorigeIngevuld ? (isTijd ? vorigeIngevuld.data.holdSec : vorigeIngevuld.data.reps) : 0;
  const startGewicht = vorigeIngevuld ? vorigeIngevuld.data.load : (o.gewicht || 0);

  // Op een ladderniveau met eigen holdStart/holdMax (bv. straddle-aanzet) geldt dat doel, niet dat van de oefening.
  const doelConfig = window.ProgressieEngine.configVoorNiveau(config, kaartState.exerciseState && kaartState.exerciseState.currentLevelId);
  const doelTekst = isTijd
    ? `Doel: ${doelConfig.holdStart}–${doelConfig.holdMax} sec`
    : `Doel: ${config.repMin}–${config.repMax} reps`;

  setTimeout(() => {
    draaiwielInit(repsWielId);
    const stripR = document.getElementById(`strook_${repsWielId}`);
    if (stripR) draaiwielUpdateVisueel(repsWielId, parseFloat(stripR.dataset.value), false);
    if (!isSkill) {
      draaiwielInit(gewichtWielId);
      const stripG = document.getElementById(`strook_${gewichtWielId}`);
      if (stripG) draaiwielUpdateVisueel(gewichtWielId, parseFloat(stripG.dataset.value), false);
    }
  }, 0);

  const rirGekozen = setModusRirKeuze[idx];
  const vormGekozen = setModusVormKeuze[idx];
  const pijnGekozen = !!setModusPijnKeuze[idx];

  return `
    <div class="log-ex log-ex-single">
      <div class="ex-title">${o.naam}</div>
      <div class="ex-target">Set ${setN} van ${numSets} · ${doelTekst}</div>
      ${setstripHtml}

      <div class="set-blok-rij">
        <div class="wiel-paneel reps-paneel">
          <div class="wiel-paneel-titel">${isTijd ? 'Seconden' : 'Reps'}</div>
          ${renderDraaiwiel(repsWielId, startWaarde, repsMax, isTijd ? 'sec' : 'reps', 'horizontaal', 1)}
        </div>
        ${!isSkill ? `
        <div class="wiel-paneel gewicht-paneel">
          <div class="wiel-paneel-titel">Gewicht</div>
          ${renderDraaiwiel(gewichtWielId, startGewicht, 20, 'kg', 'verticaal', 0.5)}
        </div>` : ''}
      </div>

      <label class="field-label">RIR</label>
      <div class="rir-knoppen">
        ${RIR_OPTIES.map(r => `<button class="keuze-knop ${rirGekozen === r.waarde ? 'gekozen' : ''}" onclick="kiesSetModusRir('${idx}','${r.waarde}')">${r.waarde === '4' ? '3+' : r.waarde}</button>`).join('')}
      </div>

      <label class="field-label">Vorm</label>
      <div class="vorm-knoppen">
        ${VORM_OPTIES.map(v => `<button class="keuze-knop ${vormGekozen === v.waarde ? 'gekozen' : ''}" onclick="kiesSetModusVorm('${idx}','${v.waarde}')">${v.label}</button>`).join('')}
      </div>

      <div class="pijn-schakelaar-rij">
        <label class="field-label">Pijn tijdens deze set</label>
        <div class="switch ${pijnGekozen ? 'on' : ''}" onclick="wisselSetModusPijn('${idx}')"><div class="knob"></div></div>
      </div>

      <button class="btn primary full" onclick="rondSetModusSetAf('${idx}')" style="margin-top:4px;">Set klaar</button>

      ${renderFeedbackpaneel(kaartState.laatsteSetResultaat, config)}
    </div>
  `;
}

// --- Testpoging (hold, opdracht §9 regel 5) -------------------------------
/** De testtijd voor de stap omhoog vanaf het huidige niveau (eigen testSec van het volgende ladderniveau, anders die van de oefening). */
function testSecNu(config, kaartState) {
  return window.ProgressieEngine.testSecVoor(config, kaartState.exerciseState);
}

/** Biedt de kaart de testset aan? Alleen bij een geplande test, vóór de eerste werkset, en nooit tijdens een deload. */
function testNodig(kaartState, config) {
  return config.type === 'hold' && testSecNu(config, kaartState) !== null
    && kaartState.exerciseState.awaitingTest === true
    && !kaartState.testSet && !kaartState.testOvergeslagen
    && kaartState.geclassificeerdeSets.length === 0
    && !deloadIsActief();
}

function renderTestSetKaart(o, idx, config, kaartState) {
  const E = window.ProgressieEngine;
  const H = window.ProgressieHistorie;
  const wielId = `sm_test_${idx}`;
  const naarLabel = H.niveauLabel(config, E.beschikbareOverrules(config, kaartState.exerciseState).UP.naar);
  const vormGekozen = setModusVormKeuze[idx];
  const pijnGekozen = !!setModusPijnKeuze[idx];
  setTimeout(() => {
    draaiwielInit(wielId);
    const strip = document.getElementById(`strook_${wielId}`);
    if (strip) draaiwielUpdateVisueel(wielId, parseFloat(strip.dataset.value), false);
  }, 0);
  return `
    <div class="log-ex log-ex-single">
      <div class="ex-title">${o.naam}</div>
      <div class="ex-target">Testpoging · doel: minimaal ${testSecNu(config, kaartState)} sec met goede vorm</div>
      <div class="sv-niveau">Je hebt holdMax twee trainingen op rij gehaald. Eén testpoging op <b>${htmlEsc(naarLabel)}</b> bepaalt of je een niveau omhoog kunt. Een testset telt niet mee voor je weekvolume.</div>
      <div class="set-blok-rij">
        <div class="wiel-paneel reps-paneel">
          <div class="wiel-paneel-titel">Seconden</div>
          ${renderDraaiwiel(wielId, 0, 120, 'sec', 'horizontaal', 1)}
        </div>
      </div>
      <label class="field-label">Vorm</label>
      <div class="vorm-knoppen">
        ${VORM_OPTIES.map(v => `<button class="keuze-knop ${vormGekozen === v.waarde ? 'gekozen' : ''}" onclick="kiesSetModusVorm('${idx}','${v.waarde}')">${v.label}</button>`).join('')}
      </div>
      <div class="pijn-schakelaar-rij">
        <label class="field-label">Pijn tijdens deze set</label>
        <div class="switch ${pijnGekozen ? 'on' : ''}" onclick="wisselSetModusPijn('${idx}')"><div class="knob"></div></div>
      </div>
      <button class="btn primary full" onclick="rondTestSetAf('${idx}')" style="margin-top:4px;">Testset klaar</button>
      <button class="btn ghost full" onclick="slaTestOver('${idx}')" style="margin-top:8px;">Test nu overslaan</button>
    </div>`;
}

function slaTestOver(idx) {
  haalOfMaakSetModusState(idx).testOvergeslagen = true;
  toast('Testpoging overgeslagen — hij blijft gepland voor een volgende training');
  bewaarSessieVoortgang();
  herteken();
}

function rondTestSetAf(idx) {
  const o = logOefeningen[idx];
  const config = bouwEngineConfig(o);
  const kaartState = haalOfMaakSetModusState(idx);
  const E = window.ProgressieEngine;
  if (!testNodig(kaartState, config)) return;
  const vorm = setModusVormKeuze[idx];
  if (!vorm) { toast('Kies eerst hoe de vorm was.'); return; }
  const wiel = document.getElementById(`sm_test_${idx}`);
  const holdSec = wiel ? parseFloat(wiel.value) : NaN;
  if (!Number.isFinite(holdSec) || holdSec <= 0) { toast('Vul de behaalde seconden in.'); return; }
  const pijn = !!setModusPijnKeuze[idx];
  const data = {
    n: 0, type: 'test', reps: null, holdSec, load: null, assist: 0, rir: null,
    form: vormNaarEngine(vorm), pain: pijn, restSec: null, setClass: null, ratedAt: Date.now()
  };
  const resultaat = E.evaluateSet(config, kaartState.exerciseState, [], data);
  if (resultaat.valid === false) { toast(`Ongeldige invoer: ${resultaat.errorMessage}`); return; }
  kaartState.testSet = { data, geslaagd: holdSec >= testSecNu(config, kaartState) && data.form === 'goed' && !pijn };
  delete setModusVormKeuze[idx]; delete setModusPijnKeuze[idx];

  const exerciseId = exerciseIdVoor(o, config);
  if (window.firebaseProgressie && huidigeSessionId) {
    const decisionId = `${huidigeSessionId}_${exerciseId}_set0`;
    window.firebaseProgressie.slaSetOp(huidigeSessionId, exerciseId, 0, data).catch(opslagFout('set'));
    const record = E.buildDecisionRecord({
      exerciseId, sessionId: huidigeSessionId, setId: decisionId, decisionType: 'SET',
      inputSnapshot: data, result: JSON.parse(JSON.stringify(resultaat)), accepted: null
    });
    record.configSnapshot = configSnapshotVan(config);
    window.firebaseProgressie.slaDecisionOp(decisionId, record).catch(opslagFout('set-beslissing'));
  }
  if (pijn) { kaartState.pijnGestopt = true; sluitOefeningAf(idx, o, config, kaartState); }
  toast(kaartState.testSet.geslaagd ? 'Testpoging gehaald — rond nu je werksets af' : 'Testpoging genoteerd — rond nu je werksets af');
  bewaarSessieVoortgang();
  herteken();
}

function renderFeedbackpaneel(resultaat, config) {
  if (!resultaat) return '';
  const E = window.ProgressieEngine;
  const kleurKlasse = setClassNaarKleurKlasse(resultaat.setClass);
  const next = resultaat.nextSet || {};

  let adviesTekst = '';
  if (config.type === 'hold' && next.targetHold !== null && next.targetHold !== undefined) {
    adviesTekst = `Volgende set: ${next.targetHold} sec`;
  } else if (config.type === 'reps' && next.targetReps !== null && next.targetReps !== undefined) {
    adviesTekst = `Volgende set: ${next.targetReps} reps`;
  }
  if (next.targetLoad !== null && next.targetLoad !== undefined) adviesTekst += `${adviesTekst ? ' @ ' : 'Gewicht: '}${next.targetLoad}kg`;
  if (next.restSec) adviesTekst += ` · rust ${next.restSec} sec`;

  const isVoorstelActie = E && [E.SET_ACTION.SUGGEST_LOAD_UP, E.SET_ACTION.SUGGEST_LOAD_DOWN, E.SET_ACTION.SUGGEST_REGRESS].includes(next.action);
  // Een voorstel wordt maar ÉÉN keer met Accepteer/Negeer-knoppen getoond — zodra de
  // gebruiker een keuze heeft gemaakt (_voorstelVerwerkt), blijft alleen een stille
  // bevestiging staan. Dit voorkomt dat "Negeer" bij elke herteken() (bv. door de
  // rusttimer die elke seconde update) opnieuw dezelfde knoppen toont — dat zou
  // opdracht §14.2.D schenden ("een genegeerd voorstel mag niet opnieuw verschijnen").
  const toontVoorstelKnoppen = isVoorstelActie && !resultaat._voorstelVerwerkt;
  const toontVoorstelBevestiging = isVoorstelActie && resultaat._voorstelVerwerkt;

  const timerHtml = next.restSec ? renderTimerBlock(`sm_rust_${resultaat._idx}`, next.restSec, 'Rust-timer') : '';

  return `
    <div class="feedbackpaneel ${kleurKlasse}">
      <div class="feedback-chip ${kleurKlasse}">${resultaat.setClass || ''}</div>
      <div class="feedback-reden">${resultaat.reasonText || ''}</div>
      ${adviesTekst ? `<div class="feedback-advies">${adviesTekst}</div>` : ''}
      ${timerHtml}
      ${toontVoorstelKnoppen ? renderVoorstelBlok(resultaat) : ''}
      ${toontVoorstelBevestiging ? `<div class="voorstel-afgehandeld">${resultaat._geaccepteerd ? '✓ Voorstel geaccepteerd' : '— Voorstel genegeerd'}</div>` : ''}
    </div>
  `;
}

function renderVoorstelBlok(resultaat) {
  const idx = resultaat._idx;
  const teksten = {
    SUGGEST_LOAD_UP: 'Voorstel: verhoog de belasting naar het volgende niveau.',
    SUGGEST_LOAD_DOWN: 'Voorstel: een stap terug in belasting kan verstandig zijn.',
    SUGGEST_REGRESS: 'Voorstel: overweeg een lichtere variant of minder herhalingen.'
  };
  const actie = resultaat.nextSet.action;
  return `
    <div class="voorstel-blok">
      <div class="voorstel-tekst">${teksten[actie] || 'Er is een voorstel voor de volgende set.'}</div>
      <div class="voorstel-knoppen">
        <button class="btn primary" onclick="verwerkVoorstel('${idx}', true)">Accepteer</button>
        <button class="btn ghost" onclick="verwerkVoorstel('${idx}', false)">Negeer</button>
      </div>
    </div>
  `;
}

function verwerkVoorstel(idx, geaccepteerd) {
  const kaartState = haalOfMaakSetModusState(idx);
  const resultaat = kaartState.laatsteSetResultaat;
  if (resultaat) {
    resultaat._voorstelVerwerkt = true;
    resultaat._geaccepteerd = geaccepteerd;
    if (!geaccepteerd) {
      kaartState.genegeerdeVoorstellen[resultaat.ruleId] = true;
    }
    // Corrigeer de decision-record met de gebruikerskeuze (opdracht §12.2: "accepted" veld).
    // Alleen de markering wordt bijgewerkt (merge); invoer, resultaat en tijdstip van de beslissing blijven staan.
    if (window.firebaseProgressie && huidigeSessionId && resultaat._decisionId) {
      window.firebaseProgressie.werkDecisionBijOp(resultaat._decisionId, { accepted: geaccepteerd, acceptedAt: Date.now() })
        .catch(opslagFout('beslissing bijwerken'));
    }
  }
  toast(geaccepteerd ? 'Voorstel geaccepteerd — wordt niet automatisch toegepast tijdens deze training' : 'Voorstel genegeerd');
  bewaarSessieVoortgang();
  herteken();
}

/**
 * Verwerkt de "Set klaar"-knop: valideert invoer, roept evaluateSet() aan,
 * slaat de set DIRECT op (opdracht §6/§18.8 — niet pas bij logAfronden), bouwt
 * en bewaart het decision-record, en gaat door naar de volgende set of naar
 * evaluateExercise() als dit de laatste set was.
 */
function rondSetModusSetAf(idx) {
  const o = logOefeningen[idx];
  const config = bouwEngineConfig(o);
  const kaartState = haalOfMaakSetModusState(idx);
  if (kaartState.afgerond || kaartState.pijnGestopt) return; // dubbelklik of verouderde knop
  const setN = kaartState.actieveSet;

  const invoer = leesActieveSetInvoer(idx, config, setN);
  if (invoer.fout) { toast(invoer.fout); return; }

  const E = window.ProgressieEngine;
  const eerdereSets = kaartState.geclassificeerdeSets.map(s => ({
    setClass: s.setClass, reps: s.data.reps, holdSec: s.data.holdSec, rir: s.data.rir, form: s.data.form, load: s.data.load, lastAction: s.resultaat && s.resultaat.nextSet && s.resultaat.nextSet.action
  }));
  const resultaat = E.evaluateSet(config, kaartState.exerciseState, eerdereSets, invoer.data);

  if (resultaat.valid === false) {
    toast(`Ongeldige invoer: ${resultaat.errorMessage}`);
    return;
  }

  // Schone kopie voor het beslissingsrecord, VOORDAT er weergave-vlaggen op `resultaat` komen.
  // (Fase 2 hing het record aan `resultaat` en `resultaat` aan het record: een circulaire
  // verwijzing waardoor de beslissing nooit kon worden opgeslagen.)
  const resultaatVoorRecord = JSON.parse(JSON.stringify(resultaat));

  // Als dezelfde regel (ruleId) eerder in déze oefening al eens genegeerd is, blijft
  // dat genegeerd voor de rest van de oefening-sessie — opdracht §14.2.D.
  if (kaartState.genegeerdeVoorstellen[resultaat.ruleId]) {
    resultaat._voorstelVerwerkt = true;
    resultaat._geaccepteerd = false;
  }

  resultaat._idx = idx;
  invoer.data.setClass = resultaat.setClass;
  invoer.data.restSec = resultaat.nextSet ? resultaat.nextSet.restSec : null;

  const ui = { rir: setModusRirKeuze[idx], vorm: setModusVormKeuze[idx] };
  kaartState.geclassificeerdeSets.push({ data: invoer.data, setClass: resultaat.setClass, resultaat, ui });
  kaartState.laatsteSetResultaat = resultaat;
  spiegelNaarLogData(idx, o, config, kaartState);

  // Direct opslaan — niet wachten tot logAfronden() (opdracht §6/§18.8).
  const exerciseId = exerciseIdVoor(o, config);
  const decisionId = `${huidigeSessionId}_${exerciseId}_set${setN}`;
  resultaat._decisionId = decisionId;
  if (window.firebaseProgressie && huidigeSessionId) {
    window.firebaseProgressie.slaSetOp(huidigeSessionId, exerciseId, setN, invoer.data).catch(opslagFout('set'));
    const record = E.buildDecisionRecord({
      exerciseId, sessionId: huidigeSessionId, setId: decisionId,
      decisionType: 'SET', inputSnapshot: invoer.data, result: resultaatVoorRecord, accepted: null
    });
    record.configSnapshot = configSnapshotVan(config);
    window.firebaseProgressie.slaDecisionOp(decisionId, record).catch(opslagFout('set-beslissing'));
  }

  // Reset de keuze-knoppen voor de volgende set (geen standaardselectie).
  delete setModusRirKeuze[idx];
  delete setModusVormKeuze[idx];
  delete setModusPijnKeuze[idx];

  const numSets = aantalSetsVoor(config.sets || parseInt((o.target.match(/^(\d+)×/) || [null, 3])[1]));
  const moetStoppen = E && resultaat.nextSet && resultaat.nextSet.action === E.SET_ACTION.STOP_EXERCISE;

  if (moetStoppen) {
    kaartState.pijnGestopt = true;
    sluitOefeningAf(idx, o, config, kaartState); // ook een gestopte oefening krijgt een beslissing en samenvatting
  } else if (setN >= numSets) {
    sluitOefeningAf(idx, o, config, kaartState);
  } else {
    kaartState.actieveSet = setN + 1;
  }

  bewaarSessieVoortgang();
  herteken();
}

function renderOefeningKaart(o, idx) {
  const isSkill = o.type === 'skill';
  const isTijd = o.eenheid === 'sec'; // expliciet per oefening bepaald, niet aangenomen op basis van categorie
  const numSets = aantalSetsVoor(parseInt((o.target.match(/^(\d+)×/) || [null, 3])[1]));
  const bewaard = logData[idx] || {};
  const holdSeconden = timerSeconden(o); // de hold-timer krijgt hier verderop +5 sec om in positie te komen
  const rustSec = rustSeconden(o);
  const timerKey = `ex_${idx}`;
  const rustTimerKey = `rust_${idx}`;

  let setsHtml = '';
  const repsWielIds = [];
  const gewichtWielIds = [];
  for (let s = 1; s <= numSets; s++) {
    const bewaardeReps = bewaard.sets && bewaard.sets[s] ? bewaard.sets[s].reps : '';
    const bewaardeGewicht = bewaard.sets && bewaard.sets[s] ? bewaard.sets[s].gewicht : (o.gewicht || 0);
    const repsWielId = `reps_${s}`;
    repsWielIds.push(repsWielId);
    const repsMax = isTijd ? 120 : 30;
    const repsStart = bewaardeReps !== '' ? bewaardeReps : 0;
    const gewichtWielId = `gewicht_${s}`;
    if (!isSkill) gewichtWielIds.push(gewichtWielId);
    setsHtml += `
      <div class="set-blok">
        <div class="set-blok-titel">Set ${s}</div>
        <div class="set-blok-rij">
          <div class="wiel-paneel reps-paneel">
            <div class="wiel-paneel-titel">${isTijd ? 'Seconden' : 'Reps'}</div>
            ${renderDraaiwiel(repsWielId, repsStart, repsMax, isTijd ? 'sec' : 'reps', 'horizontaal', 1)}
          </div>
          ${!isSkill ? `
          <div class="wiel-paneel gewicht-paneel">
            <div class="wiel-paneel-titel">Gewicht</div>
            ${renderDraaiwiel(gewichtWielId, bewaardeGewicht, 20, 'kg', 'verticaal', 0.5)}
          </div>` : ''}
        </div>
      </div>
    `;
  }

  // Draaiwielen initialiseren zodra de kaart in de DOM staat: events koppelen
  // én de strook direct op de juiste startpositie zetten (geen trilling bij init).
  setTimeout(() => [...repsWielIds, ...gewichtWielIds].forEach(id => {
    draaiwielInit(id);
    const strook = document.getElementById(`strook_${id}`);
    if (strook) draaiwielUpdateVisueel(id, parseFloat(strook.dataset.value), false);
  }), 0);

  const pijnGekozen = !!setModusPijnKeuze[`ex_${idx}`];
  const exCfg = bouwEngineConfig(o);
  const testMelding = haalOfMaakSetModusState(idx).exerciseState.awaitingTest === true && exCfg.type === 'hold'
    ? `<div class="sv-niveau">Er staat een testpoging gepland voor deze oefening. Die kan alleen in setmodus (Instellingen → beoordelingsmodus).</div>` : '';

  return `
    <div class="log-ex log-ex-single">
      <div class="ex-title">${o.naam}</div>
      <div class="ex-target">Target: ${o.target}</div>
      ${testMelding}
      ${setsHtml}
      <div class="dual-select">
        <div>
          <label class="field-label">RIR</label>
          <select id="rir_sel">
            ${RIR_OPTIES.map(r => `<option value="${r.waarde}" ${bewaard.rir === r.waarde ? 'selected' : ''}>${r.label}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="field-label">Vorm</label>
          <select id="vorm_sel">
            ${VORM_OPTIES.map(v => `<option value="${v.waarde}" ${bewaard.vorm === v.waarde ? 'selected' : ''}>${v.label}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="pijn-schakelaar-rij">
        <label class="field-label">Pijn tijdens deze oefening</label>
        <div class="switch ${pijnGekozen ? 'on' : ''}" onclick="wisselSetModusPijn('ex_${idx}')"><div class="knob"></div></div>
      </div>
      ${renderTimerBlock(timerKey, holdSeconden ? holdSeconden + 5 : holdSeconden, 'Hold-timer', 5)}
      ${renderTimerBlock(rustTimerKey, rustSec, 'Rust-timer')}
    </div>
  `;
}

function bewaarHuidigeKaart() {
  const item = logOefeningen[logIndex];
  if (!item) return;
  if (item.type === 'warmup' || item.type === 'cooldown') return; // niets te loggen
  // Setmodus-kaarten worden per set gespiegeld (spiegelNaarLogData); de wielen van de
  // exercise-modus bestaan daar niet en zouden de gelogde sets met een lege kaart overschrijven.
  const kaart = setModusPerKaart[logIndex];
  if (kaart && kaart.modus === 'set') return;
  if (samenvattingIdx === logIndex) return; // tussenscherm: geen invoerelementen in de DOM
  const numSets = parseInt((item.target.match(/^(\d+)×/) || [null, 3])[1]);
  const sets = {};
  for (let s = 1; s <= numSets; s++) {
    const repsEl = document.getElementById(`reps_${s}`);
    const gewichtEl = document.getElementById(`gewicht_${s}`);
    if (!repsEl) continue;
    sets[s] = {
      reps: repsEl.value,
      gewicht: item.type === 'skill' ? null : (gewichtEl ? parseFloat(gewichtEl.value) : null)
    };
  }
  const rirEl = document.getElementById('rir_sel');
  const vormEl = document.getElementById('vorm_sel');
  const notitieEl = document.getElementById(`notitie_${logIndex}`);
  logData[logIndex] = {
    sets,
    rir: rirEl ? rirEl.value : null,
    vorm: vormEl ? vormEl.value : null,
    pijn: !!setModusPijnKeuze[`ex_${logIndex}`],
    notitie: notitieEl ? notitieEl.value : ''
  };
}

/**
 * Exercise-modus via het nieuwe engine-datamodel (opdracht §6 "Modus EXERCISE"
 * + §14.3): kopieert dezelfde rir/vorm/pijn naar elke werkset, classificeert
 * iedere set apart via evaluateSet(), en roept aan het eind evaluateExercise()
 * aan — exact hetzelfde pad als setmodus, alleen is de invoer al in één keer
 * voor de hele oefening verzameld in plaats van per set. Schrijft ERNAAST
 * (niet in plaats van) de bestaande "logs"-opslag naar sets/decisions.
 * Wordt aangeroepen VOORDAT bewaarHuidigeKaart() de kaart-index ophoogt.
 */
function verwerkExerciseModusViaEngine(idx) {
  const item = logOefeningen[idx];
  if (!item || item.type === 'warmup' || item.type === 'cooldown') return false;
  const ingevuld = logData[idx];
  if (!ingevuld || !ingevuld.rir || !ingevuld.vorm) return false; // niets ingevuld, of RIR/vorm nog leeg
  const E = window.ProgressieEngine;
  if (!E || !huidigeSessionId) return false;

  const config = bouwEngineConfig(item);
  const exerciseId = exerciseIdVoor(item, config);
  const kaartState = haalOfMaakSetModusState(idx);
  if (kaartState.modus === 'set') return false; // setmodus beoordeelt zelf, per set

  // Voorkomt dubbele verwerking bij Vorige -> Volgende zonder wijziging: de engine kent de
  // vorige aanroep niet, dus deze laag houdt per invoer-signature bij wat al verwerkt is.
  const invoerSignature = JSON.stringify({ sets: ingevuld.sets, rir: ingevuld.rir, vorm: ingevuld.vorm, pijn: ingevuld.pijn });
  if (kaartState._laatstVerwerkteSignature === invoerSignature) return false;

  const setNummers = Object.keys(ingevuld.sets || {}).map(n => parseInt(n)).sort((a, b) => a - b);
  const geclassificeerd = [];
  setNummers.forEach(setN => {
    const setInvoer = ingevuld.sets[setN];
    const data = {
      n: setN,
      type: 'werk',
      reps: config.type === 'hold' ? null : parseFloat(setInvoer.reps),
      holdSec: config.type === 'hold' ? parseFloat(setInvoer.reps) : null, // reps-veld bevat bij 'sec'-oefeningen de seconden
      load: setInvoer.gewicht,
      assist: 0,
      rir: rirNaarGetal(ingevuld.rir),
      form: vormNaarEngine(ingevuld.vorm),
      pain: !!ingevuld.pijn,
      restSec: null,
      setClass: null,
      ratedAt: Date.now()
    };
    const eerdereSets = geclassificeerd.map(s => ({ setClass: s.setClass, reps: s.data.reps, holdSec: s.data.holdSec, rir: s.data.rir, form: s.data.form, load: s.data.load }));
    const resultaat = E.evaluateSet(config, kaartState.exerciseState, eerdereSets, data);
    if (resultaat.valid === false) return; // ongeldige invoer: deze set overslaan i.p.v. de hele oefening te laten stuklopen
    data.setClass = resultaat.setClass;
    data.restSec = resultaat.nextSet ? resultaat.nextSet.restSec : null;
    resultaat._idx = idx;
    geclassificeerd.push({ data, setClass: resultaat.setClass, resultaat, ui: { rir: ingevuld.rir, vorm: ingevuld.vorm } });
  });
  if (geclassificeerd.length === 0) return false;
  kaartState._laatstVerwerkteSignature = invoerSignature;

  const vorige = kaartState.uitkomst;
  const revisie = (vorige ? vorige.revisie : 0) + 1;
  if (vorige && vorige.keuze) toast('Invoer gewijzigd: je eerdere bevestiging of overrule voor deze oefening vervalt');
  const vorigeSetIds = kaartState.setDecisionIds || {};
  const nieuweSetIds = {};
  kaartState.geclassificeerdeSets = geclassificeerd;
  kaartState.actieveSet = geclassificeerd.length + 1;

  if (window.firebaseProgressie) {
    geclassificeerd.forEach(s => {
      const setN = s.data.n;
      const basis = `${huidigeSessionId}_${exerciseId}_set${setN}`;
      const decisionId = revisieId(basis, revisie);
      nieuweSetIds[setN] = decisionId;
      s.resultaat._decisionId = decisionId;
      // De set zelf is ruwe invoer: de laatste versie telt (zelfde id, overschreven).
      window.firebaseProgressie.slaSetOp(huidigeSessionId, exerciseId, setN, s.data).catch(opslagFout('set'));
      const record = E.buildDecisionRecord({
        exerciseId, sessionId: huidigeSessionId, setId: decisionId,
        decisionType: 'SET', inputSnapshot: s.data, result: JSON.parse(JSON.stringify(s.resultaat)), accepted: null
      });
      record.configSnapshot = configSnapshotVan(config);
      record.revisie = revisie;
      record.supersedes = vorigeSetIds[setN] || null;
      record.vervangenDoor = null;
      window.firebaseProgressie.slaDecisionOp(decisionId, record).catch(opslagFout('set-beslissing'));
      if (vorigeSetIds[setN]) markeerVervangen(vorigeSetIds[setN], decisionId);
    });
  }
  kaartState.setDecisionIds = nieuweSetIds;

  const gelukt = sluitOefeningAf(idx, item, config, kaartState);
  bewaarSessieVoortgang();
  return gelukt;
}

function logVolgende() {
  bewaarHuidigeKaart();
  if (verwerkExerciseModusViaEngine(logIndex)) {
    // Eerst de samenvatting van deze oefening laten zien; "Volgende" op dat scherm gaat verder.
    samenvattingIdx = logIndex;
    renderLogKaart();
    window.scrollTo(0, 0);
    return;
  }
  logIndex++;
  renderLogKaart();
  window.scrollTo(0, 0);
}

function logVorige() {
  bewaarHuidigeKaart();
  verwerkExerciseModusViaEngine(logIndex); // ook bij teruggaan beoordelen, anders gaat de invoer van deze kaart onverwerkt weg
  logIndex--;
  renderLogKaart();
  window.scrollTo(0, 0);
}

let afrondenBezig = false;
async function logAfronden() {
  if (afrondenBezig) return;
  bewaarHuidigeKaart();
  if (verwerkExerciseModusViaEngine(logIndex)) {
    samenvattingIdx = logIndex;
    renderLogKaart();
    window.scrollTo(0, 0);
    return;
  }
  afrondenBezig = true;
  const knop = document.querySelector('.log-nav .btn.primary');
  if (knop) { knop.disabled = true; knop.textContent = 'Opslaan…'; }
  const dagId = huidigLogDag.id;
  const uitkomst = await bewaarTrainingInFirestore();
  afrondenBezig = false;
  if (uitkomst === 'fout') {
    // Niets resetten: de training blijft open en alles kan veilig opnieuw (vaste id's, geen dubbele data).
    toast('Opslaan mislukt — check je internetverbinding en probeer opnieuw');
    renderLogKaart();
    return;
  }
  toast(uitkomst === 'ok' ? 'Training opgeslagen ✓' : 'Geen verbinding bevestigd — sluit de app nog niet; het wordt opgeslagen zodra er weer verbinding is');
  geefWakeLockVrij();
  // Actieve timers stoppen zodat er geen lopende intervals achterblijven.
  Object.values(timerState).forEach(s => { if (s.intervalId) clearInterval(s.intervalId); });
  huidigeSessionId = null;
  resetSessieHulpstate();
  huidigLogDag = null;
  logData = {};
  logIndex = 0;
  timerState = {};
  uitlegOpen = {};
  noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() };
  noodKeuzeActief = false;
  setTimeout(() => go('trainen/' + dagId), 900);
}

/**
 * Schrijft elke gelogde oefening als los document naar de Firestore-collectie "logs".
 * Eén document per oefening (niet per hele training) zodat de progressie-pagina
 * makkelijk kan filteren op oefeningNaam zonder door geneste sets te hoeven zoeken.
 * @param {Object} dag - het dag-object (voor dagId/dagNaam op elk document)
 * @param {Array} oefeningen - logOefeningen: de kaarten van de sessie
 * @param {Object} data - logData: per kaart-index de ingevulde sets/rir/vorm
 * @returns {Promise}
 */
function slaLogDataOpInFirestore(dag, oefeningen, data, sessionId) {
  if (!window.firebaseDb || !window.firebaseAuth || !window.firebaseAuth.huidigeUser()) {
    return Promise.reject(new Error('Niet ingelogd of Firebase niet geladen'));
  }
  const schrijfacties = [];
  oefeningen.forEach((item, idx) => {
    if (item.type === 'warmup' || item.type === 'cooldown') return; // geen sets, niets op te slaan
    const ingevuld = data[idx];
    if (!ingevuld) return; // deze kaart is nooit bezocht/ingevuld
    const setsArray = Object.keys(ingevuld.sets || {}).map(setNr => ({
      set: parseInt(setNr),
      reps: ingevuld.sets[setNr].reps,
      gewicht: ingevuld.sets[setNr].gewicht
    }));
    if (setsArray.length === 0) return;
    // sessionId (nieuw, additief) koppelt dit log aan de sets en beslissingen van dezelfde training;
    // met een vast id per sessie + kaart is opnieuw proberen na een mislukte poging veilig.
    const logDoc = {
      dagId: dag.id,
      dagNaam: dag.naam,
      oefeningNaam: item.naam,
      oefeningType: item.type,
      sets: setsArray,
      rir: ingevuld.rir,
      vorm: ingevuld.vorm,
      notitie: ingevuld.notitie || ''
    };
    if (sessionId) logDoc.sessionId = sessionId;
    schrijfacties.push(window.firebaseDb.voegLogToe(logDoc, sessionId ? `${sessionId}_k${idx}` : undefined));
  });
  return Promise.all(schrijfacties);
}

/**
 * Geeft de HTML voor het overlap-waarschuwingslabel, of een lege string bij "none"
 * of wanneer dit de al-gekozen optie zelf is (die staat al duidelijk gemarkeerd via
 * de 'gekozen'-stijl en hoeft niet ook nog als overlappend met zichzelf getoond te
 * worden — dat zou verwarrend ogen naast de groene selectie-rand).
 * @param {OverlapLevel} overlapLevel
 * @param {boolean} isGekozen
 * @returns {string}
 */
/**
 * Geeft de HTML voor het overlap-waarschuwingslabel, of een lege string bij "none"
 * of wanneer dit de al-gekozen optie zelf is (die staat al duidelijk gemarkeerd via
 * de 'gekozen'-stijl en hoeft niet ook nog als overlappend met zichzelf getoond te
 * worden — dat zou verwarrend ogen naast de goud omlijnde selectie).
 * @param {OverlapLevel} overlapLevel
 * @param {boolean} isGekozen
 * @returns {string}
 */
/**
 * Geeft de HTML voor het overlap-waarschuwingslabel, of een lege string bij "none".
 * Dit blijft ook zichtbaar op de al-gekozen optie — die info verdwijnt niet zodra je
 * een keuze maakt, want de gouden selectie-rand (zie overlapRandKlasse/CSS) blijft
 * los daarvan het primaire "dit is je keuze"-signaal.
 * @param {OverlapLevel} overlapLevel
 * @returns {string}
 */
