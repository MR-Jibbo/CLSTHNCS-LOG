<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calisthenics Log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
  // Firebase — modulaire SDK via CDN, geen build-stap nodig.
  // Functies worden op window gehangen zodat het niet-module app.js ze kan aanroepen.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, setPersistence, inMemoryPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVqFc5bCk_zTEfpMk7fzZZcu2HodMTCzA",
    authDomain: "clsthenics-log.firebaseapp.com",
    projectId: "clsthenics-log",
    storageBucket: "clsthenics-log.firebasestorage.app",
    messagingSenderId: "297564612866",
    appId: "1:297564612866:web:0b815d6283c0b34de67a1b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Geen sessie-persistentie: de inlogstatus wordt nergens opgeslagen (niet in
  // localStorage, niet in IndexedDB), dus elke keer dat de pagina wordt geladen
  // (ook na een harde refresh of het heropenen van het tabblad) moet er opnieuw
  // worden ingelogd. Firebase's standaardgedrag (browserLocalPersistence) zou de
  // sessie juist tussen bezoeken onthouden — dat is hier bewust uitgezet.
  const authKlaar = setPersistence(auth, inMemoryPersistence).catch(() => {});

  window.firebaseAuth = {
    signIn: (email, wachtwoord) => authKlaar.then(() => signInWithEmailAndPassword(auth, email, wachtwoord)),
    signOut: () => signOut(auth),
    onChange: (callback) => authKlaar.then(() => onAuthStateChanged(auth, callback)),
    huidigeUser: () => auth.currentUser
  };

  window.firebaseDb = {
    voegLogToe: (data) => addDoc(collection(db, "logs"), { ...data, aangemaaktOp: serverTimestamp() }),
    haalLogsOp: async (oefeningNaam) => {
      const q = query(
        collection(db, "logs"),
        where("oefeningNaam", "==", oefeningNaam),
        orderBy("aangemaaktOp", "asc")
      );
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    },
    haalAlleLogsOp: async () => {
      const q = query(collection(db, "logs"), orderBy("aangemaaktOp", "asc"));
      const snap = await getDocs(q);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
  };

  // Meldt app.js dat Firebase klaar is, voor het geval de rest van de pagina daarop wacht.
  window.dispatchEvent(new Event('firebase-klaar'));
</script>
<style>

  /* Het Reps/Seconden-paneel is horizontaal en heeft veel meer breedte nodig
     dan het smalle, verticale Gewicht-paneel om zijn schaal leesbaar te tonen. */

  .wiel-paneel-titel {
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);

  }

  .lineaal-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    flex: 1;
  }

  /* Venster centreert verticaal in de beschikbare ruimte (tussen titel en waarde-badge),
     de waarde-badge blijft daaronder aan de onderkant van het paneel staan. */
  .lineaal-wrap .lineaal-venster {
    margin-top: auto;
    margin-bottom: auto;
  }

  .lineaal-wrap .draaiwiel-waarde {
    margin-top: auto;
  }

  .lineaal-venster {
    position: relative;
    width: 100%;
    max-width: 200px;
    height: 40px;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .lineaal-venster:active { cursor: grabbing; }

  .lineaal-strook {
    position: absolute;
    top: 0;
    left: 50%;
    height: 100%;
    will-change: transform;
    pointer-events: none;
  }

  .lineaal-strook.snappen {
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .lineaal-tik {
    position: absolute;
    bottom: 12px;
    width: 1px;
    height: 8px;
    background: var(--border);
    transform: translateX(-50%);
  }

  .lineaal-tik.groot {
    height: 14px;
    width: 1px;
    background: var(--text-dim);
  }

  .lineaal-cijfer {
    position: absolute;
    bottom: 0;
    font-family: 'SF Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    transform: translateX(-50%);
  }

  .lineaal-wijzer {
    position: absolute;
    left: 50%;
    top: 0;
    width: 2px;
    height: 26px;
    background: var(--gold);
    transform: translateX(-50%);
    z-index: 3;
    border-radius: 2px;
    pointer-events: none;
  }

  .lineaal-wijzer::after {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-top: 4px solid var(--gold);
  }

  .lineaal-fade {
    position: absolute;
    top: 0;
    width: 26px;
    height: 40px;
    z-index: 2;
    pointer-events: none;
  }

  .lineaal-fade-l { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
  .lineaal-fade-r { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }

  /* ===== Verticale variant (gewicht) — zelfde onderdelen, 90 graden gedraaid ===== */
  .lineaal-wrap.verticaal .lineaal-venster {
    width: 40px;
    height: 130px;
    max-width: none;
  }

  .lineaal-wrap.verticaal .lineaal-strook {
    top: 50%;
    left: 0;
    width: 100%;
    height: auto;
  }

  .lineaal-wrap.verticaal .lineaal-tik {
    bottom: auto;
    right: 12px;
    left: auto;
    top: 0;
    width: 8px;
    height: 1px;
    transform: translateY(-50%);
  }

  .lineaal-wrap.verticaal .lineaal-tik.groot {
    width: 14px;
    height: 1px;
  }

  .lineaal-wrap.verticaal .lineaal-cijfer {
    bottom: auto;
    right: -1px;
    left: auto;
    top: 0;
    transform: translateY(-50%);
  }

  .lineaal-wrap.verticaal .lineaal-wijzer {
    left: 0;
    top: 50%;
    width: 26px;
    height: 2px;
    border-radius: 0 1px 1px 0;
    transform: translateY(-50%);
  }

  .lineaal-wrap.verticaal .lineaal-wijzer::after {
    top: 50%;
    left: -4px;
    transform: translateY(-50%);
    border-left: none;
    border-top: 3px solid transparent;
    border-bottom: 3px solid transparent;

const OEFENING_EENHEID = {};
const ALLE_OEFENINGEN = (() => {
  const namen = new Set();
  SCHEMA.dagen.forEach(dag => {
    [...(dag.strength || []), ...(dag.hypertrophy || []), ...(dag.legs || [])].forEach(o => {
      if (o.trackable) {
        namen.add(o.naam);
        OEFENING_EENHEID[o.naam] = { eenheid: o.eenheid || 'reps', heeftGewicht: true };
      }
    });
    if (dag.skill && dag.skill.oefeningen) {
      dag.skill.oefeningen.forEach(o => {
        namen.add(o.naam);
        OEFENING_EENHEID[o.naam] = { eenheid: o.eenheid || 'sec', heeftGewicht: false };
      });
    }
  });
  return Array.from(namen);
})();

/**
 * Zoekt de spiergroep-tags van een oefening op naam (case-insensitive, met
 * gedeeltelijke match) zodat de bestaande NOODVERSIE_KEUZES-objecten — die
 * geen id-veld hebben — hieraan gekoppeld kunnen worden zonder elk object
 * handmatig te hoeven aanpassen.
 * @param {string} naam
 * @returns {Exercise | null}
 */
function vindExerciseData(naam) {
  if (!naam) return null;
  const genormaliseerd = naam.toLowerCase();
  // Eerst een exacte match proberen, dan een "bevat"-match (voor namen met extra
  // toevoegingen zoals "Deficit pike push-ups (voeten op stoel/bed, handen op boeken)").
  let gevonden = EXERCISES.find(e => e.name.toLowerCase() === genormaliseerd);
  if (gevonden) return gevonden;
  gevonden = EXERCISES.find(e =>
    genormaliseerd.startsWith(e.name.toLowerCase()) || genormaliseerd.includes(e.name.toLowerCase())
  );
  return gevonden || null;
}

<script>
// ============================================================
// MUSCLE-OVERLAP FILTER — pure, unit-testbare logica.
// Geen DOM-toegang, geen globale state-mutatie: alleen input in, nieuwe array uit.
// ============================================================

/**
 * @typedef {"none"|"moderate"|"high"} OverlapLevel
 *
 * @typedef {Object} HitMuscles
 * @property {Set<string>} primary   - spiergroepen die in eerdere stappen al ZWAAR
 *                                      belast zijn (kwamen voor in een primaryMuscles-lijst
 *                                      van een eerder gekozen oefening)
 * @property {Set<string>} secondary - spiergroepen die in eerdere stappen al LICHT/MATIG
 *                                      belast zijn (kwamen voor in een secondaryMuscles-lijst)
 */

/**
 * Bepaalt voor elke kandidaat-oefening hoeveel overlap die heeft met wat er in
 * eerdere stappen van de noodversie-flow al belast is, en sorteert de minst
 * overlappende opties naar boven. Verbergt nooit iets — dit is puur sortering
 * plus een label, nooit een blokkade.
 *
 * Overlap-niveau van een kandidaat wordt bepaald door zijn EIGEN primaryMuscles
 * (de spieren die déze oefening zwaar belast) te vergelijken met wat al belast is:
 *   - "high"     zodra minstens één van de primaryMuscles van de kandidaat al in
 *                hitMuscles.primary zit (je zou twee keer zwaar op dezelfde
 *                spiergroep stapelen — de zwaarst mogelijke overlap)
 *   - "moderate" zodra dat niet zo is, maar minstens één primaryMuscle van de
 *                kandidaat wel in hitMuscles.secondary zit (die spiergroep werkte
 *                al licht/matig mee, dus is niet volledig fris meer)
 *   - "none"     als geen van beide geldt
 *
 * @param {Exercise[]} allOptions
 * @param {HitMuscles} hitMuscles
 * @returns {(Exercise & { overlapLevel: OverlapLevel })[]} nieuwe array, "none" eerst
 */
function getFilteredOptions(allOptions, hitMuscles) {
  const OVERLAP_VOLGORDE = { none: 0, moderate: 1, high: 2 };

  const metOverlapNiveau = allOptions.map(exercise => {
    const overlapLevel = bepaalOverlapNiveau(exercise, hitMuscles);
    return { ...exercise, overlapLevel };
  });

  // .sort() is in-place op de NIEUWE array uit .map(), dus de input-array
  // (allOptions) wordt niet gemuteerd — dat hoort bij "pure functie".
  return metOverlapNiveau.sort((a, b) => OVERLAP_VOLGORDE[a.overlapLevel] - OVERLAP_VOLGORDE[b.overlapLevel]);
}

/**
 * @param {Exercise} exercise
 * @param {HitMuscles} hitMuscles
 * @returns {OverlapLevel}
 */
function bepaalOverlapNiveau(exercise, hitMuscles) {
  const overlaptMetPrimary = exercise.primaryMuscles.some(spier => hitMuscles.primary.has(spier));
  if (overlaptMetPrimary) return "high";

  const overlaptMetSecondary = exercise.primaryMuscles.some(spier => hitMuscles.secondary.has(spier));
  if (overlaptMetSecondary) return "moderate";

  return "none";
}

/**
 * Voegt de spiergroepen van een gekozen oefening toe aan de cumulatieve hitMuscles-state.
 * Geeft een NIEUW HitMuscles-object terug (muteert de input niet), zodat de aanroeper
 * expliciet kan kiezen om de state bij te werken — dit past bij hoe de rest van de
 * noodversie-flow (kiesNoodSkill, kiesNoodStrength, ...) al werkt: elke keuze-functie
 * herschrijft het relevante deel van de noodKeuze-state en rendert opnieuw.
 *
 * @param {HitMuscles} hitMuscles
 * @param {Exercise} gekozenExercise
 * @returns {HitMuscles}
 */
function voegOefeningToeAanHitMuscles(hitMuscles, gekozenExercise) {
  const nieuwePrimary = new Set(hitMuscles.primary);
  const nieuweSecondary = new Set(hitMuscles.secondary);
  gekozenExercise.primaryMuscles.forEach(spier => nieuwePrimary.add(spier));
  gekozenExercise.secondaryMuscles.forEach(spier => nieuweSecondary.add(spier));
  return { primary: nieuwePrimary, secondary: nieuweSecondary };
}

/** @returns {HitMuscles} een lege hitMuscles-state, voor het begin van een nieuwe noodversie-sessie */
function leegHitMuscles() {
  return { primary: new Set(), secondary: new Set() };
}

<script>

const app = document.getElementById('app');
const crumbEl = document.getElementById('crumb');
const titleEl = document.getElementById('pageTitle');
const subEl = document.getElementById('pageSub');

let ingelogd = false; // placeholder — wordt vervangen door echte Firebase Auth state
let actieveChart = null;
let huidigLogDag = null;
let pendingVerlaatHash = null; // welke navigatie wacht op bevestiging via de verlaat-popup
let noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() }; // gemaakte keuzes voor de noodversie
let noodKeuzeActief = false; // true zodra het keuzescherm is geopend, tot de sessie eindigt
let huidigProgressieOefening = ALLE_OEFENINGEN[0];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setHeader(title, sub, crumbs) {
  titleEl.textContent = title;
  subEl.textContent = sub;
  crumbEl.innerHTML = '';
  if (crumbs && crumbs.length) {
    crumbs.forEach((c, i) => {
      const b = document.createElement('button');
      b.textContent = c.label;
      b.onclick = c.action;
      crumbEl.appendChild(b);
      if (i < crumbs.length - 1) {
        const sep = document.createElement('span');
        sep.textContent = '/';
        sep.style.opacity = '0.4';
        crumbEl.appendChild(sep);
      }
    });
  }
}

// ============================================================
// ROUTING
// ============================================================
function route() {
  // Niet ingelogd? Dan zie je alleen het loginscherm — ongeacht welke hash er in de
  // URL staat. Zodra je bent ingelogd, wordt de daadwerkelijk bedoelde pagina getoond
  // (zie doLogin, die na een geslaagde login route() opnieuw aanroept).
  if (!ingelogd) return renderLoginScherm();

  const hash = window.location.hash.slice(1) || 'home';
  const parts = hash.split('/');

  if (parts[0] === 'home') return renderHome();
  if (parts[0] === 'trainen' && !parts[1]) return renderTrainenMenu();
  if (parts[0] === 'trainen' && parts[1]) return renderDagDetail(parts[1]);
  if (parts[0] === 'loggen' && parts[1]) return renderLoggen(parts[1]);
  if (parts[0] === 'progressie' && !parts[1]) return renderProgressieOverzicht();
  if (parts[0] === 'progressie' && parts[1]) return renderProgressieDetail(decodeURIComponent(parts[1]));
  renderHome();
}

let laatsteBevestigdeHash = window.location.hash;

window.addEventListener('hashchange', () => {
  const nieuweHash = window.location.hash;
  // Browser-terug/vooruit verandert de hash al vóórdat we kunnen ingrijpen.
  // Bij een actieve logsessie zetten we de hash terug en tonen we de popup;
  // pas na bevestiging (opslaan of verwerpen) laten we de nieuwe hash staan.
  if (huidigLogDag && verlaatVereistBevestiging(nieuweHash.slice(1))) {
    history.pushState(null, '', laatsteBevestigdeHash);
    toonVerlaatPopup(nieuweHash.slice(1));
    return;
  }
  laatsteBevestigdeHash = nieuweHash;
  route();
});

function go(hash) {
  if (verlaatVereistBevestiging(hash)) {
    toonVerlaatPopup(hash);
    return;
  }
  laatsteBevestigdeHash = '#' + hash;
  window.location.hash = hash;
}

// Bepaalt of het weggaan van de huidige route een actieve, onafgeronde
// logsessie zou onderbreken. Binnen dezelfde logsessie blijven (bv. van
// kaart naar kaart, dat loopt niet via go()) hoeft niet bevestigd te worden.
function verlaatVereistBevestiging(doelHash) {
  if (!huidigLogDag) return false;
  // Naar dezelfde logging-flow gaan (zou hier normaliter niet gebeuren) telt niet als verlaten
  if (doelHash === `loggen/${huidigLogDag.id}`) return false;
  return true;
}

function toonVerlaatPopup(doelHash) {
  pendingVerlaatHash = doelHash;
  document.getElementById('verlaatPopup').classList.add('show');
}

function sluitVerlaatPopup() {
  document.getElementById('verlaatPopup').classList.remove('show');
  pendingVerlaatHash = null;
}

function verlaatPopupOpslaanEnGa() {
  bewaarHuidigeKaart();
  Object.values(timerState).forEach(s => { if (s.intervalId) clearInterval(s.intervalId); });
  slaLogDataOpInFirestore(huidigLogDag, logOefeningen, logData)
    .then(() => toast('Voortgang opgeslagen ✓'))
    .catch(() => toast('Opslaan mislukt — check je internetverbinding'));
  const doel = pendingVerlaatHash;
  huidigLogDag = null;
  logData = {};
  logIndex = 0;
  timerState = {};
  uitlegOpen = {};
  noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() };
  noodKeuzeActief = false;
  document.getElementById('verlaatPopup').classList.remove('show');
  pendingVerlaatHash = null;
  laatsteBevestigdeHash = '#' + doel;
  window.location.hash = doel;
}

function verlaatPopupZonderOpslaan() {
  Object.values(timerState).forEach(s => { if (s.intervalId) clearInterval(s.intervalId); });
  const doel = pendingVerlaatHash;
  huidigLogDag = null;
  logData = {};
  logIndex = 0;
  timerState = {};
  uitlegOpen = {};
  noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() };
  noodKeuzeActief = false;
  document.getElementById('verlaatPopup').classList.remove('show');
  pendingVerlaatHash = null;

}

// Browser terugknop / sluiten van het tabblad
window.addEventListener('beforeunload', (e) => {

// ============================================================
// TIMER — herbruikbare aftel-timer met ring-visualisatie
// ============================================================
let timerState = {}; // per kaart-index: { actief, resterend, totaal, intervalId, done }
let uitlegOpen = {}; // per kaart-index: true/false — of het uitleg-blok is uitgeklapt

function timerSeconden(item) {
  // Haalt seconden uit een target-string zoals "3×15 sec" of "40–45 sec"
  if (item.sec) return item.sec;
  const target = item.target || '';
  const match = target.match(/(\d+)(?:–(\d+))?\s*sec/);
  if (!match) return null;
  const laag = parseInt(match[1]);
  const hoog = match[2] ? parseInt(match[2]) : laag;
  return Math.round((laag + hoog) / 2);
}

function rustSeconden(item) {
  // Haalt de rusttijd tussen sets uit item.rust, bv. "150 sec", "90–120 sec", of "—" (geen rust)
  const rust = item.rust || '';
  const match = rust.match(/(\d+)(?:–(\d+))?\s*sec/);
  if (!match) return null;
  const laag = parseInt(match[1]);
  const hoog = match[2] ? parseInt(match[2]) : laag;
  return Math.round((laag + hoog) / 2);
}

function parseSetsEnTijd(target) {
  // Haalt uit een target-string zowel het aantal sets als de tijd PER SET.
  // "2×20–30 sec" -> { sets: 2, secPerSet: 25 }
  // "2×30 sec"    -> { sets: 2, secPerSet: 30 }
  // "4 per kant"  -> null (geen tijd-component, dit zijn geen sets-met-seconden)
  if (!target) return null;
  const match = target.match(/^(\d+)\s*×\s*(\d+)(?:–(\d+))?\s*sec/);
  if (!match) return null;
  const sets = parseInt(match[1]);
  const laag = parseInt(match[2]);
  const hoog = match[3] ? parseInt(match[3]) : laag;
  const secPerSet = Math.round((laag + hoog) / 2);
  return { sets, secPerSet };
}

function renderTimerBlock(key, seconden, label) {
  if (!seconden) return '';
  const state = timerState[key] || { actief: false, resterend: seconden, totaal: seconden, done: false };
  timerState[key] = state;
  const labelTekst = label || 'Timer';

  return `
    <div class="timer-box">
      <div class="timer-toggle" onclick="toggleTimerVisible('${key}')">
        <span class="tt-label">⏱ ${labelTekst}${state.toonTimer ? ' verbergen' : ` · ${seconden}s`}</span>
        <div class="switch ${state.toonTimer ? 'on' : ''}"><div class="knob"></div></div>
      </div>
      ${state.toonTimer ? renderTimerRing(key) : ''}
    </div>
  `;
}

function renderTimerRing(key) {
  const s = timerState[key];
  const r = 52;
  const circumference = 2 * Math.PI * r;
  const progressFrac = s.resterend / s.totaal;
  const offset = circumference * (1 - progressFrac);
  const mm = Math.floor(s.resterend / 60);
  const ss = s.resterend % 60;
  const tijdLabel = `${mm}:${String(ss).padStart(2, '0')}`;

  return `
    <div class="timer-ring-wrap ${s.done ? 'done' : ''}" id="ring_${key}">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="timer-ring-bg" cx="60" cy="60" r="${r}"/>
        <circle class="timer-ring-fg" cx="60" cy="60" r="${r}"
          stroke-dasharray="${circumference}"
          stroke-dashoffset="${offset}"/>
      </svg>
      <div class="time" id="time_${key}">${tijdLabel}</div>
    </div>
    <div class="timer-controls">
      <button onclick="timerStartPause('${key}')" id="btn_${key}">${s.actief ? 'Pauze' : (s.resterend === s.totaal ? 'Start' : 'Hervat')}</button>
      <button onclick="timerReset('${key}')">Reset</button>
    </div>
  `;
}

function toggleTimerVisible(key) {
  const s = timerState[key];
  s.toonTimer = !s.toonTimer;
  herteken();
}

// Eén hergebruikte AudioContext, aangemaakt/ontgrendeld op een echte tik van de gebruiker
// (bv. de Start-knop van een timer). Safari op iOS staat geluid alleen toe als de context
// binnen zo'n user-gesture ontstaat — een context die pas ontstaat wanneer de timer afloopt
// (via setInterval) wordt door Safari geweigerd, ook al probeert 'ie meteen te spelen.
let gedeeldeAudioCtx = null;

function ontgrendelAudio() {
  if (gedeeldeAudioCtx) {
    // Als de context om een andere reden gepauzeerd is geraakt, hervat 'm binnen de gesture.
    if (gedeeldeAudioCtx.state === 'suspended') gedeeldeAudioCtx.resume();
    return;
  }
  try {
    gedeeldeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { /* geluid niet beschikbaar op dit toestel, geen probleem */ }
}

function timerStartPause(key) {
  const s = timerState[key];
  if (s.actief) {
    clearInterval(s.intervalId);
    s.actief = false;
  } else {
    if (s.resterend <= 0) return;
    ontgrendelAudio(); // binnen deze klik — dit is de user-gesture die Safari vereist
    s.actief = true;
    s.intervalId = setInterval(() => {
      s.resterend--;
      if (s.resterend <= 0) {
        s.resterend = 0;
        s.actief = false;
        s.done = true;
        clearInterval(s.intervalId);
        timerAfgerond();
      }
      updateTimerDisplay(key);
    }, 1000);
  }
  herteken();
}

function timerReset(key) {
  const s = timerState[key];
  clearInterval(s.intervalId);
  s.resterend = s.totaal;
  s.actief = false;
  s.done = false;
  herteken();
}

function updateTimerDisplay(key) {
  const s = timerState[key];
  const timeEl = document.getElementById(`time_${key}`);
  const ringWrap = document.getElementById(`ring_${key}`);
  const btnEl = document.getElementById(`btn_${key}`);
  if (!timeEl || !ringWrap) return; // kaart niet meer zichtbaar

  const mm = Math.floor(s.resterend / 60);
  const ss = s.resterend % 60;
  timeEl.textContent = `${mm}:${String(ss).padStart(2, '0')}`;

  const r = 52;
  const circumference = 2 * Math.PI * r;
  const progressFrac = s.resterend / s.totaal;
  const fg = ringWrap.querySelector('.timer-ring-fg');
  if (fg) fg.setAttribute('stroke-dashoffset', circumference * (1 - progressFrac));

  if (s.done) {
    ringWrap.classList.add('done');
    if (btnEl) btnEl.textContent = 'Start';
  }
}

function timerAfgerond() {
  toast('Tijd voorbij ✓');
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]); // werkt niet op iOS Safari — die ondersteunt deze API niet, geen fix mogelijk
  try {
    const ctx = gedeeldeAudioCtx;
    if (!ctx) return; // context is nooit ontgrendeld (bv. timer nooit via Start-knop gestart)
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
  } catch (e) { /* geluid niet beschikbaar, geen probleem */ }
}

function herteken() {
  // Bewaar eerst wat er al in de huidige kaart is ingevuld, zodat het uitklappen van
  // een timer of uitleg-blok (die deze functie aanroepen) geen ingevulde reps/gewicht/
  // RIR/vorm resettten wanneer de kaart hierdoor opnieuw wordt opgebouwd.
  bewaarHuidigeKaart();
  if (huidigLogDag) renderLogKaart();
}

// ============================================================
// LOGGEN — één kaart per oefening (incl. warm-up/cooldown), met navigatie
// ============================================================
let logOefeningen = [];   // huidige lijst kaarten voor de actieve logsessie
let logIndex = 0;
let logData = {};

function renderLoggen(dagId) {
  const dag = SCHEMA.dagen.find(d => d.id === dagId);
  if (!dag) return renderTrainenMenu();

  if (!ingelogd) {
    setHeader(`Loggen · ${dag.kort.replace('\n', ' ')}`, "Log in om te loggen", [
      { label: 'Home', action: () => go('home') },
      { label: 'Trainen', action: () => go('trainen') },
      { label: 'Loggen', action: () => {} }
    ]);
    app.innerHTML = renderLoginBox();
    return;
  }

  // Noodversie: eerst skill/strength/hypertrophy laten kiezen voordat de kaart-flow start.
  if (dag.isNoodtraining) {
    if (!noodKeuzeActief) {
      // Echte nieuwe start (vanuit het dag-overzicht): keuzes leegmaken en de sessie openen.
      noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() };
      noodKeuzeActief = true;
    }
    const alleKeuzesGemaakt = noodKeuze.skill && noodKeuze.strength && noodKeuze.hypertrophy;
    if (!alleKeuzesGemaakt) {
      renderNoodKeuzeScherm(dag);
      return;
    }
    if (!huidigLogDag || huidigLogDag.id !== dag.id || !huidigLogDag._noodOpgebouwd) {
      huidigLogDag = dag;
      huidigLogDag._noodOpgebouwd = true;
      logOefeningen = [
        { type: 'warmup', naam: 'Warm-up', items: dag.warmup },
        { type: 'skill', ...noodKeuze.skill },
        { type: 'strength', ...noodKeuze.strength },
        { type: 'hypertrophy', ...noodKeuze.hypertrophy },
        { type: 'cooldown', naam: 'Cooldown', items: dag.cooldown }
      ];
      logIndex = 0;
      logData = {};
      timerState = {};
      uitlegOpen = {};
    }
    renderLogKaart();
    return;
  }

  if (!huidigLogDag || huidigLogDag.id !== dag.id) {
    huidigLogDag = dag;
    logOefeningen = [
      { type: 'warmup', naam: 'Warm-up', items: dag.warmup },
      ...dag.skill.oefeningen.map(o => ({ type: 'skill', ...o })),
      ...(dag.strength || []).map(o => ({ type: 'strength', ...o })),
      ...(dag.hypertrophy || []).map(o => ({ type: 'hypertrophy', ...o })),
      ...(dag.legs || []).map(o => ({ type: 'legs', ...o })),
      { type: 'cooldown', naam: 'Cooldown', items: dag.cooldown }
    ];
    logIndex = 0;
    logData = {};
    timerState = {};
    uitlegOpen = {};
  }

  renderLogKaart();
}

function renderLogKaart() {
  const item = logOefeningen[logIndex];
  const totaal = logOefeningen.length;
  const isLaatste = logIndex === totaal - 1;
  const isEerste = logIndex === 0;

  setHeader(`Loggen · ${huidigLogDag.kort.replace('\n', ' ')}`, `${logIndex + 1} van ${totaal}`, [
    { label: 'Home', action: () => go('home') },
    { label: 'Trainen', action: () => go('trainen') },
    { label: 'Loggen', action: () => {} }
  ]);

  const dots = logOefeningen.map((_, i) => `
    <div class="prog-dot ${i === logIndex ? 'active' : ''} ${logData[i] || (logOefeningen[i].type === 'warmup' || logOefeningen[i].type === 'cooldown') && i < logIndex ? 'done' : ''}"></div>
  `).join('');

  let kaartHtml = '';
  let uitlegHtml = '';
  if (item.type === 'warmup' || item.type === 'cooldown') {
    kaartHtml = renderWarmupCooldownKaart(item, logIndex);
  } else {
    kaartHtml = renderOefeningKaart(item, logIndex);
    uitlegHtml = renderUitlegBlock(item.naam, logIndex);
  }

  app.innerHTML = `
    <div class="prog-dots">${dots}</div>
    ${kaartHtml}
    <div class="log-nav">
      <button class="btn nav-btn" onclick="logVorige()" ${isEerste ? 'disabled' : ''}>← Vorige</button>
      ${isLaatste
        ? `<button class="btn primary nav-btn" onclick="logAfronden()">Afronden ✓</button>`
        : `<button class="btn primary nav-btn" onclick="logVolgende()">Volgende →</button>`}
    </div>
    ${uitlegHtml}
  `;
}

function renderWarmupCooldownKaart(item, idx) {
  const isCooldown = item.type === 'cooldown';
  const itemsHtml = item.items.map((w, wi) => {
    const setsInfo = parseSetsEnTijd(w.target);

    let timersHtml = '';
    if (setsInfo) {
      // Sets×seconden-item (bv. "2×30 sec", "2×15 sec"): één losse timer per set.
      let setTimers = '';
      for (let s = 1; s <= setsInfo.sets; s++) {
        const key = `${idx}_${wi}_${s}`;
        setTimers += `
          <div class="wc-set-timer">
            <span class="wc-set-label">Set ${s}</span>
            ${renderTimerBlock(key, setsInfo.secPerSet)}
          </div>
        `;
      }
      timersHtml = setTimers;
    } else if (!w.target && w.sec) {
      // Geen target-structuur, puur een doorlopende tijdsduur (bv. "Jumping jacks", "Polsroutine").
      const key = `${idx}_${wi}`;
      timersHtml = renderTimerBlock(key, w.sec);
    }
    // Overige gevallen (target zonder "sec", zoals "2×15" reps of "4 per kant"): geen timer.

    return `
      <div class="wc-item">
        <div class="wc-name">${w.naam}</div>
        <div class="wc-dur">${w.target ? w.target : `${w.sec}s`}</div>
        ${timersHtml}
      </div>
    `;
  }).join('');

  return `
    <div class="log-ex log-ex-single">
      <div class="ex-title">${isCooldown ? 'Cooldown' : 'Warm-up'}</div>
      <div class="ex-target">${item.items.length} onderdelen</div>
      ${itemsHtml}
    </div>
  `;
}

function renderUitlegBlock(naam, idx) {
  const uitleg = OEFENING_UITLEG[naam];
  if (!uitleg) return '';
  const open = !!uitlegOpen[idx];

  return `
    <div class="uitleg-standalone">
      <button type="button" class="btn uitleg-toggle-btn full ${open ? 'open' : ''}" onclick="toggleUitleg(${idx})">
        <span>📖 Meer uitleg${open ? ' verbergen' : ''}</span>
        <span class="uitleg-chevron ${open ? 'open' : ''}">⌄</span>
      </button>
      ${open ? `
        <div class="uitleg-content">
          <div class="uitleg-row"><span class="uitleg-label">Begin</span><span>${uitleg.begin}</span></div>
          <div class="uitleg-row"><span class="uitleg-label">Eind</span><span>${uitleg.eind}</span></div>
          <div class="uitleg-row"><span class="uitleg-label">Let op</span><span>${uitleg.let_op}</span></div>
        </div>
      ` : ''}
    </div>
  `;

function toggleUitleg(idx) {
  uitlegOpen[idx] = !uitlegOpen[idx];
  herteken();
}

// ============================================================
// DRAAIWIEL — halve-cirkel dial control voor reps/seconden per set
// ============================================================
// ============================================================
// LINEAAL-CONTROL — schuifbare meetlat met vaste middenwijzer, horizontaal
// (reps/seconden) of verticaal (gewicht). Vloeiend slepen, magneet-snap naar
// de dichtstbijzijnde stap bij loslaten, geen +/- knoppen.
// ============================================================

// Hoeveel px op het scherm één stap inneemt op de lineaal.
const LINEAAL_PX_PER_EENHEID = 18;

function renderDraaiwiel(id, waarde, max, eenheid, richting, stap) {
  richting = richting || 'horizontaal';
  stap = stap || 1;
  const veilig = Math.max(0, Math.min(max, parseFloat(waarde) || 0));
  const isVert = richting === 'verticaal';
  const aantalTikken = Math.round(max / stap);
  // Om de hoeveel stappen een groot streepje + cijfer komt. Gekozen zodat er, net als bij
  // gewicht, altijd meerdere referentiepunten tegelijk zichtbaar zijn in het venster
  // (venster ≈ 200px, dus grootElke * LINEAAL_PX_PER_EENHEID moet daar ruim onder blijven).
  const grootElke = stap < 1 ? Math.round(1 / stap) : 3;

  // Elke stap krijgt een streepje (klein), elke grootElke-ste stap een groter streepje + cijfer.
  let tikjes = '';
  for (let i = 0; i <= aantalTikken; i++) {
    const stapWaarde = Math.round(i * stap * 100) / 100;
    const groot = i % grootElke === 0;
    const pos = i * LINEAAL_PX_PER_EENHEID;
    const posProp = isVert ? 'top' : 'left';
    tikjes += `<div class="lineaal-tik ${groot ? 'groot' : ''}" style="${posProp}:${pos}px"></div>`;
    if (groot) {
      tikjes += `<div class="lineaal-cijfer" style="${posProp}:${pos}px">${stapWaarde}</div>`;
    }
  }

  return `
    <div class="lineaal-wrap ${isVert ? 'verticaal' : ''}" id="wrap_${id}">
      <div class="lineaal-venster" id="venster_${id}">
        <div class="lineaal-wijzer"></div>
        <div class="lineaal-strook" id="strook_${id}" data-max="${max}" data-stap="${stap}" data-value="${veilig}" data-id="${id}">
          ${tikjes}
        </div>
        <div class="lineaal-fade lineaal-fade-l"></div>
        <div class="lineaal-fade lineaal-fade-r"></div>
      </div>
      <div class="draaiwiel-waarde"><span id="val_${id}">${veilig}</span></div>
      <input type="hidden" id="${id}" value="${veilig}">
    </div>
  `;
}

function draaiwielIsVert(strook) {
  return strook.closest('.lineaal-wrap').classList.contains('verticaal');
}

function draaiwielFormatteer(waarde, stap) {
  // Bij hele stappen (reps) een heel getal tonen, bij decimale stappen (gewicht) netjes afronden.
  return stap < 1 ? (Math.round(waarde * 2) / 2).toString() : Math.round(waarde).toString();
}

function draaiwielUpdateVisueel(id, waarde, magTrillen) {
  const strook = document.getElementById(`strook_${id}`);
  if (!strook) return;
  const max = parseFloat(strook.dataset.max);
  const stap = parseFloat(strook.dataset.stap) || 1;
  const vorige = parseFloat(strook.dataset.value);
  const veilig = Math.max(0, Math.min(max, waarde));
  const isVert = draaiwielIsVert(strook);

  const offsetPx = (veilig / stap) * LINEAAL_PX_PER_EENHEID;
  strook.style.transform = isVert ? `translateY(-${offsetPx}px)` : `translateX(-${offsetPx}px)`;

  document.getElementById(`val_${id}`).textContent = draaiwielFormatteer(veilig, stap);
  document.getElementById(id).value = veilig;
  strook.dataset.value = veilig;

  if (magTrillen !== false && veilig !== vorige && navigator.vibrate) {
    navigator.vibrate(8);
  }
}

// Tijdens het slepen: de strook vloeiend op de exacte (niet-gekwantiseerde) pixelpositie
// zetten, geen snap en geen trilling. Het cijfer toont alvast de dichtstbijzijnde stap.
function draaiwielUpdateVloeiend(id, exacteWaarde) {
  const strook = document.getElementById(`strook_${id}`);
  if (!strook) return;
  const max = parseFloat(strook.dataset.max);
  const stap = parseFloat(strook.dataset.stap) || 1;
  const veilig = Math.max(0, Math.min(max, exacteWaarde));
  const isVert = draaiwielIsVert(strook);

  const offsetPx = (veilig / stap) * LINEAAL_PX_PER_EENHEID;
  strook.style.transform = isVert ? `translateY(-${offsetPx}px)` : `translateX(-${offsetPx}px)`;

  const dichtstbijzijnd = Math.round(veilig / stap) * stap;
  document.getElementById(`val_${id}`).textContent = draaiwielFormatteer(dichtstbijzijnd, stap);
  strook.dataset.slependeWaarde = veilig;
}

// Bij loslaten: snap (met korte animatie) naar de dichtstbijzijnde stap,
// werk de echte waarde bij, en trilt daar precies één keer.
function draaiwielSnapNaarDichtstbijzijnde(id) {
  const strook = document.getElementById(`strook_${id}`);
  if (!strook) return;
  const stap = parseFloat(strook.dataset.stap) || 1;
  const exact = parseFloat(strook.dataset.slependeWaarde);
  const bron = isNaN(exact) ? parseFloat(strook.dataset.value) : exact;
  const dichtstbijzijnd = Math.round(bron / stap) * stap;

  strook.classList.add('snappen');
  draaiwielUpdateVisueel(id, dichtstbijzijnd, true);
  setTimeout(() => strook.classList.remove('snappen'), 180);
}

function draaiwielVanPositie(id, clientPos, startPos, startWaarde) {
  const strook = document.getElementById(`strook_${id}`);
  const stap = parseFloat(strook.dataset.stap) || 1;
  const deltaPx = clientPos - startPos;
  const deltaStappen = deltaPx / LINEAAL_PX_PER_EENHEID; // NIET afgerond — vloeiende sleep
  const exacteWaarde = startWaarde - (deltaStappen * stap); // slepen "voorwaarts" = waarde omlaag, strook schuift mee
  draaiwielUpdateVloeiend(id, exacteWaarde);
}

function draaiwielInit(id) {
  const venster = document.getElementById(`venster_${id}`);
  const strook = document.getElementById(`strook_${id}`);
  if (!venster || !strook) return;
  const isVert = draaiwielIsVert(strook);
  let slepen = false;
  let startPos = 0;
  let startWaarde = parseFloat(strook.dataset.value);

  const start = (e) => {
    slepen = true;
    strook.classList.remove('snappen');
    const point = e.touches ? e.touches[0] : e;
    startPos = isVert ? point.clientY : point.clientX;
    startWaarde = parseFloat(strook.dataset.value);
    e.preventDefault();
  };
  const beweeg = (e) => {
    if (!slepen) return;
    const point = e.touches ? e.touches[0] : e;
    const pos = isVert ? point.clientY : point.clientX;
    draaiwielVanPositie(id, pos, startPos, startWaarde);
  };
  const stop = () => {
    if (!slepen) return;
    slepen = false;
    draaiwielSnapNaarDichtstbijzijnde(id);
  };

  venster.addEventListener('mousedown', start);
  venster.addEventListener('touchstart', start, { passive: false });
  window.addEventListener('mousemove', beweeg);
  window.addEventListener('touchmove', beweeg, { passive: false });
  window.addEventListener('mouseup', stop);
  window.addEventListener('touchend', stop);
}


function renderOefeningKaart(o, idx) {
  const isSkill = o.type === 'skill';
  const isTijd = o.eenheid === 'sec'; // expliciet per oefening bepaald, niet aangenomen op basis van categorie
  const numSets = parseInt((o.target.match(/^(\d+)×/) || [null, 3])[1]);
  const bewaard = logData[idx] || {};
  const holdSeconden = timerSeconden(o);
  const rustSec = rustSeconden(o);
  const timerKey = `ex_${idx}`;
  const rustTimerKey = `rust_${idx}`;

  let setsHtml = '';
  const repsWielIds = [];
  const gewichtWielIds = [];
  for (let s = 1; s <= numSets; s++) {
    const bewaardeReps = bewaard.sets && bewaard.sets[s] ? bewaard.sets[s].reps : '';
    const bewaardeGewicht = bewaard.sets && bewaard.sets[s] ? bewaard.sets[s].gewicht : (o.gewicht || 0);
    const repsWielId = `reps_${s}`;
    repsWielIds.push(repsWielId);
    const repsMax = isTijd ? 120 : 30;
    const repsStart = bewaardeReps !== '' ? bewaardeReps : 0;
    const gewichtWielId = `gewicht_${s}`;
    if (!isSkill) gewichtWielIds.push(gewichtWielId);
    setsHtml += `
      <div class="set-blok">
        <div class="set-blok-titel">Set ${s}</div>
        <div class="set-blok-rij">
          <div class="wiel-paneel reps-paneel">
            <div class="wiel-paneel-titel">${isTijd ? 'Seconden' : 'Reps'}</div>
            ${renderDraaiwiel(repsWielId, repsStart, repsMax, isTijd ? 'sec' : 'reps', 'horizontaal', 1)}
          </div>
          ${!isSkill ? `
          <div class="wiel-paneel gewicht-paneel">
            <div class="wiel-paneel-titel">Gewicht</div>
            ${renderDraaiwiel(gewichtWielId, bewaardeGewicht, 20, 'kg', 'verticaal', 0.5)}
          </div>` : ''}
        </div>
      </div>
    `;
  }

  // Draaiwielen initialiseren zodra de kaart in de DOM staat: events koppelen
  // én de strook direct op de juiste startpositie zetten (geen trilling bij init).
  setTimeout(() => [...repsWielIds, ...gewichtWielIds].forEach(id => {
    draaiwielInit(id);
    const strook = document.getElementById(`strook_${id}`);
    if (strook) draaiwielUpdateVisueel(id, parseFloat(strook.dataset.value), false);
  }), 0);

  return `
    <div class="log-ex log-ex-single">
      <div class="ex-title">${o.naam}</div>
      <div class="ex-target">Target: ${o.target}</div>
      ${setsHtml}
      <div class="dual-select">
        <div>
          <label class="field-label">RIR</label>
          <select id="rir_sel">

function bewaarHuidigeKaart() {
  const item = logOefeningen[logIndex];
  if (item.type === 'warmup' || item.type === 'cooldown') return; // niets te loggen
  const numSets = parseInt((item.target.match(/^(\d+)×/) || [null, 3])[1]);
  const sets = {};
  for (let s = 1; s <= numSets; s++) {
    const repsEl = document.getElementById(`reps_${s}`);
    const gewichtEl = document.getElementById(`gewicht_${s}`);
    if (!repsEl) continue;
    sets[s] = {
      reps: repsEl.value,
      gewicht: item.type === 'skill' ? null : (gewichtEl ? parseFloat(gewichtEl.value) : null)
    };
  }
  const rirEl = document.getElementById('rir_sel');
  const vormEl = document.getElementById('vorm_sel');
  logData[logIndex] = {
    sets,
    rir: rirEl ? rirEl.value : null,
    vorm: vormEl ? vormEl.value : null
  };
}

function logVolgende() {
  bewaarHuidigeKaart();
  logIndex++;
  renderLogKaart();
}

function logVorige() {
  bewaarHuidigeKaart();
  logIndex--;
  renderLogKaart();
}

function logAfronden() {
  bewaarHuidigeKaart();
  // Actieve timers stoppen zodat er geen lopende intervals achterblijven.
  Object.values(timerState).forEach(s => { if (s.intervalId) clearInterval(s.intervalId); });
  const dagId = huidigLogDag.id;
  slaLogDataOpInFirestore(huidigLogDag, logOefeningen, logData)
    .then(() => toast('Training opgeslagen ✓'))
    .catch(() => toast('Opslaan mislukt — check je internetverbinding'));
  huidigLogDag = null;
  logData = {};
  logIndex = 0;
  timerState = {};
  uitlegOpen = {};
  noodKeuze = { skill: null, strength: null, hypertrophyDag: null, hypertrophy: null, hitMuscles: leegHitMuscles() };
  noodKeuzeActief = false;
  setTimeout(() => go('trainen/' + dagId), 900);
}

/**
 * Schrijft elke gelogde oefening als los document naar de Firestore-collectie "logs".
 * Eén document per oefening (niet per hele training) zodat de progressie-pagina
 * makkelijk kan filteren op oefeningNaam zonder door geneste sets te hoeven zoeken.
 * @param {Object} dag - het dag-object (voor dagId/dagNaam op elk document)
 * @param {Array} oefeningen - logOefeningen: de kaarten van de sessie
 * @param {Object} data - logData: per kaart-index de ingevulde sets/rir/vorm
 * @returns {Promise}
 */
function slaLogDataOpInFirestore(dag, oefeningen, data) {
  if (!window.firebaseDb || !window.firebaseAuth || !window.firebaseAuth.huidigeUser()) {
    return Promise.reject(new Error('Niet ingelogd of Firebase niet geladen'));
  }
  const schrijfacties = [];
  oefeningen.forEach((item, idx) => {
    if (item.type === 'warmup' || item.type === 'cooldown') return; // geen sets, niets op te slaan
    const ingevuld = data[idx];
    if (!ingevuld) return; // deze kaart is nooit bezocht/ingevuld
    const setsArray = Object.keys(ingevuld.sets || {}).map(setNr => ({
      set: parseInt(setNr),
      reps: ingevuld.sets[setNr].reps,
      gewicht: ingevuld.sets[setNr].gewicht
    }));
    if (setsArray.length === 0) return;
    schrijfacties.push(window.firebaseDb.voegLogToe({
      dagId: dag.id,
      dagNaam: dag.naam,
      oefeningNaam: item.naam,
      oefeningType: item.type,
      sets: setsArray,
      rir: ingevuld.rir,
      vorm: ingevuld.vorm
    }));
  });
  return Promise.all(schrijfacties);
}

/**

 * de 'gekozen'-stijl en hoeft niet ook nog als overlappend met zichzelf getoond te
 * worden — dat zou verwarrend ogen naast de goud omlijnde selectie).
 * @param {OverlapLevel} overlapLevel
 * @param {boolean} isGekozen
 * @returns {string}
 */
/**
 * Geeft de HTML voor het overlap-waarschuwingslabel, of een lege string bij "none".
 * Dit blijft ook zichtbaar op de al-gekozen optie — die info verdwijnt niet zodra je

 * los daarvan het primaire "dit is je keuze"-signaal.
 * @param {OverlapLevel} overlapLevel

 */
function renderOverlapBadge(overlapLevel) {
  if (overlapLevel === 'high') return `<div class="overlap-badge overlap-high-badge">hoge overlap</div>`;
  if (overlapLevel === 'moderate') return `<div class="overlap-badge overlap-moderate-badge">lichte overlap</div>`;
  return '';
}

/**
 * Geeft de CSS-class voor de gekleurde rand van een nood-optie-knop op basis van
 * overlapLevel (groen/geel/oranje-rood). De 'gekozen'-optie krijgt altijd de goud-
 * rand van de bestaande selectie-stijl, die wint dus in de CSS van de overlap-kleur.
 * @param {OverlapLevel} overlapLevel
 * @returns {string}
 */
function overlapRandKlasse(overlapLevel) {
  if (overlapLevel === 'high') return 'overlap-high';
  if (overlapLevel === 'moderate') return 'overlap-moderate';
  return 'overlap-none';
}

/**
 * Herberekent noodKeuze.hitMuscles volledig opnieuw vanuit de huidige (nog actieve)
 * keuzes, in plaats van cumulatief bij te werken. Dit is nodig omdat een keuze nu
 * weer afgevinkt kan worden — de spiergroepen van een ingetrokken keuze mogen dan
 * niet blijven "hangen" in hitMuscles, maar een spiergroep die ook via een ANDERE,
 * nog actieve keuze belast is moet wel behouden blijven. Simpelweg optellen bij elke
 * keuze en aftrekken bij het afvinken zou dat tweede geval fout doen; volledig
 * herberekenen vanuit de resterende keuzes is de robuuste aanpak.
 */
/**
 * Bouwt een HitMuscles-object op uit een subset van de gemaakte keuzes (bv. alleen
 * skill, of skill+strength). Wordt gebruikt om per stap alleen de ECHT voorgaande
 * categorieën mee te tellen — nooit de categorie waar je zelf middenin zit, anders
 * zou een net-gekozen optie zichzelf (en de andere opties in diezelfde stap) als
 * "hoge overlap" gaan zien.
 * @param {Array<{naam: string}|null>} keuzes
 * @returns {HitMuscles}
 */
function bouwHitMusclesUit(keuzes) {
  let hitMuscles = leegHitMuscles();
  keuzes.forEach(optie => {
    if (!optie) return;
    const exerciseData = vindExerciseData(optie.naam);
    if (!exerciseData) return;
    hitMuscles = voegOefeningToeAanHitMuscles(hitMuscles, exerciseData);
  });
  return hitMuscles;
}

/**
 * Werkt noodKeuze.hitMuscles bij tot de VOLLEDIGE cumulatieve stand (skill+strength+
 * hypertrophy samen). Dit veld wordt niet meer gebruikt om de kleur/badge van losse
 * stappen te bepalen (dat gebeurt nu per stap met bouwHitMusclesUit, zie
 * sorteerNoodOptiesOpOverlap) — het blijft wel beschikbaar als totaaloverzicht, mocht
 * dat later ergens getoond worden.
 */
function herberekenNoodHitMuscles() {
  noodKeuze.hitMuscles = bouwHitMusclesUit([noodKeuze.skill, noodKeuze.strength, noodKeuze.hypertrophy]);
}
/**
 * Combineert een lijst NOODVERSIE_KEUZES-opties (die geen spiergroep-velden hebben)
 * met hun EXERCISES-tegenhanger, filtert/sorteert op overlap met noodKeuze.hitMuscles,
 * en geeft de ORIGINELE optie-objecten terug (met naam/target/rust/etc. intact) plus
 * een toegevoegd overlapLevel-veld — zodat de bestaande render/kies-functies verder
 * ongewijzigd blijven werken op dezelfde objectvorm.
 * @param {Array<{naam: string}>} opties
 * @returns {Array<Object & {overlapLevel: OverlapLevel}>}
 */
/**
 * Berekent per optie het overlapLevel t.o.v. noodKeuze.hitMuscles, maar behoudt de
 * OORSPRONKELIJKE volgorde van de lijst (geen sortering) — de kaarten mogen niet van
 * plek wisselen zodra er een keuze wordt gemaakt, alleen de kleur/badge verandert.
 * @param {Array<{naam: string}>} opties
 * @returns {Array<Object & {overlapLevel: OverlapLevel}>}
 */
/**
 * Berekent per optie het overlapLevel t.o.v. de gegeven hitMuscles (van ALLEEN de
 * werkelijk voorgaande stappen — zie bouwHitMusclesUit), maar behoudt de OORSPRONKELIJKE
 * volgorde van de lijst (geen sortering) — de kaarten mogen niet van plek wisselen
 * zodra er een keuze wordt gemaakt, alleen de kleur/badge verandert.
 * @param {Array<{naam: string}>} opties
 * @param {HitMuscles} hitMuscles
 * @returns {Array<Object & {overlapLevel: OverlapLevel}>}
 */
function sorteerNoodOptiesOpOverlap(opties, hitMuscles) {
  return opties.map(optie => {
    const exerciseData = vindExerciseData(optie.naam);
    // Geen match gevonden -> geen spiergroep-info, dus geen overlap te detecteren.
    const dummy = exerciseData || { primaryMuscles: [], secondaryMuscles: [] };
    const overlapLevel = bepaalOverlapNiveau(dummy, hitMuscles);
    return { ...optie, overlapLevel };
  });
}

/**
 * Haalt in ÉÉN Firestore-call alle logs van de gebruiker op en groepeert ze
 * client-side per oefeningnaam, zodat het overzicht niet voor elke tegel een
 * losse query hoeft te doen. Geeft per oefening alleen het laatste (meest
 * recente) datapunt terug, wat is wat het overzicht nodig heeft.
 * @returns {Promise<Object<string, {gewicht: number}>>}
 */
async function haalLaatsteWaardePerOefeningOp() {
  if (!window.firebaseDb || !window.firebaseAuth || !window.firebaseAuth.huidigeUser()) return {};
  const logs = await window.firebaseDb.haalAlleLogsOp(); // al gesorteerd oud → nieuw
  const laatste = {};
  logs.forEach(log => {
    const maxGewicht = Math.max(0, ...(log.sets || []).map(s => parseFloat(s.gewicht) || 0));
    laatste[log.oefeningNaam] = { gewicht: maxGewicht }; // latere logs overschrijven eerdere, dus dit blijft de meest recente
  });
  return laatste;
}

    { label: oefeningNaam, action: () => {} }
  ]);

  app.innerHTML = `<div class="chart-card"><div class="empty-progress"><div class="empty-progress-title">Laden…</div></div></div>`;

  haalProgressieDataOp(oefeningNaam).then(data => {
    // De gebruiker kan intussen naar een andere pagina genavigeerd zijn — dan niet meer tonen.
    if (window.location.hash !== `#progressie/${encodeURIComponent(oefeningNaam)}`) return;

    VOORBEELD_HISTORIE[oefeningNaam] = data; // tekenChart leest hieruit, zie verderop
    const heeftData = data && data.length > 0;

    if (!heeftData) {
      app.innerHTML = `
        <div class="chart-card">
          <div class="empty-progress">
            <div class="empty-progress-title">Nog geen logs</div>
            <div class="empty-progress-sub">Zodra je deze oefening logt tijdens een training, verschijnt hier je progressie over tijd.</div>
          </div>
        </div>
      `;
      return;
    }

    // Reset naar een zinnige standaard bij het openen van een andere oefening
    if (progressieWeergave._voorOefening !== oefeningNaam) {
      progressieWeergave = { toonSets: true, toonGewicht: info.heeftGewicht, periode: 10, _voorOefening: oefeningNaam };
    }

    const periode = progressieWeergave.periode || 0;
    const zichtbareData = periode > 0 ? data.slice(-periode) : data;

    const toggleSetsHtml = `
      <button class="progress-toggle ${progressieWeergave.toonSets ? 'actief' : ''}" onclick="toggleProgressieLaag('toonSets')">${eenheidLabel}</button>
    `;
    const toggleGewichtHtml = info.heeftGewicht ? `
      <button class="progress-toggle ${progressieWeergave.toonGewicht ? 'actief' : ''}" onclick="toggleProgressieLaag('toonGewicht')">Gewicht</button>
    ` : '';

    const periodeHtml = PROGRESSIE_PERIODE_OPTIES.map(p => `
      <button class="periode-toggle ${periode === p ? 'actief' : ''}" onclick="zetProgressiePeriode(${p})">${p === 0 ? 'Alles' : `${p}`}</button>
    `).join('');

    app.innerHTML = `
      <div class="progress-toggle-row">${toggleSetsHtml}${toggleGewichtHtml}</div>
      <div class="chart-card">
        <div class="chart-sub-row">
          <div class="chart-sub">Laatste ${zichtbareData.length} sessies</div>
          <div class="periode-toggle-row">${periodeHtml}</div>
        </div>
        <div class="chart-canvas-wrap"><canvas id="progressChart"></canvas></div>
        <div class="stat-strip" id="statStrip"></div>
      </div>
    `;

    tekenChart(oefeningNaam);
  }).catch((fout) => {
    console.error('Progressie-detail laden mislukt:', fout);
    if (window.location.hash !== `#progressie/${encodeURIComponent(oefeningNaam)}`) return;
    app.innerHTML = `<div class="chart-card"><div class="empty-progress"><div class="empty-progress-title">Kon logs niet laden</div><div class="empty-progress-sub">Check je internetverbinding en probeer het opnieuw.</div></div></div>`;
  });
}

/**
 * Haalt alle Firestore-logs van één oefening op en zet ze om naar de vorm die
 * tekenChart al verwacht: één punt per SESSIE (dag), met het HOOGSTE gewicht en de
 * meeste reps/seconden van die dag (de "topset"), gesorteerd oud → nieuw.
 * @param {string} oefeningNaam
 * @returns {Promise<Array<{datum: string, gewicht: number, topReps: number}>>}
 */
async function haalProgressieDataOp(oefeningNaam) {
  if (!window.firebaseDb || !window.firebaseAuth || !window.firebaseAuth.huidigeUser()) return [];
  const logs = await window.firebaseDb.haalLogsOp(oefeningNaam);

  // Groepeer per dag (yyyy-mm-dd), want er kunnen meerdere sets/documenten per sessie zijn.
  const perDag = {};
  logs.forEach(log => {
    if (!log.aangemaaktOp || !log.aangemaaktOp.toDate) return; // serverTimestamp nog niet uitgeschreven
    const datum = log.aangemaaktOp.toDate().toISOString().slice(0, 10);
    if (!perDag[datum]) perDag[datum] = { maxGewicht: 0, maxReps: 0 };
    (log.sets || []).forEach(set => {
      const reps = parseFloat(set.reps) || 0;
      const gewicht = parseFloat(set.gewicht) || 0;
      if (reps > perDag[datum].maxReps) perDag[datum].maxReps = reps;
      if (gewicht > perDag[datum].maxGewicht) perDag[datum].maxGewicht = gewicht;
    });
  });

  return Object.keys(perDag).sort().map(datum => ({
    datum,
    gewicht: perDag[datum].maxGewicht,
    topReps: perDag[datum].maxReps
  }));
}

function zetProgressiePeriode(p) {
  progressieWeergave.periode = p;
  renderProgressieDetail(progressieWeergave._voorOefening);
}

function toggleProgressieLaag(laag) {
  // Minstens één laag moet altijd aan blijven staan.
  const andereLaag = laag === 'toonSets' ? 'toonGewicht' : 'toonSets';
  if (progressieWeergave[laag] && !progressieWeergave[andereLaag]) return;
  progressieWeergave[laag] = !progressieWeergave[laag];
  renderProgressieDetail(progressieWeergave._voorOefening);
}

function tekenChart(oefeningNaam) {
  const volledigeData = VOORBEELD_HISTORIE[oefeningNaam];
  if (!volledigeData) return;
  const periode = progressieWeergave.periode || 0;
  const data = periode > 0 ? volledigeData.slice(-periode) : volledigeData;
  const info = OEFENING_EENHEID[oefeningNaam] || { eenheid: 'reps', heeftGewicht: true };
  const eenheidLabel = info.eenheid === 'sec' ? 'Seconden' : 'Reps';

  const ctx = document.getElementById('progressChart').getContext('2d');
  if (actieveChart) actieveChart.destroy();

  const rootStyles = getComputedStyle(document.documentElement);
  const clay = rootStyles.getPropertyValue('--clay-bright').trim();
  const moss = rootStyles.getPropertyValue('--moss-bright').trim();
  const textDim = rootStyles.getPropertyValue('--text-dim').trim();
  const border = rootStyles.getPropertyValue('--border').trim();

  const labels = data.map(d => {
    const dt = new Date(d.datum);
    return `${dt.getDate()}/${dt.getMonth() + 1}`;
  });

  const datasets = [];
  const scales = {
    x: { ticks: { color: textDim, font: { family: 'SF Mono', size: 10 } }, grid: { color: border, drawTicks: false } }
  };

  if (progressieWeergave.toonSets) {
    datasets.push({
      type: 'bar',
      label: eenheidLabel,
      data: data.map(d => d.topReps),
      backgroundColor: moss + (progressieWeergave.toonGewicht ? '99' : 'cc'),
      borderRadius: 4,
      yAxisID: 'ySets',
      order: 2
    });
    scales.ySets = {
      position: 'left',
      ticks: { color: moss, font: { family: 'SF Mono', size: 10 } },
      grid: { color: border },
      title: { display: true, text: eenheidLabel, color: moss, font: { family: 'SF Mono', size: 10 } }
    };
  }

  if (progressieWeergave.toonGewicht && info.heeftGewicht) {
    datasets.push({
      type: 'line',
      label: 'Gewicht (kg)',
      data: data.map(d => d.gewicht),
      borderColor: clay,
      backgroundColor: clay + '33',
      pointBackgroundColor: clay,
      pointRadius: 3,
      tension: 0.35,
      fill: progressieWeergave.toonSets ? false : true,
      borderWidth: 2,
      yAxisID: 'yGewicht',
      order: 1
    });
    scales.yGewicht = {
      position: 'right',
      ticks: { color: clay, font: { family: 'SF Mono', size: 10 } },
      grid: { drawOnChartArea: !progressieWeergave.toonSets, color: border },
      title: { display: true, text: 'kg', color: clay, font: { family: 'SF Mono', size: 10 } }
    };
  }

  actieveChart = new Chart(ctx, {
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: datasets.length > 1,
          labels: { color: textDim, font: { family: 'SF Mono', size: 11 }, boxWidth: 12 }
        }
      },
      scales
    }
  });

  const laatste = data[data.length - 1];
  const eerste = data[0];
  const deltaGewicht = Math.round((laatste.gewicht - eerste.gewicht) * 100) / 100;

  const statsHtml = [];
  if (info.heeftGewicht) {
    statsHtml.push(`<div class="stat"><div class="v">${laatste.gewicht}kg</div><div class="l">HUIDIG</div></div>`);
    statsHtml.push(`<div class="stat"><div class="v">+${deltaGewicht}kg</div><div class="l">SINDS START</div></div>`);
  }
  statsHtml.push(`<div class="stat"><div class="v">${laatste.topReps}</div><div class="l">TOP ${eenheidLabel.toUpperCase()}</div></div>`);

  document.getElementById('statStrip').innerHTML = statsHtml.join('');
}

// ============================================================

// Houdt `ingelogd` synchroon met de echte Firebase Auth-status — dit vangt ook het
// geval af waarin iemand de pagina herlaadt terwijl Firebase de sessie nog onthoudt
// (Firebase Auth blijft standaard ingelogd tussen bezoeken), en het geval waarin de
// sessie serverside verlopen is.
// Toont de app meteen (knoppen/navigatie werken los van Firebase). Zodra Firebase
// geladen is, wordt de auth-status gekoppeld — maar de eerste render wacht daar
// NIET op, anders blijft de hele pagina leeg zodra Firebase traag laadt of om wat
// voor reden dan ook niet beschikbaar is (netwerk, adblocker, CDN-storing).
route();

function koppelFirebaseAuthZodraBeschikbaar() {
  if (!window.firebaseAuth) {
    setTimeout(koppelFirebaseAuthZodraBeschikbaar, 50);
    return;
  }
  window.firebaseAuth.onChange((user) => {
    const wasIngelogd = ingelogd;
    ingelogd = !!user;
    if (wasIngelogd !== ingelogd) route(); // alleen opnieuw renderen bij een echte statuswijziging
  });
}
koppelFirebaseAuthZodraBeschikbaar();

</script>
